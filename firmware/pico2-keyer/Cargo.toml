[package]
name = "pico2-keyer"
version = "0.1.0"
description = "Firmware for the keyer box: a Raspberry Pi Pico 2 that keys any radio's key jack for hfnode"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: it builds only for the RP2350 (thumbv8m.main-none-eabihf,
# set in .cargo/config.toml), so it is not a member of the hfnode workspace.
[workspace]

[[bin]]
name = "pico2-keyer"
test = false
bench = false

[dependencies]
# The box's rules, shared with hfnode's mock box.
keyer-core = { path = "../../crates/keyer-core" }
# rustos (github.com/robinonsay/rustos): the Pico 2 runtime and drivers, at the
# commit that adds the timer no debugger pauses, SysTick, the application's
# watchdog scratch registers and the fault handlers' safe state, stacked on the
# PWM driver and its reset-safe silence_all (rustos branch
# claude/keyer-unattended-d05o6i, on rustos #2 at c1c82c9 and
# master cfc2b140; merged with merge commits, it stays reachable from master).
api = { git = "https://github.com/robinonsay/rustos", rev = "c9852112283c741b19d7337f30966c2eaab75751" }
pico2 = { git = "https://github.com/robinonsay/rustos", rev = "c9852112283c741b19d7337f30966c2eaab75751" }

# The runtime has no unwinder.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
debug = true
lto = true
codegen-units = 1
