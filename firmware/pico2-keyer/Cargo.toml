[package]
name = "pico2-keyer"
version = "0.1.0"
description = "Firmware for the keyer box: a Raspberry Pi Pico 2 that keys any radio's key jack for hfnode"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: it builds only for the RP2350 (thumbv8m.main-none-eabihf,
# set in .cargo/config.toml), so it is not a member of the hfnode workspace.
[workspace]

[[bin]]
name = "pico2-keyer"
test = false
bench = false

[dependencies]
# The box's rules, shared with hfnode's mock box.
keyer-core = { path = "../../crates/keyer-core" }
# The decoder that runs on the box's second core: the decoder box's loop, tested
# on a computer against a board in memory.
decoder-core = { path = "../../crates/decoder-core" }
# rustos (github.com/robinonsay/rustos): the Pico 2 runtime and drivers, at the
# head of rustos #6 (starting core 1, and the USB queue's room), on master's merge
# of rustos #5 (the ADC and DMA drivers). Moved from master's merge of rustos #4, which the audit checked
# with the keyer image eef8c126; moving this pin can change the UF2 with no source
# change, since cargo mixes the commit into the crate hashes that order the code.
# To be moved to master's merge of rustos #6 once it is merged.
api = { git = "https://github.com/robinonsay/rustos", rev = "410dffa091e247e6e7546c7f2ff465f0af499d5a" }
pico2 = { git = "https://github.com/robinonsay/rustos", rev = "410dffa091e247e6e7546c7f2ff465f0af499d5a" }

# The runtime has no unwinder.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
debug = true
lto = true
codegen-units = 1
