<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1082" width="720" height="1082" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The test layers from cheapest to most real: unit tests, host end-to-end tests, self-test scenarios against mocks and firmware checks run in CI; the safety audit and the hardware bench are done by people</title>
  <defs>
    <marker id="k12t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1082" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">Test layers, cheapest first</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">What each layer runs and who runs it. CI runs layers 1 to 4; people do 5 and 6.</text>

  <!-- cheap to real axis -->
  <text x="24" y="96" font-size="14" fill="#4b5563">cheapest, fastest</text>
  <line x1="44" y1="110" x2="44" y2="942" stroke="#374151" stroke-width="2" marker-end="url(#k12t-arrow)"/>
  <text x="24" y="966" font-size="14" fill="#4b5563">most real</text>

  <!-- layer 1 -->
  <rect x="72" y="110" width="508" height="112" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="88" y="138" font-weight="bold">1. Unit tests, next to the code</text>
  <text x="88" y="162" font-size="14">689 <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">#[test]</tspan> functions in the six crates (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cargo test --all</tspan>)</text>
  <text x="88" y="184" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">keyer-core</tspan>: the box firmware's rules on a board in memory</text>
  <text x="88" y="206" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cw</tspan> again with libm and without std (Linux job)</text>

  <!-- layer 2 -->
  <rect x="72" y="244" width="508" height="112" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="88" y="272" font-weight="bold">2. Host end-to-end tests</text>
  <text x="88" y="296" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">end_to_end, stop_signal,</text>
  <text x="88" y="318" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">supervise_script, deploy_unit</text>
  <text x="88" y="340" font-size="14">the node on <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SimRig</tspan>; stop signals, the supervisor script, unit file</text>

  <!-- layer 3 -->
  <rect x="72" y="378" width="508" height="134" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="88" y="406" font-weight="bold">3. Self-test scenarios against mocks</text>
  <text x="88" y="430" font-size="14">85 mock IC-7300 scenarios at 20x on CI, 8 keyer box at 5x</text>
  <text x="88" y="452" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mock_radio_e2e, keyer_e2e, sweep_e2e,</text>
  <text x="88" y="474" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode selftest</text>
  <text x="88" y="496" font-size="14">by hand: the full 480-run sweep, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode testvectors</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">--scale 1</tspan></text>

  <!-- layer 4 -->
  <rect x="72" y="534" width="508" height="168" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="88" y="562" font-weight="bold">4. Firmware checks</text>
  <text x="88" y="586" font-size="14">UV-K1 host test, in C, under ASan and UBSan</text>
  <text x="88" y="608" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_faults.py</tspan> reads the keyer ELF's machine code</text>
  <rect x="88" y="622" width="476" height="64" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="104" y="648" font-size="14">PR #30, #31 (not on main): <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_pins.py</tspan> and</text>
  <text x="104" y="670" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_core1.py</tspan> in CI; the mutants scripts by hand</text>

  <!-- layer 5 -->
  <rect x="72" y="724" width="508" height="98" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="88" y="752" font-weight="bold">5. Safety audit</text>
  <text x="88" y="776" font-size="14">reads the code, the radio manual and the datasheets</text>
  <text x="88" y="798" font-size="14">gates every flash and every keyed test</text>

  <!-- layer 6 -->
  <rect x="72" y="844" width="508" height="98" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="88" y="872" font-weight="bold">6. Hardware bench</text>
  <text x="88" y="896" font-size="14">staged steps with Robin at the radio, on her go</text>
  <text x="88" y="918" font-size="14">under way on no-RF steps; nothing has transmitted yet</text>

  <!-- brackets -->
  <path d="M588,110 L600,110 L600,702 L588,702" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="610" y="388" font-size="14">CI runs</text>
  <text x="610" y="408" font-size="14">these on</text>
  <text x="610" y="428" font-size="14">every push</text>
  <path d="M588,724 L600,724 L600,942 L588,942" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="610" y="826" font-size="14">people,</text>
  <text x="610" y="846" font-size="14">not CI</text>

  <!-- legend -->
  <text x="24" y="1006" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1018" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="50" y="1030" font-size="14">host code</text>
  <rect x="140" y="1018" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="166" y="1030" font-size="14">firmware</text>
  <rect x="250" y="1018" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="276" y="1030" font-size="14">safety</text>
  <rect x="340" y="1018" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="366" y="1030" font-size="14">hardware</text>
  <rect x="460" y="1018" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="486" y="1030" font-size="14">not on main yet</text>
</svg>
