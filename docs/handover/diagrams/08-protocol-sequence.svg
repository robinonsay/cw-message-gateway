<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1966" width="720" height="1966" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="1966" fill="#ffffff"/>
  <title>Sequence diagrams between hfnode, the box and the radio's key line: a normal session with HELLO, STOP, STATUS, a CW run kept alive by STATUS every 250 ms; a run ended by host silence after 2 s; and a stuck-key test that trips the box</title>
  <defs>
    <marker id="k08q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="16" y="34" font-size="20" font-weight="bold">The keyer protocol, version 4, in use</text>
  <text x="16" y="56" font-size="14" fill="#4b5563">Time runs down. Every line is a real frame: id, body, *checksum. Times are examples.</text>
  <line x1="650" y1="154" x2="650" y2="812" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="154" x2="500" y2="812" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="96" y1="154" x2="96" y2="812" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="16" y="86" font-size="16" font-weight="bold">A. A normal session</text>
  <text x="16" y="106" font-size="14" fill="#4b5563">hfnode's start (HELLO, STOP, STATUS), then one CW run kept alive by STATUS</text>
  <rect x="21" y="120" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="96" y="143" font-size="16" text-anchor="middle" font-weight="bold">hfnode</text>
  <rect x="425" y="120" width="150" height="34" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="500" y="143" font-size="16" text-anchor="middle" font-weight="bold">keyer box</text>
  <rect x="595" y="120" width="110" height="34" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="143" font-size="16" text-anchor="middle" font-weight="bold">key line</text>
  <text x="108" y="176" font-size="14" fill="#4b5563">hfnode opens the port only if the system lists</text>
  <text x="108" y="202" font-size="14" fill="#4b5563">its USB product name as PICO2-KEYER</text>
  <text x="108" y="228" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">11 HELLO*62</text>
  <line x1="98" y1="237" x2="498" y2="237" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="262" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">11 OK HELLO 4 60 2000 1000 1000 60 60</text>
  <text x="124" y="280" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8412 POWER eef8c126 PICO2-KEYER*44</text>
  <text x="124" y="298" font-size="14" fill="#4b5563">(the two rows above are one line on the wire)</text>
  <line x1="498" y1="307" x2="98" y2="307" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="332" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">12 STOP*3B</text>
  <line x1="98" y1="341" x2="498" y2="341" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="366" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">12 OK STOP*1F</text>
  <line x1="498" y1="375" x2="98" y2="375" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="400" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">13 STATUS*36</text>
  <line x1="98" y1="409" x2="498" y2="409" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="434" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">13 OK STATUS 0 0 NONE NONE 0 60000 0 1*15</text>
  <line x1="498" y1="443" x2="98" y2="443" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="468" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14 CW 18 CQ DE N0CALL K*3C</text>
  <line x1="98" y1="477" x2="498" y2="477" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="502" font-size="14">GP16 high</text>
  <line x1="502" y1="511" x2="642" y2="511" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="536" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14 OK CW*15</text>
  <line x1="498" y1="545" x2="98" y2="545" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="570" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">15 STATUS*30</text>
  <line x1="98" y1="579" x2="498" y2="579" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="604" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">15 OK STATUS 0 1 NONE NONE 0 59854 0 1*11</text>
  <line x1="498" y1="613" x2="98" y2="613" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="570" font-size="14" fill="#4b5563">key follows</text>
  <text x="510" y="588" font-size="14" fill="#4b5563">each dot</text>
  <text x="510" y="606" font-size="14" fill="#4b5563">and dash</text>
  <text x="108" y="638" font-size="14" fill="#4b5563">... STATUS every 250 ms; the box keys the Morse itself ...</text>
  <text x="510" y="664" font-size="14">DONE: GP16 low</text>
  <line x1="502" y1="673" x2="642" y2="673" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="698" font-size="14" fill="#4b5563">the run ends after 9.3 s; then a 1 s rest</text>
  <text x="108" y="724" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">3A STATUS*46</text>
  <line x1="98" y1="733" x2="498" y2="733" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="758" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">3A OK STATUS 0 0 DONE NONE 640 59634 0 1*66</text>
  <line x1="498" y1="767" x2="98" y2="767" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="792" font-size="14" fill="#4b5563">STATUS: key run ended trip rest-ms budget-ms ptt line</text>
  <line x1="650" y1="928" x2="650" y2="1278" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="928" x2="500" y2="1278" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="96" y1="928" x2="96" y2="1278" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="16" y="860" font-size="16" font-weight="bold">B. The host goes silent (hfnode keyer linktest)</text>
  <text x="16" y="880" font-size="14" fill="#4b5563">Not a trip: the box keys again once its 1 s rest is over</text>
  <rect x="21" y="894" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="96" y="917" font-size="16" text-anchor="middle" font-weight="bold">hfnode</text>
  <rect x="425" y="894" width="150" height="34" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="500" y="917" font-size="16" text-anchor="middle" font-weight="bold">keyer box</text>
  <rect x="595" y="894" width="110" height="34" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="917" font-size="16" text-anchor="middle" font-weight="bold">key line</text>
  <text x="108" y="950" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">41 CW 18 TTTT TTTT TTTT TTTT*18</text>
  <line x1="98" y1="959" x2="498" y2="959" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="984" font-size="14">GP16 high</text>
  <line x1="502" y1="993" x2="642" y2="993" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1018" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">41 OK CW*15</text>
  <line x1="498" y1="1027" x2="98" y2="1027" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="1044" font-size="14" fill="#4b5563">key follows</text>
  <text x="510" y="1062" font-size="14" fill="#4b5563">the Morse</text>
  <path d="M87,1038 L105,1056 M105,1038 L87,1056" stroke="#991b1b" stroke-width="3" fill="none"/>
  <text x="112" y="1052" font-size="14" fill="#991b1b">hfnode says nothing more</text>
  <text x="108" y="1078" font-size="14" fill="#4b5563">2000 ms after the last line that decoded:</text>
  <text x="510" y="1104" font-size="14">LINK: GP16 low</text>
  <line x1="502" y1="1113" x2="642" y2="1113" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1138" font-size="14" fill="#4b5563">the run ends LINK. No trip.</text>
  <text x="108" y="1164" font-size="14" fill="#4b5563">About 500 ms after the box's timeout, hfnode asks:</text>
  <text x="108" y="1190" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">42 STATUS*32</text>
  <line x1="98" y1="1199" x2="498" y2="1199" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1224" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">42 OK STATUS 0 0 LINK NONE 500 60000 0 1*1E</text>
  <line x1="498" y1="1233" x2="98" y2="1233" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1258" font-size="14" fill="#4b5563">A pulled cable or bus reset ends a run at once: USB.</text>
  <line x1="650" y1="1414" x2="650" y2="1890" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="1414" x2="500" y2="1890" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="96" y1="1414" x2="96" y2="1890" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="16" y="1326" font-size="16" font-weight="bold">C. A trip (hfnode keyer stucktest)</text>
  <text x="16" y="1346" font-size="14" fill="#4b5563">The key-down limit opens the key and latches until a power-up (a replug)</text>
  <text x="16" y="1366" font-size="14" fill="#4b5563">This comes after the node identifies itself and rests 2 s:</text>
  <rect x="21" y="1380" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="96" y="1403" font-size="16" text-anchor="middle" font-weight="bold">hfnode</text>
  <rect x="425" y="1380" width="150" height="34" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="500" y="1403" font-size="16" text-anchor="middle" font-weight="bold">keyer box</text>
  <rect x="595" y="1380" width="110" height="34" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="1403" font-size="16" text-anchor="middle" font-weight="bold">key line</text>
  <text x="108" y="1436" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">51 CW 18 TTTT TTTT*19</text>
  <line x1="98" y1="1445" x2="498" y2="1445" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="1470" font-size="14">GP16 high</text>
  <line x1="502" y1="1479" x2="642" y2="1479" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1504" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">51 OK CW*14</text>
  <line x1="498" y1="1513" x2="98" y2="1513" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1538" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">52 TEST ARM*4F</text>
  <line x1="98" y1="1547" x2="498" y2="1547" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="510" y="1572" font-size="14" fill="#4b5563">one element</text>
  <text x="510" y="1590" font-size="14" fill="#4b5563">held down</text>
  <text x="108" y="1572" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">52 OK TEST ARM*6B</text>
  <line x1="498" y1="1581" x2="98" y2="1581" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1606" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">53 TEST STUCK*4A</text>
  <line x1="98" y1="1615" x2="498" y2="1615" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1640" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">53 OK TEST STUCK*6E</text>
  <line x1="498" y1="1649" x2="98" y2="1649" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1674" font-size="14" fill="#4b5563">the box holds the element; 1000 ms after the key closed:</text>
  <text x="510" y="1700" font-size="14">DOWN: GP16 low</text>
  <line x1="502" y1="1709" x2="642" y2="1709" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1734" font-size="14" fill="#991b1b">trip DOWN, latched until the box is powered up again</text>
  <text x="108" y="1760" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">54 STATUS*35</text>
  <line x1="98" y1="1769" x2="498" y2="1769" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1794" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">54 OK STATUS 0 0 DOWN DOWN 700 59300 0 1*18</text>
  <line x1="498" y1="1803" x2="98" y2="1803" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1828" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">55 CW 18 K*76</text>
  <line x1="98" y1="1837" x2="498" y2="1837" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="108" y="1862" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">55 ERR CW TRIP*6E</text>
  <line x1="498" y1="1871" x2="98" y2="1871" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <rect x="644" y="511" width="12" height="162" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="644" y="993" width="12" height="120" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="644" y="1479" width="12" height="230" fill="#92400e"/>
  <rect x="17" y="1905" width="10" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="1918" font-size="14">run under way (A, B): GP16 follows each dot and dash, never down over 1 s</text>
  <rect x="16" y="1930" width="12" height="18" fill="#92400e"/>
  <text x="36" y="1944" font-size="14">key held closed (C)</text>
  <line x1="200" y1="1939" x2="240" y2="1939" stroke="#374151" stroke-width="2" marker-end="url(#k08q-arrow)"/>
  <text x="250" y="1944" font-size="14">one line (checksums are real)</text>
</svg>
