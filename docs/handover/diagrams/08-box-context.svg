<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>
  <title>The keyer box's neighbours: keyer-core is built into the firmware with rustos's drivers and also runs in hfnode's mock box; the firmware's UF2 reaches a Pico 2 only through the safety audit's hash and Robin's go; the box talks to hfnode's keyer rig over USB and keys a radio's key jack or an FM handheld</title>
  <defs>
    <marker id="k08c-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="16" y="34" font-size="20" font-weight="bold">The keyer box and its neighbours</text>
  <text x="16" y="56" font-size="14" fill="#4b5563">Top: what is built from what. Middle: the gate before any flash. Bottom: the box at work.</text>

  <!-- row 1: code -->
  <rect x="16" y="80" width="200" height="96" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="116" y="106" text-anchor="middle" font-weight="bold">rustos drivers</text>
  <text x="116" y="128" text-anchor="middle" font-size="14">other repo, pinned rev:</text>
  <text x="116" y="148" text-anchor="middle" font-size="14">GPIO, PWM, timer, USB,</text>
  <text x="116" y="166" text-anchor="middle" font-size="14">watchdog, fault handlers</text>

  <rect x="256" y="80" width="208" height="96" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">keyer-core</text>
  <text x="360" y="128" text-anchor="middle" font-size="14">every rule and limit:</text>
  <text x="360" y="148" text-anchor="middle" font-size="14">Keyer, Control,</text>
  <text x="360" y="166" text-anchor="middle" font-size="14">frame, morse</text>

  <rect x="504" y="80" width="200" height="96" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="604" y="106" text-anchor="middle" font-weight="bold">hfnode mock box</text>
  <text x="604" y="128" text-anchor="middle" font-size="14">self-test and tests run</text>
  <text x="604" y="148" text-anchor="middle" font-size="14">the same Keyer on a</text>
  <text x="604" y="166" text-anchor="middle" font-size="14">mock clock (pages 09, 12)</text>
  <line x1="464" y1="128" x2="504" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>

  <line x1="116" y1="176" x2="116" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>
  <line x1="360" y1="176" x2="360" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>
  <text x="128" y="204" font-size="14">built in</text>
  <text x="372" y="204" font-size="14">built in</text>

  <!-- row 2: firmware -->
  <rect x="56" y="220" width="400" height="76" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="256" y="246" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2-keyer</text>
  <text x="256" y="268" text-anchor="middle" font-size="14">CI builds one commit into pico2-keyer.uf2</text>
  <text x="256" y="286" text-anchor="middle" font-size="14">and prints its SHA-256 (build.sh)</text>
  <line x1="256" y1="296" x2="256" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>

  <!-- row 3: the gate -->
  <rect x="56" y="336" width="400" height="76" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="256" y="362" text-anchor="middle" font-weight="bold">Before any flash (page 14)</text>
  <text x="256" y="384" text-anchor="middle" font-size="14">the safety audit rebuilds the commit and</text>
  <text x="256" y="402" text-anchor="middle" font-size="14">publishes its hash; Robin says go</text>
  <line x1="256" y1="412" x2="256" y2="456" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>
  <text x="268" y="440" font-size="14">flash CI's file, hash checked</text>

  <!-- row 4: the box at work -->
  <rect x="56" y="456" width="400" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="482" text-anchor="middle" font-weight="bold">Pico 2 keyer box</text>
  <text x="256" y="504" text-anchor="middle" font-size="14">runs the flashed firmware (this page)</text>

  <rect x="520" y="456" width="184" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="612" y="482" text-anchor="middle" font-weight="bold">hfnode keyer rig</text>
  <text x="612" y="504" text-anchor="middle" font-size="14">page 09</text>
  <line x1="456" y1="488" x2="520" y2="488" stroke="#374151" stroke-width="2" marker-start="url(#k08c-arrow)" marker-end="url(#k08c-arrow)"/>
  <text x="488" y="474" text-anchor="middle" font-size="14">USB</text>

  <!-- row 5: radios -->
  <line x1="151" y1="520" x2="151" y2="580" stroke="#374151" stroke-width="2" marker-end="url(#k08c-arrow)"/>
  <text x="163" y="556" font-size="14">PC817</text>
  <line x1="361" y1="520" x2="361" y2="580" stroke="#374151" stroke-width="2" marker-start="url(#k08c-arrow)" marker-end="url(#k08c-arrow)"/>
  <text x="373" y="556" font-size="14">MCW</text>

  <rect x="56" y="580" width="190" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="151" y="606" text-anchor="middle" font-weight="bold">Radio key jack</text>
  <text x="151" y="628" text-anchor="middle" font-size="14">tip and sleeve</text>
  <rect x="266" y="580" width="190" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="361" y="606" text-anchor="middle" font-weight="bold">FM handheld</text>
  <text x="361" y="628" text-anchor="middle" font-size="14">PTT, mic, line (page 10)</text>

  <!-- legend -->
  <rect x="16" y="666" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="40" y="678" font-size="14">host code</text>
  <rect x="130" y="666" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
  <text x="154" y="678" font-size="14">firmware code</text>
  <rect x="270" y="666" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="294" y="678" font-size="14">safety gate</text>
  <rect x="396" y="666" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="420" y="678" font-size="14">hardware</text>
</svg>
