<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" width="720" height="1040" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The keyer's bring-up stages none, listen, keying and done: what each allows and refuses, the steps that move it on, and the PR #31 additions</title>
  <defs>
    <marker id="k09s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1040" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Bring-up stages: [keyer] commissioned</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each command that keys needs a stage; the operator sets it in hfnode.toml once the steps pass</text>

  <!-- initial state and stage zero -->
  <circle cx="184" cy="98" r="8" fill="#374151"/>
  <line x1="184" y1="106" x2="184" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#k09s-arrow)"/>
  <text x="200" y="132" font-size="14" fill="#4b5563">not set: none</text>

  <line x1="194" y1="98" x2="374" y2="98" stroke="#374151" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="284" y="90" text-anchor="middle" font-size="13" fill="#4b5563">first, by hand</text>
  <rect x="376" y="78" width="320" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="392" y="101" font-size="14" font-weight="bold">Stage zero, before any of it</text>
  <text x="392" y="122" font-size="14">the radio's key line, with a meter</text>

  <!-- none -->
  <rect x="24" y="150" width="320" height="90" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="176" font-weight="bold">none (the default)</text>
  <text x="40" y="200" font-size="14">keyer check, keyer rx, listen, record</text>
  <text x="40" y="222" font-size="14">none of them keys the radio</text>

  <rect x="376" y="150" width="320" height="90" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392" y="176" font-weight="bold">Refused at none</text>
  <text x="392" y="200" font-size="14">keyer key, keyer sidetone, hangtest,</text>
  <text x="392" y="222" font-size="14">stucktest, linktest, run</text>

  <line x1="184" y1="240" x2="184" y2="328" stroke="#374151" stroke-width="2" marker-end="url(#k09s-arrow)"/>
  <text x="200" y="268" font-size="14" fill="#4b5563">steps 1-3: devices lists the box, keyer check</text>
  <text x="200" y="288" font-size="14" fill="#4b5563">says all ok, listen decodes the band</text>
  <text x="200" y="310" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">commissioned = "listen"</text>

  <!-- listen -->
  <rect x="24" y="330" width="320" height="90" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="356" font-weight="bold">listen</text>
  <text x="40" y="380" font-size="14">adds keyer key and keyer sidetone,</text>
  <text x="40" y="402" font-size="14">with the operator at the radio</text>

  <rect x="376" y="330" width="320" height="90" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392" y="356" font-weight="bold">Refused at listen</text>
  <text x="392" y="380" font-size="14">hangtest, stucktest, linktest, run;</text>
  <text x="392" y="402" font-size="14">keyer key over 30 characters</text>

  <line x1="184" y1="420" x2="184" y2="528" stroke="#374151" stroke-width="2" marker-end="url(#k09s-arrow)"/>
  <text x="200" y="448" font-size="14" fill="#4b5563">steps 4-7, on the air at the lowest power (rules: page 14):</text>
  <text x="200" y="468" font-size="14" fill="#4b5563">key "TEST DE &lt;call&gt;" heard, sidetone 15 dB over the band,</text>
  <text x="200" y="488" font-size="14" fill="#4b5563">more power only where page 14 allows it</text>
  <text x="200" y="510" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">commissioned = "keying"</text>

  <!-- keying -->
  <rect x="24" y="530" width="320" height="90" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="556" font-weight="bold">keying</text>
  <text x="40" y="580" font-size="14">adds hangtest, stucktest, linktest</text>
  <text x="40" y="602" font-size="14">(each holds the key down on purpose)</text>

  <rect x="376" y="530" width="320" height="90" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392" y="556" font-weight="bold">Refused at keying</text>
  <text x="392" y="580" font-size="14">run;</text>
  <text x="392" y="602" font-size="14">keyer key over 30 characters</text>

  <line x1="184" y1="620" x2="184" y2="708" stroke="#374151" stroke-width="2" marker-end="url(#k09s-arrow)"/>
  <text x="200" y="648" font-size="14" fill="#4b5563">steps 8-10: hangtest, stucktest and linktest</text>
  <text x="200" y="668" font-size="14" fill="#4b5563">pass; replug the box after the first two</text>
  <text x="200" y="690" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">commissioned = "done"</text>

  <!-- done -->
  <rect x="24" y="710" width="320" height="110" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="736" font-weight="bold">done</text>
  <text x="40" y="760" font-size="14">adds run, and keyer key over 30</text>
  <text x="40" y="782" font-size="14">characters, split into pieces</text>

  <rect x="376" y="710" width="320" height="110" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392" y="736" font-weight="bold">Still checked before keying</text>
  <text x="392" y="760" font-size="14">HELLO limits, build, PTT cable,</text>
  <text x="392" y="782" font-size="14">frequency band, band level, audio,</text>
  <text x="392" y="804" font-size="14">state_dir, rest and duty: page 13</text>

  <!-- PR #31 -->
  <rect x="24" y="848" width="672" height="90" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="874" font-weight="bold">PR #31 (draft, not on main), protocol 5 boxes</text>
  <text x="40" y="898" font-size="14">step 6 of flashing: keyer check twice, a few seconds apart, before anything keys</text>
  <text x="40" y="920" font-size="14">step 11: core1test, then core1test --fault; needs keying, before done</text>

  <!-- notes -->
  <text x="24" y="966" font-size="14">Nothing in the code writes commissioned: hfnode only reads it.</text>

  <!-- legend -->
  <rect x="24" y="994" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="50" y="1006" font-size="14">stage</text>
  <rect x="140" y="994" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="166" y="1006" font-size="14">gate</text>
  <rect x="250" y="994" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="276" y="1006" font-size="14">by hand, no computer</text>
  <rect x="460" y="994" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="486" y="1006" font-size="14">not on main yet</text>
</svg>
