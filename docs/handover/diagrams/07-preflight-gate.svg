<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1832" width="720" height="1832" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Flowchart of a command that writes to the radio: the bring-up stage and power gate before the port opens, opening with DTR and RTS lowered, the preflight's reads with their fail rules, then the writes in order, the read-back and the tune or CW; PR 27's reads drawn dashed</title>
  <defs>
    <marker id="k07g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1832" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" fill="#111827" font-weight="bold">From a command to the first write</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">hfnode radio setup, radio tune, radio cw and hfnode run. Nothing is written until step 4.</text>
  <rect x="24" y="84" width="464" height="66" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="110" font-size="16" fill="#111827" font-weight="bold">radio setup, tune, cw, or run</text>
  <text x="40" y="132" font-size="14" fill="#4b5563">main.rs opens the radio with commissioning::open_for</text>
  <line x1="256" y1="150" x2="256" y2="182" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="182" width="464" height="146" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="208" font-size="16" fill="#111827" font-weight="bold">1. Bring-up stage and power cap</text>
  <text x="40" y="230" font-size="14" fill="#111827">setup needs link, tune needs setup,</text>
  <text x="40" y="250" font-size="14" fill="#111827">cw needs tune, run needs done;</text>
  <text x="40" y="270" font-size="14" fill="#111827">more than 10 W needs stage keying;</text>
  <text x="40" y="290" font-size="14" fill="#111827">run: max_key_seconds 55 or less, and enough for</text>
  <text x="40" y="310" font-size="14" fill="#111827">one character; longest reply within 30 min</text>
  <rect x="524" y="215" width="172" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="536" y="239" font-size="14" fill="#111827" font-weight="bold">Refused:</text>
  <text x="536" y="259" font-size="14" fill="#111827">no port is opened,</text>
  <text x="536" y="279" font-size="14" fill="#111827">nothing is sent</text>
  <line x1="488" y1="255" x2="524" y2="255" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <line x1="256" y1="328" x2="256" y2="360" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="360" width="464" height="106" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="386" font-size="16" fill="#111827" font-weight="bold">2. Open the port: Ic7300::open</text>
  <text x="40" y="408" font-size="14" fill="#111827">baud and address checked; 8N1, no flow</text>
  <text x="40" y="428" font-size="14" fill="#111827">control, exclusive (Unix), DTR off on open;</text>
  <text x="40" y="448" font-size="14" fill="#111827">then DTR lowered, then RTS</text>
  <rect x="524" y="373" width="172" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="536" y="397" font-size="14" fill="#111827" font-weight="bold">Error:</text>
  <text x="536" y="417" font-size="14" fill="#111827">the port is closed,</text>
  <text x="536" y="437" font-size="14" fill="#111827">nothing is written</text>
  <line x1="488" y1="413" x2="524" y2="413" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <line x1="256" y1="466" x2="256" y2="498" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="498" width="464" height="560" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="524" font-size="16" fill="#111827" font-weight="bold">3. Preflight: reads only, before any write</text>
  <text x="40" y="554" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">19 00</text>
  <text x="220" y="554" font-size="14" fill="#111827">transceiver ID 94h, else stop here</text>
  <text x="40" y="578" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1C 00</text>
  <text x="220" y="578" font-size="14" fill="#111827">on receive</text>
  <text x="40" y="602" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 78-80</text>
  <text x="220" y="602" font-size="14" fill="#111827" font-weight="bold">USB SEND, USB Keying: all OFF</text>
  <text x="40" y="626" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0F, 21 02</text>
  <text x="220" y="626" font-size="14" fill="#111827">split OFF, ∂TX OFF</text>
  <text x="40" y="650" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">16 46, 1A 05 00 35</text>
  <text x="220" y="650" font-size="14" fill="#111827">VOX OFF, PTT Start OFF</text>
  <text x="40" y="674" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 29</text>
  <text x="220" y="674" font-size="14" fill="#111827">Time-Out Timer 3 min *</text>
  <rect x="32" y="682" width="448" height="56" rx="4" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="701" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 01 98-02 03</text>
  <text x="220" y="701" font-size="14" fill="#111827">no key set to a keyer memory *</text>
  <text x="40" y="725" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 01 65</text>
  <text x="220" y="725" font-size="14" fill="#111827">MIC Up/Down Keyer OFF *</text>
  <text x="40" y="762" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">16 66</text>
  <text x="220" y="762" font-size="14" fill="#111827">TX Inhibit OFF *</text>
  <text x="40" y="786" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 74</text>
  <text x="220" y="786" font-size="14" fill="#111827">CI-V USB port unlinked</text>
  <text x="40" y="810" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 73</text>
  <text x="220" y="810" font-size="14" fill="#4b5563">CI-V Output (for ANT): warns</text>
  <text x="40" y="834" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 01 97</text>
  <text x="220" y="834" font-size="14" fill="#4b5563">USB inhibit timer: warns</text>
  <text x="40" y="858" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 66-67</text>
  <text x="220" y="858" font-size="14" fill="#4b5563">MOD inputs: warn</text>
  <text x="40" y="882" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 01 61</text>
  <text x="220" y="882" font-size="14" fill="#111827">keyer ratio 1:1:3.0</text>
  <text x="40" y="906" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1A 05 00 84</text>
  <text x="220" y="906" font-size="14" fill="#4b5563">meter peak hold: warns</text>
  <text x="40" y="930" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">27 11</text>
  <text x="220" y="930" font-size="14" fill="#111827">scope data output OFF</text>
  <text x="40" y="954" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8 more reads</text>
  <text x="220" y="954" font-size="14" fill="#4b5563">reported only, never refuse</text>
  <text x="40" y="984" font-size="14" fill="#4b5563">Black rows fail and stop the command; grey rows only warn.</text>
  <text x="40" y="1004" font-size="14" fill="#4b5563">* fails for tune, cw and run; warns for setup. TX Inhibit</text>
  <text x="52" y="1024" font-size="14" fill="#4b5563">ON also only warns for run while its tx-inhibited file exists.</text>
  <text x="40" y="1044" font-size="14" fill="#4b5563">Dashed purple rows: PR #27 only (34 reads; 27 on main).</text>
  <rect x="524" y="728" width="172" height="100" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="536" y="752" font-size="14" fill="#111827" font-weight="bold">Any Fail:</text>
  <text x="536" y="772" font-size="14" fill="#111827">port closed: “nothing</text>
  <text x="536" y="792" font-size="14" fill="#111827">was written to the</text>
  <text x="536" y="812" font-size="14" fill="#111827">radio”</text>
  <line x1="488" y1="778" x2="524" y2="778" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <line x1="256" y1="1058" x2="256" y2="1090" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="1090" width="464" height="242" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="1116" font-size="16" fill="#111827" font-weight="bold">4. The first writes, in this order</text>
  <text x="40" y="1138" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">16 66 00</text>
  <text x="136" y="1138" font-size="14" fill="#111827">radio setup only: TX Inhibit OFF,</text>
  <text x="136" y="1160" font-size="14" fill="#111827">if it was ON and no tx-inhibited file</text>
  <text x="40" y="1182" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1C 00 00</text>
  <text x="136" y="1182" font-size="14" fill="#111827">receive</text>
  <text x="40" y="1204" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">06 03 01</text>
  <text x="136" y="1204" font-size="14" fill="#111827">CW, filter 1</text>
  <text x="40" y="1226" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">05</text>
  <text x="136" y="1226" font-size="14" fill="#111827">frequency</text>
  <text x="40" y="1248" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14 0A</text>
  <text x="136" y="1248" font-size="14" fill="#111827">RF power</text>
  <text x="40" y="1270" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14 0C</text>
  <text x="136" y="1270" font-size="14" fill="#111827">keyer speed</text>
  <text x="40" y="1292" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14 0F</text>
  <text x="136" y="1292" font-size="14" fill="#111827">break-in delay, 10 dots</text>
  <text x="40" y="1314" font-size="14" fill="#111827" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">16 47 01</text>
  <text x="136" y="1314" font-size="14" fill="#111827">semi break-in, last (00 while inhibited)</text>
  <line x1="256" y1="1332" x2="256" y2="1364" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="1364" width="464" height="86" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="1390" font-size="16" fill="#111827" font-weight="bold">5. Read back: verify_setup</text>
  <text x="40" y="1412" font-size="14" fill="#111827">10 reads: receive, both frequencies, mode,</text>
  <text x="40" y="1432" font-size="14" fill="#111827">split, ∂TX, break-in, power, speed, delay</text>
  <rect x="524" y="1367" width="172" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="536" y="1391" font-size="14" fill="#111827" font-weight="bold">Mismatch:</text>
  <text x="536" y="1411" font-size="14" fill="#111827">the command stops,</text>
  <text x="536" y="1431" font-size="14" fill="#111827">nothing transmits</text>
  <line x1="488" y1="1407" x2="524" y2="1407" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <line x1="256" y1="1450" x2="256" y2="1482" stroke="#374151" stroke-width="2" marker-end="url(#k07g-arrow)"/>
  <rect x="24" y="1482" width="464" height="166" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="40" y="1508" font-size="16" fill="#111827" font-weight="bold">6. Only now can the radio transmit</text>
  <text x="40" y="1530" font-size="14" fill="#111827">radio tune: settings and checks again,</text>
  <text x="40" y="1550" font-size="14" fill="#111827">then 1C 01 02 (a tuner cycle)</text>
  <text x="40" y="1570" font-size="14" fill="#111827">radio cw and run: 17 &lt;text&gt; through</text>
  <text x="40" y="1590" font-size="14" fill="#111827">Station::transmit, after its checks</text>
  <text x="40" y="1610" font-size="14" fill="#111827">run also tunes (1C 01 02) at start-up and at</text>
  <text x="40" y="1630" font-size="14" fill="#111827">each listening window (Station::start_window)</text>
  <line x1="24" y1="1680" x2="696" y2="1680" stroke="#374151" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="24" y="1708" font-size="14" fill="#111827" xml:space="preserve"><tspan font-weight="bold">Not on this path: </tspan>radio status reads 03 and 1C 00; radio check runs the same</text>
  <text x="24" y="1728" font-size="14" fill="#111827">preflight and writes nothing. radio rx has no preflight, so that it can stop a</text>
  <text x="24" y="1748" font-size="14" fill="#111827">radio the preflight would refuse: it sends 17 FF and 1C 00 00, and if receive</text>
  <text x="24" y="1768" font-size="14" fill="#111827">is still not confirmed, 16 47 00 and 16 66 01 (page 05).</text>
  <text x="24" y="1810" font-size="14" fill="#111827" font-weight="bold">Legend</text>
  <rect x="92" y="1797" width="18" height="14" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="118" y="1810" font-size="14" fill="#111827">host code</text>
  <rect x="215.6" y="1797" width="18" height="14" rx="0" fill="#fee2e2" stroke="#991b1b" stroke-width="1"/>
  <text x="241.6" y="1810" font-size="14" fill="#111827">safety gate</text>
  <rect x="356.0" y="1797" width="18" height="14" rx="0" fill="#ede9fe" stroke="#5b21b6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="382.0" y="1810" font-size="14" fill="#111827">PR #27, not on main</text>
  <rect x="563.6" y="1797" width="18" height="14" rx="0" fill="#ffffff" stroke="#374151" stroke-width="1"/>
  <text x="589.6" y="1810" font-size="14" fill="#111827">outcome</text>
</svg>