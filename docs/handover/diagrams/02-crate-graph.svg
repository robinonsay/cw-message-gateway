<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1134" width="720" height="1134" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Every crate and firmware image with its dependency arrows: hfnode depends on auth, protocol, civ, cw and keyer-core; protocol and civ depend on cw; cw depends on libm; the keyer firmware depends on keyer-core and on rustos at a pinned git revision; PR #30 adds decoder-core and the decoder firmware, and PR #31 makes the keyer firmware depend on decoder-core</title>
  <defs>
    <marker id="k02c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="k02c-arrow-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1134" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold">Crates, firmware images and what they depend on</text>
  <text x="24" y="58" font-size="14" fill="#4b5563">Arrow: "depends on" (a Cargo dependency, or what a build fetches); test-only ones not drawn</text>

  <!-- Row 1: hfnode -->
  <rect x="180" y="80" width="340" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="350" y="106" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</text>
  <text x="350" y="130" text-anchor="middle" font-size="14" fill="#4b5563">the node program, with std</text>

  <!-- Row 2: auth, protocol, civ -->
  <rect x="24" y="204" width="150" height="84" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="99" y="230" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">auth</text>
  <text x="99" y="252" text-anchor="middle" font-size="14" fill="#4b5563">HOTP letter codes</text>
  <text x="99" y="272" text-anchor="middle" font-size="14" fill="#4b5563">(hmac, sha2)</text>

  <rect x="214" y="204" width="150" height="84" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="289" y="230" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">protocol</text>
  <text x="289" y="252" text-anchor="middle" font-size="14" fill="#4b5563">field command</text>
  <text x="289" y="272" text-anchor="middle" font-size="14" fill="#4b5563">grammar, replies</text>

  <rect x="404" y="204" width="150" height="84" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="479" y="230" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">civ</text>
  <text x="479" y="252" text-anchor="middle" font-size="14" fill="#4b5563">IC-7300 CI-V and</text>
  <text x="479" y="272" text-anchor="middle" font-size="14" fill="#4b5563">a simulated radio</text>

  <!-- Row 3: cw, keyer-core -->
  <rect x="24" y="348" width="496" height="84" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="272" y="374" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cw</text>
  <text x="272" y="396" text-anchor="middle" font-size="14" fill="#4b5563">Morse table, CW decoder, test-signal synthesizer</text>
  <rect x="162" y="404" width="220" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="272" y="419" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</tspan> with feature <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">std</tspan> off</text>

  <rect x="544" y="348" width="152" height="84" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="620" y="374" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">keyer-core</text>
  <text x="620" y="396" text-anchor="middle" font-size="14" fill="#4b5563">keyer box rules</text>
  <rect x="585" y="404" width="70" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="419" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</text>

  <!-- Row 4: libm, decoder-core -->
  <rect x="24" y="492" width="220" height="84" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="134" y="518" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">libm</text>
  <text x="134" y="540" text-anchor="middle" font-size="14" fill="#4b5563">crates.io, version 0.2</text>
  <text x="134" y="560" text-anchor="middle" font-size="14" fill="#4b5563">maths without std</text>

  <rect x="284" y="492" width="236" height="84" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="402" y="518" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">decoder-core</text>
  <text x="402" y="540" text-anchor="middle" font-size="14" fill="#4b5563">decoder box loop, PR #30</text>
  <rect x="367" y="548" width="70" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="402" y="563" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</text>

  <!-- Row 5: firmware images -->
  <rect x="24" y="646" width="220" height="124" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="134" y="672" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">uv-k1</text>
  <text x="134" y="694" text-anchor="middle" font-size="14" fill="#4b5563">handheld image, parked</text>
  <text x="134" y="714" text-anchor="middle" font-size="14" fill="#4b5563">C with CMake, not cargo</text>

  <rect x="284" y="646" width="236" height="124" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="402" y="672" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pico2-decoder</text>
  <text x="402" y="694" text-anchor="middle" font-size="14" fill="#4b5563">decoder box image, PR #30</text>
  <text x="402" y="714" text-anchor="middle" font-size="14" fill="#4b5563">own workspace</text>
  <text x="402" y="734" text-anchor="middle" font-size="14" fill="#4b5563">and lock</text>
  <rect x="367" y="740" width="70" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="402" y="755" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</text>

  <rect x="544" y="646" width="152" height="124" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="620" y="672" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pico2-keyer</text>
  <text x="620" y="694" text-anchor="middle" font-size="14" fill="#4b5563">keyer box image</text>
  <text x="620" y="714" text-anchor="middle" font-size="14" fill="#4b5563">own workspace</text>
  <text x="620" y="734" text-anchor="middle" font-size="14" fill="#4b5563">and lock</text>
  <rect x="585" y="740" width="70" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="755" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</text>

  <!-- Row 6: upstream NR7Y and rustos -->
  <rect x="24" y="840" width="220" height="84" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="134" y="866" text-anchor="middle" font-weight="bold">NR7Y CW firmware</text>
  <text x="134" y="888" text-anchor="middle" font-size="14" fill="#4b5563">upstream C source,</text>
  <text x="134" y="908" text-anchor="middle" font-size="14" fill="#4b5563">fixed commit 47075bf</text>

  <rect x="284" y="840" width="412" height="166" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="300" y="866" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rustos</tspan> (a separate git repository)</text>
  <text x="300" y="888" font-size="14" fill="#4b5563">no_std runtime; cargo fetches it at a pinned rev</text>
  <rect x="300" y="904" width="170" height="86" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="385" y="930" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pico2</text>
  <text x="385" y="952" text-anchor="middle" font-size="14" fill="#4b5563">boot, runtime</text>
  <text x="385" y="972" text-anchor="middle" font-size="14" fill="#4b5563">and drivers</text>
  <rect x="520" y="904" width="160" height="86" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="600" y="930" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api</text>
  <text x="600" y="952" text-anchor="middle" font-size="14" fill="#4b5563">portable</text>
  <text x="600" y="972" text-anchor="middle" font-size="14" fill="#4b5563">hardware traits</text>

  <!-- Arrows: on main -->
  <g fill="none" stroke="#374151" stroke-width="2">
    <path d="M180,112 H99 V201" marker-end="url(#k02c-arrow)"/>
    <path d="M289,144 V201" marker-end="url(#k02c-arrow)"/>
    <path d="M479,144 V201" marker-end="url(#k02c-arrow)"/>
    <path d="M194,144 V345" marker-end="url(#k02c-arrow)"/>
    <path d="M520,112 H620 V345" marker-end="url(#k02c-arrow)"/>
    <path d="M289,288 V345" marker-end="url(#k02c-arrow)"/>
    <path d="M479,288 V345" marker-end="url(#k02c-arrow)"/>
    <path d="M134,432 V489" marker-end="url(#k02c-arrow)"/>
    <path d="M660,646 V435" marker-end="url(#k02c-arrow)"/>
    <path d="M134,770 V837" marker-end="url(#k02c-arrow)"/>
    <path d="M620,770 V837" marker-end="url(#k02c-arrow)"/>
    <path d="M470,947 H517" marker-end="url(#k02c-arrow)"/>
  </g>
  <!-- Arrows that exist only on PR #30 / PR #31 -->
  <g fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4">
    <path d="M402,492 V435" marker-end="url(#k02c-arrow-pr)"/>
    <path d="M520,520 H590 V435" marker-end="url(#k02c-arrow-pr)"/>
    <path d="M284,534 H247" marker-end="url(#k02c-arrow-pr)"/>
    <path d="M402,646 V579" marker-end="url(#k02c-arrow-pr)"/>
    <path d="M566,646 V556 H523" marker-end="url(#k02c-arrow-pr)"/>
    <path d="M402,770 V837" marker-end="url(#k02c-arrow-pr)"/>
  </g>

  <!-- Arrow labels -->
  <text x="582" y="484" text-anchor="end" font-size="14" fill="#4b5563">frame only</text>
  <text x="574" y="612" font-size="14" fill="#5b21b6" font-weight="bold">PR #31</text>
  <text x="146" y="800" font-size="14" fill="#4b5563">fetched,</text>
  <text x="146" y="818" font-size="14" fill="#4b5563">patched</text>
  <text x="390" y="800" text-anchor="end" font-size="14" fill="#5b21b6" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</text>
  <text x="390" y="818" text-anchor="end" font-size="14" fill="#5b21b6">PR #30</text>
  <text x="606" y="800" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8c91507 <tspan font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">on main</tspan></text>
  <text x="606" y="822" text-anchor="end" font-size="14" fill="#5b21b6" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa <tspan font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">in PR #31</tspan></text>

  <!-- Legend -->
  <text x="24" y="1042" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1054" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="48" y="1066" font-size="14">host workspace crate</text>
  <rect x="210" y="1054" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="234" y="1066" font-size="14">firmware image</text>
  <rect x="364" y="1054" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="388" y="1066" font-size="14">outside this repository</text>
  <rect x="24" y="1084" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="48" y="1096" font-size="14">not on main yet (box or arrow)</text>
  <rect x="284" y="1081" width="70" height="20" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="319" y="1096" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">no_std</text>
  <text x="364" y="1096" font-size="14">builds without the standard library</text>
  <text x="24" y="1124" font-size="14" fill="#4b5563">Host crates are linked by path; firmware reaches them by path from its own workspace.</text>
</svg>
