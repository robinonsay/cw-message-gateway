  <line x1="671.9" y1="136" x2="671.9" y2="326" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="696" y="348" text-anchor="end" font-size="13" fill="#991b1b">judged once the audio reaches 1.94 s</text>
  <text x="696" y="364" text-anchor="end" font-size="13" fill="#4b5563">(end + post 0.18 s + 0.5 s longest lag)</text>
  <rect x="24" y="373" width="18" height="13" fill="#ffffff" stroke="#374151" stroke-width="1.5" stroke-dasharray="3 2"/><text x="48" y="384" font-size="13">before: 0.25 s, scored apart</text>
  <rect x="270" y="373" width="18" height="13" fill="#4b5563" stroke="#374151"/><text x="294" y="384" font-size="13">key-down</text>
  <rect x="24" y="395" width="18" height="13" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text x="48" y="406" font-size="13">key-up: gaps and 3 dots after (0.18 s here; at most 0.3 s)</text>
  <text x="24" y="428" font-size="13" fill="#4b5563">Spaces between the outlined bars: 12 ms either side of every expected key change, left out.</text>
  <rect x="24" y="446" width="672" height="192" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="472" font-weight="bold">Heard only if all of these hold, at one lag</text>
  <text x="40" y="496" font-size="14">1. at least 3 key-down slices and 3 key-up slices</text>
  <text x="40" y="517" font-size="14">2. median tone minus median gap: 10 dB or more</text>
  <text x="40" y="538" font-size="14">3. 85% of key-down slices at or over mid = (tone + gap) / 2</text>
  <text x="40" y="559" font-size="14">4. 85% of key-up slices under mid</text>
  <text x="40" y="580" font-size="14">5. 85% of the slices before the run more than 10 dB under the tone</text>
  <text x="56" y="599" font-size="14">(passes if there are none)</text>
  <text x="40" y="624" font-size="14" fill="#4b5563">Not heard: the station stops and keys nothing until its next window.</text>
  <text x="24" y="676" font-weight="bold">4 A steady tone at the pitch, not from one of the node's runs</text>
  <text x="162" y="705" text-anchor="end" font-size="13" fill="#4b5563">steady tone</text>
  <rect x="170.0" y="692" width="510.0" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <line x1="170.0" y1="722" x2="680.0" y2="722" stroke="#374151" stroke-width="1.5"/>
  <line x1="170.0" y1="722" x2="170.0" y2="727" stroke="#374151" stroke-width="1.5"/>
  <text x="164" y="727" text-anchor="end" font-size="13" fill="#4b5563">0 s</text>
  <line x1="324.5" y1="722" x2="324.5" y2="727" stroke="#374151" stroke-width="1.5"/>
  <text x="324.5" y="741" text-anchor="middle" font-size="13" fill="#4b5563">10</text>
  <line x1="479.1" y1="722" x2="479.1" y2="727" stroke="#374151" stroke-width="1.5"/>
  <text x="479.1" y="741" text-anchor="middle" font-size="13" fill="#4b5563">20</text>
  <line x1="633.6" y1="722" x2="633.6" y2="727" stroke="#374151" stroke-width="1.5"/>
  <line x1="185.5" y1="686" x2="185.5" y2="752" stroke="#991b1b" stroke-width="2"/>
  <line x1="633.6" y1="686" x2="633.6" y2="752" stroke="#991b1b" stroke-width="2"/>
  <text x="191.5" y="768" font-size="14" fill="#991b1b">1 s: send_cw refuses to key over it (90% of the last 1 s)</text>
  <text x="627.6" y="790" font-size="14" fill="#991b1b" text-anchor="end">30 s: KeyState::Held, a fault that stays (95% of 30 s)</text>
  <text x="24" y="816" font-size="13" fill="#4b5563">Steady slice: within 1.5 dB of the one before, 60% or more of its power at the pitch, and over</text>
  <text x="24" y="833" font-size="13" fill="#4b5563">a floor: min_level_dbfs + 10 dB at 1 s; at 30 s, the sidetone heard less 10 dB once it is known.</text>
  <rect x="24" y="856" width="672" height="186" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="882" font-weight="bold">5 After the box opens its key (key_state)</text>
  <text x="40" y="906" font-size="14">Open: 50 ms of slices under the release level, from open + lag + 12 ms</text>
  <text x="56" y="925" font-size="13" fill="#4b5563">release level: mid, once the run was heard (lag as judged); otherwise the band</text>
  <text x="56" y="942" font-size="13" fill="#4b5563">before the run + 10 dB, at most the known sidetone - 10 dB (lag taken as 0.5 s)</text>
  <text x="40" y="964" font-size="14">Unsure: the audio does not reach 0.5 s past that point yet</text>
  <text x="40" y="985" font-size="14">Held: 0.5 s of audio since then, with the tone in 90% of its slices</text>
  <text x="40" y="1006" font-size="14">Otherwise, after 0.5 s: Open</text>
  <text x="40" y="1027" font-size="14">Then Held: a 1 s steady tone within 10 s, before 0.5 s of quiet was ever seen</text>
  <rect x="24" y="1062" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="50" y="1074" font-size="14">box keying</text>
  <rect x="170" y="1062" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="196" y="1074" font-size="14">radio audio heard</text>
  <rect x="360" y="1062" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="386" y="1074" font-size="14">verdict rule (gate)</text>
</svg>
