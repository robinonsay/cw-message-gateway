  <line x1="685.0" y1="274" x2="685.0" y2="279" stroke="#374151" stroke-width="1.5"/>
  <text x="24" y="314" font-size="14" font-weight="bold">3 Scored</text>
  <text x="24" y="330" font-size="13" fill="#4b5563">at the best lag</text>
  <rect x="211.6" y="304" width="52.2" height="22" fill="#ffffff" stroke="#374151" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="269.1" y="304" width="34.2" height="22" fill="#4b5563" stroke="#374151" stroke-width="1"/>
