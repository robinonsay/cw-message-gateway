<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1830" width="720" height="1830" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The gate from a code change to the air: a pull request, the safety audit's review, its verdict and hash, CI green, Robin's merge, CI's artifact with the matching SHA-256, Robin's go, the flash, hfnode keyer check twice, bench stages each on her go, and the results to the audit; any new head starts again at the top</title>
  <defs>
    <marker id="k14a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1830" fill="#ffffff"/>
  <text x="48" y="36" font-size="20" font-weight="bold">From a code change to the air</text>
  <text x="48" y="60" font-size="14" fill="#4b5563">Every gate passes in order; a new head commit starts again at the top</text>

  <!-- 1 -->
  <rect x="48" y="84" width="380" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="112" font-weight="bold" text-anchor="middle">1. Pull request, head commit H</text>
  <text x="238" y="134" font-size="14" text-anchor="middle">keying, CI-V, a limit or gate, or firmware</text>
  <line x1="238" y1="156" x2="238" y2="184" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- 2 -->
  <rect x="48" y="186" width="380" height="110" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="214" font-weight="bold" text-anchor="middle">2. Safety audit reviews H</text>
  <text x="238" y="236" font-size="14" text-anchor="middle">evidence: code, manual, datasheets</text>
  <text x="238" y="256" font-size="14" text-anchor="middle">hardware not measured = BENCH</text>
  <text x="238" y="276" font-size="14" text-anchor="middle">firmware: UF2 rebuilt, matched to CI's log</text>
  <line x1="238" y1="296" x2="238" y2="322" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- verdict -->
  <polygon points="238,324 398,372 238,420 78,372" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="238" y="367" font-weight="bold" text-anchor="middle">Verdict GO</text>
  <text x="238" y="388" font-size="14" text-anchor="middle">(with steps)?</text>
  <line x1="398" y1="372" x2="486" y2="372" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="408" y="365" font-size="14" fill="#4b5563">no</text>
  <rect x="488" y="342" width="180" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="578" y="367" font-size="14" text-anchor="middle">Owner thread fixes:</text>
  <text x="578" y="387" font-size="14" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">req-*.md</tspan>, new head</text>
  <line x1="238" y1="420" x2="238" y2="446" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="256" y="438" font-size="14" fill="#4b5563">yes</text>

  <!-- 3 -->
  <rect x="48" y="448" width="380" height="110" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="476" font-weight="bold" text-anchor="middle">3. Audit posts verdict and hash</text>
  <text x="238" y="498" font-size="14" text-anchor="middle">a PR comment, and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">report.md</tspan> §3</text>
  <text x="238" y="518" font-size="14" text-anchor="middle">keyer files also in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">final-grades.md</tspan></text>
  <text x="238" y="538" font-size="14" text-anchor="middle">SHA-256, bytes, build id, run</text>
  <line x1="238" y1="558" x2="238" y2="584" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- CI green -->
  <polygon points="238,586 398,634 238,682 78,634" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="238" y="639" font-weight="bold" text-anchor="middle">CI green on H?</text>
  <line x1="398" y1="634" x2="486" y2="634" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="408" y="627" font-size="14" fill="#4b5563">no</text>
  <rect x="488" y="596" width="180" height="76" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="578" y="618" font-size="14" text-anchor="middle">Fix and push:</text>
  <text x="578" y="638" font-size="14" text-anchor="middle">a new head</text>
  <text x="578" y="658" font-size="14" text-anchor="middle" fill="#4b5563">(flake: re-run once)</text>
  <line x1="238" y1="682" x2="238" y2="708" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="256" y="700" font-size="14" fill="#4b5563">yes</text>

  <!-- 4 -->
  <rect x="48" y="710" width="380" height="92" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="738" font-weight="bold" text-anchor="middle">4. Robin merges the PR</text>
  <text x="238" y="760" font-size="14" text-anchor="middle">then hfnode is rebuilt from <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main</tspan></text>
  <text x="238" y="780" font-size="14" text-anchor="middle" fill="#4b5563">or the audit hashes <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main</tspan>'s build after it</text>
  <line x1="238" y1="802" x2="238" y2="828" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- 5 -->
  <rect x="48" y="830" width="380" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="858" font-weight="bold" text-anchor="middle">5. Download CI's artifact</text>
  <text x="238" y="880" font-size="14" text-anchor="middle">from the push run the audit named</text>
  <line x1="238" y1="902" x2="238" y2="928" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- hash -->
  <polygon points="238,930 398,978 238,1026 78,978" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="238" y="973" font-weight="bold" text-anchor="middle">SHA-256 equals</text>
  <text x="238" y="994" font-weight="bold" text-anchor="middle">the audited hash?</text>
  <line x1="398" y1="978" x2="486" y2="978" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="408" y="971" font-size="14" fill="#4b5563">no</text>
  <rect x="488" y="948" width="180" height="60" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="578" y="973" font-size="14" text-anchor="middle">Stop: never flash</text>
  <text x="578" y="993" font-size="14" text-anchor="middle">this file</text>
  <line x1="238" y1="1026" x2="238" y2="1052" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="256" y="1044" font-size="14" fill="#4b5563">yes</text>

  <!-- go -->
  <polygon points="238,1054 398,1102 238,1150 78,1102" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="238" y="1107" font-weight="bold" text-anchor="middle">Robin says go?</text>
  <line x1="398" y1="1102" x2="486" y2="1102" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="408" y="1095" font-size="14" fill="#4b5563">no</text>
  <rect x="488" y="1072" width="180" height="60" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="578" y="1097" font-size="14" text-anchor="middle">Wait: nothing is</text>
  <text x="578" y="1117" font-size="14" text-anchor="middle">flashed or keyed</text>
  <line x1="238" y1="1150" x2="238" y2="1178" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="256" y="1170" font-size="14" fill="#4b5563">yes</text>

  <!-- 6 -->
  <rect x="48" y="1180" width="380" height="92" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="238" y="1208" font-weight="bold" text-anchor="middle">6. Flash the box</text>
  <text x="238" y="1230" font-size="14" text-anchor="middle">unplugged from the radio</text>
  <text x="238" y="1250" font-size="14" text-anchor="middle">BOOTSEL, copy the UF2, replug</text>
  <line x1="238" y1="1272" x2="238" y2="1298" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- 7 -->
  <rect x="48" y="1300" width="380" height="72" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="238" y="1328" font-weight="bold" text-anchor="middle">7. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode keyer check</tspan>, twice</text>
  <text x="238" y="1350" font-size="14" text-anchor="middle">audited build, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">POWER</tspan>, no trip, up growing</text>
  <line x1="238" y1="1372" x2="238" y2="1398" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- both checks -->
  <polygon points="238,1400 398,1448 238,1496 78,1448" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="238" y="1453" font-weight="bold" text-anchor="middle">Both checks pass?</text>
  <line x1="398" y1="1448" x2="486" y2="1448" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="408" y="1441" font-size="14" fill="#4b5563">no</text>
  <rect x="488" y="1418" width="180" height="60" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="578" y="1443" font-size="14" text-anchor="middle">Do not key: flash</text>
  <text x="578" y="1463" font-size="14" text-anchor="middle">the last cleared file</text>
  <line x1="238" y1="1496" x2="238" y2="1522" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <text x="256" y="1514" font-size="14" fill="#4b5563">yes</text>

  <!-- 8 -->
  <rect x="48" y="1524" width="380" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="238" y="1552" font-weight="bold" text-anchor="middle">8. Bench stages, one at a time</text>
  <text x="238" y="1574" font-size="14" text-anchor="middle">each one on Robin's go</text>
  <text x="238" y="1594" font-size="14" text-anchor="middle">zero-RF stages before keyed ones</text>
  <text x="238" y="1614" font-size="14" text-anchor="middle">QRL? before keying, ID after</text>
  <line x1="238" y1="1634" x2="238" y2="1660" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>

  <!-- 9 -->
  <rect x="48" y="1662" width="380" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="238" y="1690" font-weight="bold" text-anchor="middle">9. Results to the audit</text>
  <text x="238" y="1712" font-size="14" text-anchor="middle">it grades H1 (unattended) per route</text>

  <!-- new head at any time -->
  <rect x="488" y="1524" width="180" height="110" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="578" y="1554" font-size="14" text-anchor="middle">A new head at any time</text>
  <text x="578" y="1574" font-size="14" text-anchor="middle">(a new commit, a</text>
  <text x="578" y="1594" font-size="14" text-anchor="middle">rustos re-pin): fresh</text>
  <text x="578" y="1614" font-size="14" text-anchor="middle">audit and a new hash</text>

  <!-- return path to the top -->
  <line x1="668" y1="372" x2="692" y2="372" stroke="#374151" stroke-width="2"/>
  <line x1="668" y1="634" x2="692" y2="634" stroke="#374151" stroke-width="2"/>
  <polyline points="668,1579 692,1579 692,120 432,120" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k14a-arrow)"/>
  <circle cx="692" cy="372" r="4" fill="#374151"/>
  <circle cx="692" cy="634" r="4" fill="#374151"/>
  <text x="452" y="110" font-size="14" fill="#4b5563">new head: start again</text>

  <!-- legend -->
  <text x="48" y="1780" font-size="14" font-weight="bold">Legend</text>
  <rect x="48" y="1794" width="18" height="14" fill="#f3f4f6" stroke="#374151"/>
  <text x="74" y="1806" font-size="14">person or service</text>
  <rect x="210" y="1794" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="236" y="1806" font-size="14">gate or stop</text>
  <rect x="342" y="1794" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="368" y="1806" font-size="14">hardware step</text>
  <rect x="484" y="1794" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="510" y="1806" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> command</text>
</svg>
