<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" width="720" height="1160" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>How the session connects: the node loop calls it, it calls the gateways through Services, saves last_seq before acting, and its replies pass the LATE_REPLY gate to the station</title>
  <defs>
    <marker id="cn03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1160" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">How the session connects</text>
  <text x="24" y="58" font-size="14" fill="#4b5563">Who calls Session, what it calls, what it reads and writes, how it is built.</text>

  <!-- node loop -->
  <rect x="256" y="80" width="208" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-weight="bold">Node loop</text>
  <text x="360" y="128" text-anchor="middle" font-size="14">CW decoder, node.rs</text>

  <!-- a1: handle -->
  <line x1="300" y1="144" x2="300" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="290" y="168" text-anchor="end" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handle(text, now, svc)</text>
  <text x="290" y="186" text-anchor="end" font-size="14">one transmission,</text>
  <text x="290" y="204" text-anchor="end" font-size="14">over still on</text>

  <!-- a2: held_for -->
  <line x1="420" y1="144" x2="420" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="430" y="168" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">has_pending(now)</text>
  <text x="430" y="186" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">result_repeatable(now)</text>
  <text x="430" y="204" font-size="14">(held_for: listen on)</text>

  <!-- Session -->
  <rect x="256" y="224" width="208" height="120" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" font-size="18" font-weight="bold">Session</text>
  <text x="360" y="280" text-anchor="middle" font-size="14" fill="#4b5563">session.rs (this page)</text>
  <text x="360" y="304" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handle(...) -&gt; Outcome</text>

  <!-- build_session (right) -->
  <rect x="504" y="224" width="200" height="110" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="516" y="246" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">node::build_session</text>
  <text x="516" y="266" font-size="14">hfnode.toml and key</text>
  <text x="516" y="284" font-size="14">file to SessionConfig,</text>
  <text x="516" y="302" font-size="14">Vocabulary, Verifier,</text>
  <text x="516" y="320" font-size="14">SeqStore, LastPlaces</text>
  <line x1="504" y1="280" x2="468" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <!-- disk (left) -->
  <rect x="16" y="224" width="200" height="72" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="28" y="246" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">wx_last.json</text>
  <text x="28" y="266" font-size="14">LastPlaces: the grid</text>
  <text x="28" y="284" font-size="14">for WX alone</text>
  <line x1="256" y1="260" x2="220" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <rect x="16" y="308" width="200" height="88" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="28" y="330" font-size="14" font-weight="bold">save last_seq first</text>
  <text x="28" y="348" font-size="14">fresh lines only; if the</text>
  <text x="28" y="366" font-size="14">write fails: silence</text>
  <text x="28" y="384" font-size="14">and nothing done</text>
  <line x1="256" y1="336" x2="220" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <line x1="116" y1="396" x2="116" y2="424" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <rect x="16" y="428" width="200" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="28" y="450" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&lt;state_dir&gt;/last_seq</text>
  <text x="28" y="472" font-size="14">SeqStore (crates/auth)</text>

  <!-- outcome -->
  <line x1="360" y1="344" x2="360" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="350" y="366" text-anchor="end" font-size="14">Silent(why):</text>
  <text x="350" y="384" text-anchor="end" font-size="14">only logged</text>
  <text x="374" y="376" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Transmit(t)</text>

  <rect x="256" y="404" width="208" height="78" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="268" y="428" font-size="14" font-weight="bold">LATE_REPLY 90 s</text>
  <text x="268" y="448" font-size="14">took longer to prepare:</text>
  <text x="268" y="466" font-size="14">not keyed, only logged</text>

  <line x1="360" y1="482" x2="360" y2="520" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="374" y="506" font-size="14" fill="#4b5563">in time</text>

  <rect x="256" y="524" width="208" height="60" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="550" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Station::transmit(&amp;t)</text>
  <text x="360" y="572" text-anchor="middle" font-size="14">station.rs, page 05</text>

  <line x1="420" y1="584" x2="420" y2="640" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="410" y="606" text-anchor="end" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mark_read(read_ids)</text>
  <text x="410" y="624" text-anchor="end" font-size="14">once keyed (node loop)</text>

  <!-- svc calls -->
  <polyline points="464,330 484,330 484,640" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="494" y="540" font-size="14">calls through svc</text>

  <!-- Services -->
  <rect x="120" y="644" width="480" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="670" text-anchor="middle" font-weight="bold">Services (trait in session.rs)</text>
  <text x="360" y="696" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">send_message  ready_messages  mark_read  weather</text>

  <line x1="170" y1="714" x2="170" y2="760" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <line x1="360" y1="714" x2="360" y2="760" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <line x1="560" y1="714" x2="560" y2="760" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <text x="180" y="744" font-size="14" fill="#4b5563">implemented by</text>

  <rect x="16" y="764" width="200" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="116" y="788" text-anchor="middle" font-size="13" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">LiveServices</text>
  <text x="116" y="810" text-anchor="middle" font-size="14">live node: inbox,</text>
  <text x="116" y="830" text-anchor="middle" font-size="14">gateways, NWS</text>

  <rect x="256" y="764" width="208" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="788" text-anchor="middle" font-size="13" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OfflineServices</text>
  <text x="360" y="810" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode sim --offline</text>
  <text x="360" y="830" text-anchor="middle" font-size="14">logs, canned forecast</text>

  <rect x="504" y="764" width="200" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="604" y="788" text-anchor="middle" font-size="14" font-weight="bold">test fakes</text>
  <text x="604" y="810" text-anchor="middle" font-size="14">session, node, selftest,</text>
  <text x="604" y="830" text-anchor="middle" font-size="14">and end_to_end tests</text>

  <line x1="116" y1="844" x2="116" y2="880" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>
  <rect x="16" y="884" width="200" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="116" y="908" text-anchor="middle" font-size="14">iMessage, Google Voice,</text>
  <text x="116" y="926" text-anchor="middle" font-size="14">SMTP / IMAP email,</text>
  <text x="116" y="944" text-anchor="middle" font-size="14">NWS weather (06)</text>

  <!-- CLI -->
  <text x="24" y="1000" font-weight="bold">Codes: made at home with the CLI (main.rs)</text>
  <rect x="16" y="1016" width="148" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="90" y="1042" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode keygen</text>
  <text x="90" y="1064" text-anchor="middle" font-size="14">32 random bytes</text>
  <line x1="164" y1="1048" x2="192" y2="1048" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <rect x="196" y="1016" width="148" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="270" y="1042" text-anchor="middle" font-size="14" font-weight="bold">key file</text>
  <text x="270" y="1064" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">auth.key_file</text>
  <line x1="344" y1="1048" x2="372" y2="1048" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <rect x="376" y="1016" width="148" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="450" y="1042" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode codes</text>
  <text x="450" y="1064" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CodeBook::table</text>
  <line x1="524" y1="1048" x2="552" y2="1048" stroke="#374151" stroke-width="2" marker-end="url(#cn03-arrow)"/>

  <rect x="556" y="1016" width="148" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="630" y="1042" text-anchor="middle" font-size="14" font-weight="bold">paper sheet</text>
  <text x="630" y="1064" text-anchor="middle" font-size="14">carried in the field</text>

  <text x="24" y="1104" font-size="14" fill="#4b5563">The key file is also read by node::build_session (load_codebook).</text>

  <!-- legend -->
  <rect x="24" y="1126" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="48" y="1138" font-size="14">host code</text>
  <rect x="140" y="1126" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="164" y="1138" font-size="14">gate</text>
  <rect x="220" y="1126" width="18" height="14" fill="#f3f4f6" stroke="#374151"/>
  <text x="244" y="1138" font-size="14">person or external service</text>
  <rect x="460" y="1126" width="18" height="14" fill="#ffffff" stroke="#374151"/>
  <text x="484" y="1138" font-size="14">file on disk</text>
</svg>
