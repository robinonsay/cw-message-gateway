<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="1000" fill="#ffffff"/>
  <title>How the three UV-K1 routes connect: the station safety layer drives either the Handheld rig over the radio's USB-C port (route A, parked) or the keyer rig and the keyer box on the K-plug (routes B and C); the radio's speaker comes back to the decoder and the monitor; config and the audit gate everything</title>
  <defs>
    <marker id="k10c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="16" y="34" font-size="20" font-weight="bold">How the UV-K1 routes connect</text>
  <text x="16" y="56" font-size="14" fill="#4b5563">One station layer over every route; only the rig under it changes.</text>

  <!-- node loop and station safety layer -->
  <rect x="40" y="76" width="640" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="102" text-anchor="middle" font-weight="bold">Node loop and station safety layer (page 05)</text>
  <text x="360" y="124" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Station&lt;R: Rig&gt;</tspan>: sets up and checks the radio before every</text>
  <text x="360" y="144" text-anchor="middle" font-size="14">transmission; sends CW in pieces of at most 30 characters</text>

  <!-- Rig trait calls -->
  <line x1="145" y1="156" x2="145" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="155" y="186" font-size="14">Rig trait calls</text>
  <line x1="485" y1="156" x2="485" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="495" y="186" font-size="14">Rig trait calls</text>

  <!-- route A rig -->
  <rect x="40" y="206" width="210" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="145" y="232" text-anchor="middle" font-weight="bold">Route A: Handheld</text>
  <text x="145" y="254" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "handheld"</text>
  <text x="145" y="276" text-anchor="middle" font-size="14">handheld.rs, link.rs</text>

  <!-- routes B and C rig -->
  <rect x="290" y="206" width="390" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="485" y="232" text-anchor="middle" font-weight="bold">Routes B, C: KeyerRig and monitor</text>
  <text x="485" y="254" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "keyer"</tspan> and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">[keyer] output</tspan></text>
  <text x="485" y="276" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">"ptt"</tspan>, Mode::Mute (B); <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">"key"</tspan>, Mode::Sidetone (C)</text>

  <!-- links to the firmware -->
  <line x1="145" y1="300" x2="145" y2="342" stroke="#374151" stroke-width="2" marker-start="url(#k10c-arrow)" marker-end="url(#k10c-arrow)"/>
  <text x="155" y="318" font-size="14">USB-C CDC,</text>
  <text x="155" y="334" font-size="14">protocol v1</text>
  <line x1="485" y1="300" x2="485" y2="342" stroke="#374151" stroke-width="2" marker-start="url(#k10c-arrow)" marker-end="url(#k10c-arrow)"/>
  <text x="495" y="318" font-size="14">USB serial,</text>
  <text x="495" y="334" font-size="14">keyer protocol 4</text>

  <!-- route A firmware, inside the radio -->
  <rect x="40" y="346" width="210" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="145" y="372" text-anchor="middle" font-weight="bold">UV-K1: NR7Y + hfnode</text>
  <text x="145" y="394" text-anchor="middle" font-size="14">hfnode.c inside the radio</text>
  <text x="145" y="416" text-anchor="middle" font-size="14" fill="#991b1b">Parked; flash NO-GO</text>

  <!-- keyer box -->
  <rect x="290" y="346" width="390" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="485" y="372" text-anchor="middle" font-weight="bold">Keyer box: Pico 2 (page 08)</text>
  <text x="485" y="394" text-anchor="middle" font-size="14">audited firmware, build eef8c126</text>
  <text x="485" y="416" text-anchor="middle" font-size="14">GP17 PTT + GP18 tone (B); GP16 key (C)</text>

  <!-- box outputs to the radios -->
  <line x1="382" y1="436" x2="382" y2="482" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="372" y="466" text-anchor="end" font-size="14">PTT and tone</text>
  <line x1="587" y1="436" x2="587" y2="482" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="577" y="466" text-anchor="end" font-size="14">key, option C</text>

  <!-- radios -->
  <rect x="290" y="486" width="185" height="100" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="382" y="512" text-anchor="middle" font-weight="bold">Route B</text>
  <text x="382" y="534" text-anchor="middle" font-size="14">stock UV-K1</text>
  <text x="382" y="554" text-anchor="middle" font-size="14">K-plug PTT + mic</text>
  <text x="382" y="574" text-anchor="middle" font-size="14">(MCW)</text>
  <rect x="495" y="486" width="185" height="100" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="587" y="512" text-anchor="middle" font-weight="bold">Route C (Robin's)</text>
  <text x="587" y="534" text-anchor="middle" font-size="14">UV-K1, NR7Y v1.3,</text>
  <text x="587" y="554" text-anchor="middle" font-size="14">paddle rework</text>
  <text x="587" y="574" text-anchor="middle" font-size="14">3.5 mm tip is the key</text>

  <!-- speakers down to the audio input -->
  <line x1="145" y1="436" x2="145" y2="632" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="155" y="560" font-size="14">speaker</text>
  <line x1="382" y1="586" x2="382" y2="632" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="392" y="616" font-size="14">speaker</text>
  <line x1="587" y1="586" x2="587" y2="632" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <text x="597" y="616" font-size="14">speaker</text>

  <!-- audio input -->
  <rect x="40" y="636" width="640" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="660" text-anchor="middle" font-weight="bold">Audio in: the CW decoder and the monitor (page 04)</text>
  <text x="360" y="682" text-anchor="middle" font-size="14">a sound card (A, B), or the Mac's built-in microphone on the bench (C)</text>
  <text x="360" y="702" text-anchor="middle" font-size="14">Decoded text goes up to the node (left); the tone to the monitor (right)</text>

  <!-- the audio's way back up -->
  <path d="M40,676 H20 V116 H36" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>
  <path d="M680,676 H700 V251 H684" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k10c-arrow)"/>

  <!-- later, not on main -->
  <rect x="40" y="732" width="640" height="62" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="756" text-anchor="middle" font-size="14">Later, not on main (PR #31): route C's speaker into the keyer box's GP26,</text>
  <text x="360" y="776" text-anchor="middle" font-size="14">the one-Pico image, in place of the sound card (page 11)</text>

  <!-- over every route -->
  <text x="40" y="826" font-weight="bold">Over every route</text>
  <rect x="40" y="840" width="310" height="104" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="56" y="864" font-weight="bold">Config file (page 15)</text>
  <text x="56" y="886" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">[station] rig</text>
  <text x="56" y="906" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">[handheld]</tspan> (A)</text>
  <text x="56" y="926" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">[keyer] output, commissioned</tspan></text>
  <rect x="370" y="840" width="310" height="104" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="386" y="864" font-weight="bold">Safety audit and bench</text>
  <text x="386" y="886" font-size="14">gate every flash, every wiring</text>
  <text x="386" y="906" font-size="14">change and every keyed stage</text>
  <text x="386" y="926" font-size="14">(page 14); unattended: not cleared</text>

  <!-- legend -->
  <rect x="16" y="962" width="18" height="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42" y="976" font-size="14">host</text>
  <rect x="96" y="962" width="18" height="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="122" y="976" font-size="14">firmware</text>
  <rect x="208" y="962" width="18" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="234" y="976" font-size="14">radio</text>
  <rect x="294" y="962" width="18" height="18" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="320" y="976" font-size="14">safety gate</text>
  <rect x="420" y="962" width="18" height="18" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="446" y="976" font-size="14">not on main yet</text>
</svg>
