<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1518" width="720" height="1518" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Audio from the radio to the decoder on each operating system: the radio's audio goes into a sound card; on Linux arecord delivers mono 16-bit samples at the decoder's rate, on macOS and Windows cpal reads the device in its own format and hfnode averages it to mono and resamples it; all three feed the Blocker, which cuts 50 ms blocks, shows each one to the tap (the keyer's sidetone monitor) and queues it for the node loop and its decoder</title>
  <defs><marker id="a04c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="720" height="1518" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Receive audio: from the radio to the decoder</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">One capture backend per operating system, chosen when hfnode is built.</text>
  <rect x="40" y="84" width="640" height="66" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="52" y="114" font-weight="bold">Radio</text>
  <text x="52" y="140" font-size="14">Receive audio from the AF output, headphone or speaker jack.</text>
  <line x1="360" y1="150" x2="360" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="40" y="178" width="640" height="86" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="52" y="208" font-weight="bold">Sound card</text>
  <text x="52" y="234" font-size="14">IC-7300: the radio's own USB audio codec, on its USB cable.</text>
  <text x="52" y="254" font-size="14">Other radios and handhelds: a USB sound card or a line input.</text>
  <line x1="70" y1="264" x2="70" y2="304" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="40" y="304" width="290" height="166" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="52" y="334" font-weight="bold">Linux: arecord</text>
  <text x="52" y="360" font-size="14" fill="#4b5563">and other Unix; from alsa-utils</text>
  <text x="52" y="380" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">-D &lt;audio.device&gt;</text>
  <text x="52" y="400" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">-f S16_LE -c 1 -t raw</text>
  <text x="52" y="420" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">-r &lt;audio.sample_rate&gt;</text>
  <text x="52" y="440" font-size="14">ALSA plughw converts rate and</text>
  <text x="52" y="460" font-size="14">channels; raw bytes on a pipe</text>
  <rect x="390" y="304" width="139" height="66" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="402" y="334" font-weight="bold">Core Audio</text>
  <text x="402" y="360" font-size="14" fill="#4b5563">macOS</text>
  <rect x="541" y="304" width="139" height="66" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="553" y="334" font-weight="bold">WASAPI</text>
  <text x="553" y="360" font-size="14" fill="#4b5563">Windows</text>
  <line x1="459" y1="264" x2="459" y2="304" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <line x1="610" y1="264" x2="610" y2="304" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <line x1="459" y1="370" x2="459" y2="398" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <line x1="610" y1="370" x2="610" y2="398" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="390" y="398" width="290" height="126" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="402" y="428" font-weight="bold">cpal 0.16 stream (native.rs)</text>
  <text x="402" y="454" font-size="14">the one input whose name matches</text>
  <text x="402" y="474" font-size="14">audio.device (pick_device), in its</text>
  <text x="402" y="494" font-size="14">own format: often 44.1 or 48 kHz</text>
  <text x="402" y="514" font-size="14">stereo; channels averaged to mono</text>
  <line x1="535" y1="524" x2="535" y2="552" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="390" y="552" width="290" height="126" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="402" y="582" font-weight="bold">Resampler (resample.rs)</text>
  <text x="402" y="608" font-size="14">Kaiser-windowed sinc down to</text>
  <text x="402" y="628" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">audio.sample_rate</text>
  <text x="402" y="648" font-size="14">16 zero crossings, 64 phases,</text>
  <text x="402" y="668" font-size="14">beta 8, pass band 0.9</text>
  <line x1="185" y1="470" x2="185" y2="498" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="40" y="498" width="290" height="106" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="52" y="528" font-weight="bold">Reader thread (alsa.rs)</text>
  <text x="52" y="554" font-size="14">reads one block of bytes at</text>
  <text x="52" y="574" font-size="14">a time from the pipe;</text>
  <text x="52" y="594" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">i16 / 32768 -&gt; f32</text>
  <line x1="185" y1="604" x2="185" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <line x1="535" y1="678" x2="535" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <text x="197" y="663" font-size="14" fill="#4b5563" text-anchor="start">mono f32 samples</text>
  <text x="197" y="681" font-size="14" fill="#4b5563" text-anchor="start">at audio.sample_rate</text>
  <rect x="40" y="730" width="640" height="146" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="52" y="760" font-weight="bold">Blocker (audio.rs), on the backend's thread</text>
  <text x="52" y="784" font-size="14" fill="#4b5563">Linux: the reader thread. macOS/Windows: cpal's audio callback.</text>
  <text x="52" y="806" font-size="14">Cuts blocks of sample_rate / 20 samples: 50 ms, 400 samples at 8000 Hz.</text>
  <text x="52" y="826" font-size="14">Stamps each block with at = Instant::now() when it is complete.</text>
  <text x="52" y="846" font-size="14">Warns once if the first 3 s are exact zeros: no audio is reaching hfnode.</text>
  <text x="52" y="866" font-size="14">Shows each block to the tap first, then queues it.</text>
  <line x1="185" y1="876" x2="185" y2="928" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <text x="197" y="906" font-size="14" fill="#4b5563" text-anchor="start">2. every block</text>
  <line x1="535" y1="876" x2="535" y2="928" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <text x="547" y="906" font-size="14" fill="#4b5563" text-anchor="start">1. tap (keyer rig only)</text>
  <rect x="40" y="928" width="290" height="106" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="52" y="958" font-weight="bold">Queue (audio::queue)</text>
  <text x="52" y="984" font-size="14">200 blocks = 10 s. When full,</text>
  <text x="52" y="1004" font-size="14">the oldest block is dropped:</text>
  <text x="52" y="1024" font-size="14">the backend's thread never waits.</text>
  <rect x="390" y="928" width="290" height="146" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="402" y="958" font-weight="bold">Sidetone monitor (keyer)</text>
  <text x="402" y="984" font-size="14">Measures each 10 ms at the</text>
  <text x="402" y="1004" font-size="14">sidetone pitch to confirm the</text>
  <text x="402" y="1024" font-size="14">radio keyed and unkeyed (key</text>
  <text x="402" y="1044" font-size="14">open): the keyer box's only</text>
  <text x="402" y="1064" font-size="14">read-back (pages 09, 13).</text>
  <line x1="185" y1="1034" x2="185" y2="1106" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <text x="197" y="1064" font-size="14" fill="#4b5563" text-anchor="start">recv_timeout(5 s)</text>
  <rect x="40" y="1106" width="290" height="190" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="52" y="1136" font-weight="bold">Node loop (node.rs)</text>
  <text x="52" y="1162" font-size="14">TxGuard drops blocks captured</text>
  <text x="52" y="1182" font-size="14">while transmitting or tuning,</text>
  <text x="52" y="1202" font-size="14">plus RX_RECOVERY_MS = 250 ms.</text>
  <text x="52" y="1222" font-size="14">reset_levels after each send;</text>
  <text x="52" y="1242" font-size="14">reset_speed when idle, once 60 s</text>
  <text x="52" y="1262" font-size="14">of audio have passed since the</text>
  <text x="52" y="1282" font-size="14">window start, last send or reset.</text>
  <rect x="390" y="1106" width="290" height="126" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="402" y="1136" font-weight="bold">Or, instead of the node loop</text>
  <text x="402" y="1162" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">hfnode listen</text>
  <text x="402" y="1182" font-size="14">decodes and prints the text</text>
  <text x="402" y="1202" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">hfnode record</text>
  <text x="402" y="1222" font-size="14">writes the samples to a WAV file</text>
  <path d="M330,1010 H366 V1136 H390" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <text x="340" y="1002" font-size="14" fill="#4b5563" text-anchor="start">or</text>
  <line x1="185" y1="1296" x2="185" y2="1324" stroke="#374151" stroke-width="2" marker-end="url(#a04c-arrow)"/>
  <rect x="40" y="1324" width="640" height="106" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="52" y="1354" font-weight="bold">cw::Decoder::push(&amp;block.samples)</text>
  <text x="52" y="1380" font-size="14">Inside: the decoder pipeline (next figure). Its Char, Unknown and</text>
  <text x="52" y="1400" font-size="14">WordGap events become the text that the node checks against the</text>
  <text x="52" y="1420" font-size="14">field protocol (pages 03 and 05).</text>
  <text x="24" y="1466" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1478" width="22" height="16" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="54" y="1491" font-size="14">hardware</text>
  <rect x="148" y="1478" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="178" y="1491" font-size="14">operating system</text>
  <rect x="336" y="1478" width="22" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="366" y="1491" font-size="14">hfnode code</text>
  <rect x="484" y="1478" width="22" height="16" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="514" y="1491" font-size="14">safety check</text>
</svg>