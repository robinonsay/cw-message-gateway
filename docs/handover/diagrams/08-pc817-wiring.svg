<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
  <title>Wiring: Pico 2 GP16 (pin 21) through 470 ohm to PC817 pin 1 (anode), PC817 pin 2 (cathode) to Pico GND (pin 23), a 4.7 kilohm pull-down from GP16 to GND, PC817 pin 4 (collector) to the key plug's tip and pin 3 (emitter) to its sleeve, ring not connected</title>
  <defs>
    <marker id="k08w-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="16" y="34" font-size="20" font-weight="bold">Keyer box: the key output (on main)</text>
  <text x="16" y="58" font-size="14" fill="#4b5563">Drawn from docs/keyer.md, "Wiring the box" (lines 48-76), at main 44185fa.</text>

  <!-- Pico 2 -->
  <rect x="16" y="96" width="120" height="250" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="76" y="124" text-anchor="middle" font-weight="bold">Pico 2</text>
  <text x="76" y="142" text-anchor="middle" font-size="14" fill="#4b5563">RP2350</text>
  <text x="126" y="176" text-anchor="end" font-weight="bold">GP16</text>
  <text x="126" y="196" text-anchor="end" font-size="14">pin 21</text>
  <text x="126" y="296" text-anchor="end" font-weight="bold">GND</text>
  <text x="126" y="316" text-anchor="end" font-size="14">pin 23</text>

  <!-- GP16 net: pin 21, junction J1, 470 ohm, 4.7 kohm -->
  <line x1="136" y1="180" x2="215" y2="180" stroke="#374151" stroke-width="2"/>
  <circle cx="180" cy="180" r="4" fill="#374151"/>
  <rect x="215" y="169" width="70" height="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="250" y="160" text-anchor="middle" font-weight="bold">470 Ω</text>
  <line x1="285" y1="180" x2="330" y2="180" stroke="#374151" stroke-width="2"/>

  <!-- 4.7 kohm pull-down, GP16 to GND -->
  <line x1="180" y1="180" x2="180" y2="205" stroke="#374151" stroke-width="2"/>
  <rect x="169" y="205" width="22" height="70" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <line x1="180" y1="275" x2="180" y2="300" stroke="#374151" stroke-width="2"/>
  <text x="200" y="230" font-weight="bold">4.7 kΩ</text>
  <text x="200" y="249" font-size="14" fill="#991b1b">required</text>
  <text x="200" y="267" font-size="14" fill="#991b1b">(RP2350-E9)</text>

  <!-- GND net: pin 23, junction J2, PC817 pin 2 -->
  <line x1="136" y1="300" x2="330" y2="300" stroke="#374151" stroke-width="2"/>
  <circle cx="180" cy="300" r="4" fill="#374151"/>

  <!-- PC817 -->
  <rect x="330" y="110" width="230" height="236" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="445" y="134" text-anchor="middle" font-weight="bold">PC817</text>
  <text x="445" y="152" text-anchor="middle" font-size="14" fill="#4b5563">optocoupler</text>
  <text x="338" y="173" font-size="14">1 anode</text>
  <text x="338" y="320" font-size="14">2 cathode</text>
  <text x="552" y="173" text-anchor="end" font-size="14">collector 4</text>
  <text x="552" y="320" text-anchor="end" font-size="14">emitter 3</text>
  <!-- LED: pin 1 to pin 2 -->
  <path d="M330,180 L420,180 L420,215" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M405,215 L435,215 L420,252 z" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <line x1="405" y1="252" x2="435" y2="252" stroke="#374151" stroke-width="2"/>
  <path d="M420,252 L420,300 L330,300" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- light -->
  <line x1="442" y1="224" x2="478" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#k08w-arrow)"/>
  <line x1="442" y1="242" x2="478" y2="254" stroke="#374151" stroke-width="2" marker-end="url(#k08w-arrow)"/>
  <!-- phototransistor: pin 4 collector, pin 3 emitter -->
  <line x1="490" y1="226" x2="490" y2="274" stroke="#374151" stroke-width="3"/>
  <path d="M490,240 L515,222 L515,180 L560,180" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M490,260 L515,278 L515,300 L560,300" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M515,278 L503,277 L509,268 z" fill="#374151"/>

  <!-- key plug -->
  <line x1="560" y1="180" x2="610" y2="180" stroke="#374151" stroke-width="2"/>
  <line x1="560" y1="300" x2="610" y2="300" stroke="#374151" stroke-width="2"/>
  <text x="661" y="122" text-anchor="middle" font-weight="bold">key plug</text>
  <text x="661" y="140" text-anchor="middle" font-size="14" fill="#4b5563">stereo</text>
  <rect x="610" y="150" width="102" height="196" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="620" y="186" font-weight="bold">tip</text>
  <text x="620" y="205" font-size="14" fill="#4b5563">key line</text>
  <text x="620" y="236">ring</text>
  <text x="620" y="254" font-size="14" fill="#4b5563">not</text>
  <text x="620" y="271" font-size="14" fill="#4b5563">connected</text>
  <text x="620" y="306" font-weight="bold">sleeve</text>
  <text x="620" y="325" font-size="14" fill="#4b5563">radio GND</text>

  <!-- notes -->
  <text x="16" y="384" font-size="14">GP16 high: about 4.5 mA through 470 Ω lights the LED, the transistor conducts,</text>
  <text x="16" y="402" font-size="14">and the radio's key line is closed (the radio transmits).</text>
  <text x="16" y="428" font-size="14">GP16 low, or not driven at all: the 4.7 kΩ holds it at 0 V and the key stays open.</text>
  <text x="16" y="454" font-size="14" font-weight="bold">The box's pin LOW means key OPEN. So a bare GPIO must never drive</text>
  <text x="16" y="472" font-size="14" font-weight="bold">a radio that keys on a low line: every safe state of the box would key it.</text>

  <!-- legend -->
  <rect x="16" y="500" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="40" y="512" font-size="14">hardware</text>
  <rect x="130" y="500" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="154" y="512" font-size="14">safety part: never leave it out</text>
  <circle cx="400" cy="507" r="4" fill="#374151"/>
  <text x="412" y="512" font-size="14">junction</text>
</svg>
