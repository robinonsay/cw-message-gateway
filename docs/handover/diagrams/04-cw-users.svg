<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" width="720" height="1100" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Who uses the cw crate: the field protocol, the node loop and CLI, the station, the IC-7300 and UV-K1 drivers, the keyer-core tests, the self-test and mocks, and (PR #30 and #31) the Pico 2 images and the sidetone monitor, each arrow labelled with what that part takes from the crate</title>
  <defs><marker id="u04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="720" height="1100" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Who uses the cw crate, and for what</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Arrow labels: what each part takes from the crate. Page numbers in brackets.</text>
  <rect x="24" y="76" width="22" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
