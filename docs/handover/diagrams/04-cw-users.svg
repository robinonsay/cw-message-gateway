<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1116" width="720" height="1116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Who uses the cw crate: the crate on the left, with its modules morse, decoder, synth, math and PR #30's level; arrows to each part that uses it, labelled with what it takes: the node loop and CLI take Decoder and events_to_text, and the synth command Keyer and Noise; the field protocol takes encode_char and is_sendable; the station units and mark_units; the IC-7300 driver is_sendable; the UV-K1 handheld driver is_sendable and units; the keyer-core tests encode_char and units; the self-test and mocks Keyer, Noise, Keyer::timing and encode_char; and (PR #30 and #31) the Pico 2 images take the no_std Decoder and level through decoder-core, and hfnode's sidetone monitor takes level. A safety note says that with PR #30 and #31 a change to morse, decoder, math or level changes the Pico 2 UF2s and needs a new hash and the audit</title>
  <defs><marker id="u04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="720" height="1116" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Who uses the cw crate, and for what</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Arrow labels: what each part takes from the crate. Page numbers in brackets.</text>
  <rect x="24" y="84" width="190" height="944" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="114" font-weight="bold">cw crate</text>
  <text x="36" y="134" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">crates/cw</text>
  <text x="36" y="154" font-size="14" fill="#4b5563">no_std without its std</text>
  <text x="36" y="172" font-size="14" fill="#4b5563">feature, no heap</text>
  <text x="36" y="208" font-size="14" font-weight="bold">morse.rs</text>
  <text x="36" y="230" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">TABLE (private)</text>
  <text x="36" y="249" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">encode_char</text>
  <text x="36" y="268" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">decode_pattern</text>
  <text x="36" y="287" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">is_sendable</text>
  <text x="36" y="306" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">units, mark_units</text>
  <text x="36" y="325" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">duration_ms</text>
  <text x="36" y="364" font-size="14" font-weight="bold">decoder.rs</text>
  <text x="36" y="386" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Decoder</text>
  <text x="36" y="405" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DecoderConfig</text>
  <text x="36" y="424" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Event, DecodeEvent</text>
  <text x="36" y="443" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">events_to_text</text>
  <text x="36" y="462" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WORD_RUNS</text>
  <text x="36" y="501" font-size="14" font-weight="bold">synth.rs (std, tests)</text>
  <text x="36" y="523" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Keyer, Noise</text>
  <text x="36" y="562" font-size="14" font-weight="bold">math.rs (private)</text>
  <text x="36" y="584" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">std or libm</text>
  <rect x="34" y="617" width="170" height="104" rx="4" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="44" y="641" font-size="14" font-weight="bold">level.rs (PR #30)</text>
  <text x="44" y="663" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">measure, db,</text>
  <text x="44" y="682" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">goertzel_coeff,</text>
  <text x="44" y="701" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Level</text>
  <rect x="34" y="820" width="170" height="194" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="44" y="844" font-size="14" font-weight="bold">Safety gate</text>
  <text x="44" y="864" font-size="14">With PR #30 and #31,</text>
  <text x="44" y="884" font-size="14">a change to morse,</text>
  <text x="44" y="904" font-size="14">decoder, math or</text>
  <text x="44" y="924" font-size="14">level changes the</text>
  <text x="44" y="944" font-size="14">Pico 2 UF2s: a new</text>
  <text x="44" y="964" font-size="14">SHA-256 and audit</text>
  <text x="44" y="984" font-size="14">before any flash</text>
  <text x="44" y="1004" font-size="14">(pages 13, 14).</text>
  <rect x="454" y="84" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="466" y="110" font-weight="bold">Node loop and CLI</text>
  <text x="466" y="132" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode node.rs, main.rs</text>
  <text x="466" y="154" font-size="14">decodes the radio's audio;</text>
  <text x="466" y="174" font-size="14">synth makes test WAVs (05)</text>
  <line x1="214" y1="136" x2="454" y2="136" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="127" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">Decoder, events_to_text</text>
  <text x="226" y="158" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">Keyer, Noise</text>
  <rect x="454" y="204" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="466" y="230" font-weight="bold">Field protocol</text>
  <text x="466" y="252" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">protocol fuzzy.rs, text.rs</text>
  <text x="466" y="274" font-size="14">snaps noisy words to its</text>
  <text x="466" y="294" font-size="14">vocabulary; sendable text (03)</text>
  <line x1="214" y1="256" x2="454" y2="256" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="247" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">encode_char, is_sendable</text>
  <rect x="454" y="324" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="466" y="350" font-weight="bold">Station</text>
  <text x="466" y="372" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode station.rs</text>
  <text x="466" y="394" font-size="14">safety timing: length limit,</text>
  <text x="466" y="414" font-size="14">duty rest, keying watchdog (05)</text>
  <line x1="214" y1="376" x2="454" y2="376" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="367" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">units, mark_units</text>
  <rect x="454" y="444" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="466" y="470" font-weight="bold">IC-7300 driver</text>
  <text x="466" y="492" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">civ ic7300.rs</text>
  <text x="466" y="514" font-size="14">keys only sendable text</text>
  <text x="466" y="534" font-size="14">with CI-V command 17 (07)</text>
  <line x1="214" y1="496" x2="454" y2="496" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="487" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">is_sendable</text>
  <rect x="454" y="564" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="466" y="590" font-weight="bold">UV-K1 handheld driver</text>
  <text x="466" y="612" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode handheld.rs</text>
  <text x="466" y="634" font-size="14">refuses unkeyable text and runs</text>
  <text x="466" y="654" font-size="14">past the transmit limit (10)</text>
  <line x1="214" y1="616" x2="454" y2="616" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="607" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">is_sendable, units</text>
  <rect x="454" y="684" width="242" height="104" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="466" y="710" font-weight="bold">keyer-core tests</text>
  <text x="466" y="732" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">dev-dependency only</text>
  <text x="466" y="754" font-size="14">the box's own table and timing</text>
  <text x="466" y="774" font-size="14">must match cw's (08)</text>
  <line x1="214" y1="736" x2="454" y2="736" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
