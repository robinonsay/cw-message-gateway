  <text x="466" y="830" font-weight="bold">Self-test and mocks</text>
  <text x="466" y="852" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">selftest, civ sim, mocks</text>
  <text x="466" y="874" font-size="14">field operators' audio, mock</text>
  <text x="466" y="894" font-size="14">keying and band noise (12)</text>
  <line x1="214" y1="856" x2="454" y2="856" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="847" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">Keyer, Noise</text>
