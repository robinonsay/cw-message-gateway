  <text x="466" y="180" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode node.rs, main.rs</text>
  <text x="466" y="202" font-size="14">decodes the radio's audio;</text>
  <text x="466" y="222" font-size="14">synth makes test WAVs (05)</text>
