  <text x="466" y="398" font-weight="bold">Station</text>
  <text x="466" y="420" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode station.rs</text>
  <text x="466" y="442" font-size="14">safety timing: length limit,</text>
  <text x="466" y="462" font-size="14">duty rest, keying watchdog (05)</text>
  <line x1="214" y1="424" x2="454" y2="424" stroke="#374151" stroke-width="2" marker-end="url(#u04-arrow)"/>
  <text x="226" y="415" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#111827">units, mark_units</text>
