  <text x="350" y="89" font-size="14">not on main yet (open PR)</text>
  <rect x="546" y="76" width="22" height="16" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="576" y="89" font-size="14">safety gate</text>
  <rect x="24" y="132" width="190" height="944" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="162" font-weight="bold">cw crate</text>
  <text x="36" y="182" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">crates/cw</text>
  <text x="36" y="202" font-size="14" fill="#4b5563">no_std without its std</text>
  <text x="36" y="220" font-size="14" fill="#4b5563">feature, no heap</text>
  <text x="36" y="256" font-size="14" font-weight="bold">morse.rs</text>
  <text x="36" y="278" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">TABLE (private)</text>
  <text x="36" y="297" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">encode_char</text>
  <text x="36" y="316" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">decode_pattern</text>
  <text x="36" y="335" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">is_sendable</text>
  <text x="36" y="354" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">units, mark_units</text>
  <text x="36" y="373" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">duration_ms</text>
  <text x="36" y="412" font-size="14" font-weight="bold">decoder.rs</text>
  <text x="36" y="434" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Decoder</text>
  <text x="36" y="453" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DecoderConfig</text>
