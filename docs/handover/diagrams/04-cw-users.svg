  <text x="466" y="972" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">decoder-core (PR #30, #31)</text>
  <text x="466" y="994" font-size="14">decoder box, one-Pico image,</text>
  <text x="466" y="1014" font-size="14">and hfnode's monitor (09, 11)</text>
