  <text x="466" y="300" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">protocol fuzzy.rs, text.rs</text>
  <text x="466" y="322" font-size="14">snaps noisy words to its</text>
  <text x="466" y="342" font-size="14">vocabulary; sendable text (03)</text>
