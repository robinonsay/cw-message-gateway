  <text x="36" y="632" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">std or libm</text>
  <rect x="34" y="665" width="170" height="104" rx="4" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="44" y="689" font-size="14" font-weight="bold">level.rs (PR #30)</text>
  <text x="44" y="711" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">measure, db,</text>
  <text x="44" y="730" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">goertzel_coeff,</text>
  <text x="44" y="749" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Level</text>
  <rect x="34" y="868" width="170" height="194" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="44" y="892" font-size="14" font-weight="bold">Safety gate</text>
  <text x="44" y="912" font-size="14">With PR #30 and #31,</text>
  <text x="44" y="932" font-size="14">a change to morse,</text>
  <text x="44" y="952" font-size="14">decoder, math or</text>
  <text x="44" y="972" font-size="14">level changes the</text>
  <text x="44" y="992" font-size="14">Pico 2 UF2s: a new</text>
  <text x="44" y="1012" font-size="14">SHA-256 and audit</text>
  <text x="44" y="1032" font-size="14">before any flash</text>
  <text x="44" y="1052" font-size="14">(pages 13, 14).</text>
  <rect x="454" y="132" width="242" height="104" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
