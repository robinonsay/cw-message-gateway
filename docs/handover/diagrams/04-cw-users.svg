  <text x="36" y="491" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">events_to_text</text>
  <text x="36" y="510" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WORD_RUNS</text>
