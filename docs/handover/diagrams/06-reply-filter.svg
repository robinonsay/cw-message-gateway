<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1350" width="720" height="1350" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The reply filter's decision flow: a message is sanitized, sent to Claude or Ollama, and either kept, redacted with REDACTED markers, withheld as MSG WITHHELD BY FILTER, or held unscreened when the service cannot be reached or times out; a third timeout on one message withholds it</title>
  <defs>
    <marker id="k06filter-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1350" fill="#ffffff"/>
  <text x="24.0" y="36.0" text-anchor="start" font-size="20" fill="#111827" font-weight="bold">The reply filter</text>
  <text x="24.0" y="60.0" text-anchor="start" font-size="14" fill="#4b5563">node.rs screen_inbox and gateway/filter.rs, for each Unscreened message</text>
  <rect x="30.0" y="84.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="111.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">An <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Unscreened</tspan> message</tspan></text>
  <text x="42.0" y="129.2" text-anchor="start" font-size="14" fill="#111827">in the <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">screen</tspan> thread</text>
  <path d="M180.0,148.0 L180.0,174.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <rect x="30.0" y="176.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="203.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">sanitize(raw)</tspan></tspan></text>
  <text x="42.0" y="221.2" text-anchor="start" font-size="14" fill="#111827">the text exactly as it would be keyed</text>
  <path d="M180.0,240.0 L180.0,266.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <rect x="30.0" y="268.0" width="300.0" height="56.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="300.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">filter.enabled</tspan>?</tspan></text>
  <path d="M330.0,296.0 L378.0,296.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="349.0" y="284.0" text-anchor="middle" font-size="14" fill="#4b5563">no</text>
  <rect x="380.0" y="256.0" width="310.0" height="80.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="282.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Ready, unscreened</tspan></text>
  <text x="392.0" y="300.2" text-anchor="start" font-size="14" fill="#111827">the sanitized text as it is;</text>
  <text x="392.0" y="318.2" text-anchor="start" font-size="14" fill="#111827">the design advises against it</text>
  <path d="M180.0,324.0 L180.0,354.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="192.0" y="339.0" text-anchor="start" font-size="14" fill="#4b5563">yes</text>
  <rect x="30.0" y="356.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="383.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Screener built at start?</tspan></text>
  <text x="42.0" y="401.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Screener::new</tspan> succeeded</text>
  <path d="M330.0,388.0 L378.0,388.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="349.0" y="376.0" text-anchor="middle" font-size="14" fill="#4b5563">no</text>
  <rect x="380.0" y="348.0" width="310.0" height="80.0" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392.0" y="374.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Held until restart</tspan></text>
  <text x="392.0" y="392.2" text-anchor="start" font-size="14" fill="#111827">e.g. the API key variable was</text>
  <text x="392.0" y="410.2" text-anchor="start" font-size="14" fill="#111827">not set when the node started</text>
  <path d="M180.0,420.0 L180.0,450.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="192.0" y="435.0" text-anchor="start" font-size="14" fill="#4b5563">yes</text>
  <rect x="30.0" y="452.0" width="300.0" height="80.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="478.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Fits the context?</tspan></text>
  <text x="42.0" y="496.2" text-anchor="start" font-size="14" fill="#111827">Ollama, before asking:</text>
  <text x="42.0" y="514.2" text-anchor="start" font-size="14" fill="#111827">name + text ≤ <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">local_room</tspan></text>
  <path d="M330.0,492.0 L378.0,492.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="349.0" y="480.0" text-anchor="middle" font-size="14" fill="#4b5563">no</text>
  <rect x="380.0" y="460.0" width="310.0" height="64.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="486.9" text-anchor="start" font-size="15" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSG WITHHELD BY FILTER</tspan></text>
  <text x="392.0" y="504.9" text-anchor="start" font-size="14" fill="#111827">without asking the model</text>
  <path d="M180.0,532.0 L180.0,562.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="192.0" y="547.0" text-anchor="start" font-size="14" fill="#4b5563">yes, or Claude</text>
  <rect x="30.0" y="564.0" width="300.0" height="84.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="592.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Screener::screen</tspan></tspan></text>
  <text x="42.0" y="610.2" text-anchor="start" font-size="14" fill="#111827">one HTTP request: connect ≤ 10 s,</text>
  <text x="42.0" y="628.2" text-anchor="start" font-size="14" fill="#111827">the whole request ≤ <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">timeout_secs</tspan></text>
  <rect x="380.0" y="560.0" width="310.0" height="92.0" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="592.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Claude or Ollama</tspan></text>
  <text x="392.0" y="610.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">POST /v1/messages</tspan>, 120 s default</text>
  <text x="392.0" y="628.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">POST /api/chat</tspan>, 600 s default</text>
  <path d="M330.0,606.0 L378.0,606.0" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k06filter-arrow)" marker-end="url(#k06filter-arrow)"/>
  <path d="M180.0,648.0 L180.0,786.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <rect x="30.0" y="788.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="815.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">What came back?</tspan></text>
  <text x="42.0" y="833.2" text-anchor="start" font-size="14" fill="#111827">the service's answer</text>
  <path d="M330.0,820.0 L355.0,820.0" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M355.0,712.0 L355.0,928.0" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M355.0,712.0 L378.0,712.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <path d="M355.0,788.0 L378.0,788.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <path d="M355.0,852.0 L378.0,852.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <path d="M355.0,928.0 L378.0,928.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <rect x="380.0" y="676.0" width="310.0" height="72.0" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392.0" y="698.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Could not ask</tspan></text>
  <text x="392.0" y="716.2" text-anchor="start" font-size="14" fill="#111827">no connection or an error reply:</text>
  <text x="392.0" y="734.2" text-anchor="start" font-size="14" fill="#111827">held, tried again within 60 s</text>
  <rect x="380.0" y="760.0" width="310.0" height="56.0" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="392.0" y="782.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Timed out, 1st or 2nd time</tspan></text>
  <text x="392.0" y="800.2" text-anchor="start" font-size="14" fill="#111827">held, tried again within 60 s</text>
  <rect x="380.0" y="824.0" width="310.0" height="56.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="846.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">Timed out a 3rd time</tspan></text>
  <text x="392.0" y="864.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSG WITHHELD BY FILTER</tspan></text>
  <rect x="380.0" y="892.0" width="310.0" height="72.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="914.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">No usable verdict</tspan></text>
  <text x="392.0" y="932.2" text-anchor="start" font-size="14" fill="#111827">refused, cut off, or not a verdict:</text>
  <text x="392.0" y="950.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSG WITHHELD BY FILTER</tspan></text>
  <path d="M180.0,852.0 L180.0,1074.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <text x="192.0" y="966.0" text-anchor="start" font-size="14" fill="#4b5563">a verdict</text>
  <rect x="30.0" y="1076.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="42.0" y="1103.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">apply(text, verdict)</tspan></tspan></text>
  <text x="42.0" y="1121.2" text-anchor="start" font-size="14" fill="#111827">the node edits, never the model</text>
  <path d="M330.0,1108.0 L355.0,1108.0" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M355.0,1024.0 L355.0,1200.0" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M355.0,1024.0 L378.0,1024.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <path d="M355.0,1108.0 L378.0,1108.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <path d="M355.0,1200.0 L378.0,1200.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k06filter-arrow)"/>
  <rect x="380.0" y="988.0" width="310.0" height="72.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="1019.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">keep</tspan>, no spans</text>
  <text x="392.0" y="1037.2" text-anchor="start" font-size="14" fill="#111827">the text unchanged</text>
  <rect x="380.0" y="1072.0" width="310.0" height="72.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="1094.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">redact</tspan>, every span found</text>
  <text x="392.0" y="1112.2" text-anchor="start" font-size="14" fill="#111827">each span → <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">REDACTED</tspan>,</text>
  <text x="392.0" y="1130.2" text-anchor="start" font-size="14" fill="#111827">overlapping spans merged</text>
  <rect x="380.0" y="1156.0" width="310.0" height="88.0" rx="14" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="392.0" y="1177.2" text-anchor="start" font-size="16" fill="#111827"><tspan font-weight="bold">drop</tspan>; <tspan font-weight="bold">keep</tspan> with spans;</text>
  <text x="392.0" y="1195.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-weight="bold">redact</tspan> with no span, or one</text>
  <text x="392.0" y="1213.2" text-anchor="start" font-size="14" fill="#111827">that is not in the text:</text>
  <text x="392.0" y="1231.2" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSG WITHHELD BY FILTER</tspan></text>
  <text x="24.0" y="1278.0" text-anchor="start" font-size="14" fill="#111827" font-weight="bold">Legend</text>
  <rect x="24" y="1290" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="50.0" y="1302.0" text-anchor="start" font-size="14" fill="#111827">host code</text>
  <rect x="154" y="1290" width="18" height="14" fill="#f3f4f6" stroke="#374151"/>
  <text x="180.0" y="1302.0" text-anchor="start" font-size="14" fill="#111827">external service</text>
  <rect x="324" y="1290" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="350.0" y="1302.0" text-anchor="start" font-size="14" fill="#111827">held: stays Unscreened</text>
  <rect x="24" y="1316" width="18" height="14" rx="7" fill="#ffffff" stroke="#374151"/>
  <text x="50.0" y="1328.0" text-anchor="start" font-size="14" fill="#111827">stored as Ready: what RX will key on air</text>
</svg>
