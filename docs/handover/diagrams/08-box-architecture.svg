<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1130" width="720" height="1130" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="1130" fill="#ffffff"/>
  <title>Inside the keyer box: the USB serial driver feeds line framing, the control loop and the keyer state machine, which drive the key, PTT and tone pins; the watchdog, pin guards, clock check, saved state and fault handlers guard them; outside, an optocoupler closes the radio's key jack</title>
  <defs>
    <marker id="k08a-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="k08a-small" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="16" y="34" font-size="20" font-weight="bold">Inside the keyer box (on main)</text>
  <text x="16" y="56" font-size="14" fill="#4b5563">Each pass, the loop feeds the watchdog, asks the pin guards and the clock check, and saves state.</text>

  <!-- host -->
  <rect x="36" y="76" width="300" height="60" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="186" y="102" text-anchor="middle" font-weight="bold">hfnode keyer rig (page 09)</text>
  <text x="186" y="123" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">crates/hfnode/src/keyer/</text>
  <text x="200" y="160" font-size="14">USB CDC-ACM serial port:</text>
  <text x="200" y="178" font-size="14">protocol lines both ways</text>

  <!-- the Pico 2 -->
  <rect x="16" y="196" width="688" height="732" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="684" y="220" text-anchor="end" font-weight="bold">Pico 2 (RP2350)</text>
  <line x1="186" y1="136" x2="186" y2="236" stroke="#374151" stroke-width="2" marker-start="url(#k08a-arrow)" marker-end="url(#k08a-arrow)"/>

  <!-- data path (firmware) -->
  <rect x="36" y="236" width="300" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="186" y="262" text-anchor="middle" font-weight="bold">USB serial driver</text>
  <text x="186" y="284" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rustos Rp2350Usb</text>
  <line x1="186" y1="300" x2="186" y2="340" stroke="#374151" stroke-width="2" marker-start="url(#k08a-small)" marker-end="url(#k08a-small)"/>

  <rect x="36" y="340" width="300" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="186" y="366" text-anchor="middle" font-weight="bold">Line framing</text>
  <text x="186" y="388" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">frame.rs: LineReader, decode</text>
  <line x1="186" y1="404" x2="186" y2="444" stroke="#374151" stroke-width="2" marker-start="url(#k08a-small)" marker-end="url(#k08a-small)"/>

  <rect x="36" y="444" width="300" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="186" y="470" text-anchor="middle" font-weight="bold">One pass of the loop</text>
  <text x="186" y="492" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">control.rs: Control::pass</text>
  <line x1="186" y1="508" x2="186" y2="548" stroke="#374151" stroke-width="2" marker-start="url(#k08a-small)" marker-end="url(#k08a-small)"/>

  <rect x="36" y="548" width="300" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="186" y="574" text-anchor="middle" font-weight="bold">Keyer state machine</text>
  <text x="186" y="596" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">keyer.rs: Keyer</text>
  <line x1="186" y1="612" x2="186" y2="736" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <text x="198" y="660" font-size="14">key, tone, PTT</text>
  <text x="198" y="678" font-size="14">as the keyer sets them</text>

  <!-- bus from the loop to the guards -->
  <line x1="336" y1="476" x2="356" y2="476" stroke="#374151" stroke-width="2"/>
  <line x1="356" y1="268" x2="356" y2="528" stroke="#374151" stroke-width="2"/>
  <line x1="356" y1="268" x2="376" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#k08a-small)"/>
  <line x1="356" y1="358" x2="376" y2="358" stroke="#374151" stroke-width="2" marker-end="url(#k08a-small)"/>
  <line x1="356" y1="448" x2="376" y2="448" stroke="#374151" stroke-width="2" marker-end="url(#k08a-small)"/>
  <line x1="356" y1="528" x2="376" y2="528" stroke="#374151" stroke-width="2" marker-end="url(#k08a-small)"/>

  <!-- guards (safety) -->
  <rect x="376" y="236" width="308" height="64" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="530" y="262" text-anchor="middle" font-weight="bold">Watchdog, 500 ms</text>
  <text x="530" y="284" text-anchor="middle" font-size="14">resets the chip unless fed in time</text>

  <rect x="376" y="316" width="308" height="84" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="530" y="342" text-anchor="middle" font-weight="bold">Pin guards (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinGuard</tspan>)</text>
  <text x="530" y="364" text-anchor="middle" font-size="14">key or tone: on 1 s, or a pass over 10 ms</text>
  <text x="530" y="384" text-anchor="middle" font-size="14">PTT: down 60 s</text>

  <rect x="376" y="416" width="308" height="64" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="530" y="442" text-anchor="middle" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ClockCheck</tspan>, every 50 ms</text>
  <text x="530" y="464" text-anchor="middle" font-size="14">TIMER0 against the processor's SysTick</text>

  <rect x="376" y="496" width="308" height="64" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="530" y="522" text-anchor="middle" font-weight="bold">Saved state</text>
  <text x="530" y="544" text-anchor="middle" font-size="14">SCRATCH0-1: trip, keyed, duty budget</text>

  <rect x="376" y="596" width="308" height="120" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="530" y="622" text-anchor="middle" font-weight="bold">Fault and panic handlers</text>
  <text x="530" y="644" text-anchor="middle" font-size="14">HardFault, any other exception, panic:</text>
  <text x="530" y="666" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">safe_state()</tspan> sets GP16 and GP17 low</text>
  <text x="530" y="686" text-anchor="middle" font-size="14">first, in one store; then the tone</text>
  <text x="530" y="706" text-anchor="middle" font-size="14" fill="#4b5563">(not called by the loop)</text>

  <!-- the board's pin calls -->
  <rect x="36" y="736" width="648" height="76" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="760" text-anchor="middle" font-weight="bold">The pins, through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Hardware for Board</tspan> (main.rs)</text>
  <text x="360" y="782" text-anchor="middle" font-size="14">drives key GP16, tone GP18, PTT GP17 (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Outputs::drive</tspan>); LED GP25 (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">set_led</tspan>)</text>
  <text x="360" y="802" text-anchor="middle" font-size="14">reads GP19 before any line or poll: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ptt_line()</tspan> to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Keyer::set_line</tspan></text>

  <line x1="96" y1="812" x2="96" y2="852" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="228" y1="812" x2="228" y2="852" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="420" y1="812" x2="420" y2="852" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="532" y1="812" x2="532" y2="852" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="644" y1="852" x2="644" y2="812" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>

  <!-- pins (hardware) -->
  <rect x="36" y="852" width="120" height="56" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="96" y="875" text-anchor="middle" font-weight="bold">GP16 key</text>
  <text x="96" y="896" text-anchor="middle" font-size="14">pin 21</text>
  <rect x="168" y="852" width="120" height="56" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="228" y="875" text-anchor="middle" font-weight="bold">GP25 LED</text>
  <text x="228" y="896" text-anchor="middle" font-size="14">on the board</text>
  <rect x="368" y="852" width="104" height="56" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="420" y="875" text-anchor="middle" font-weight="bold">GP17 PTT</text>
  <text x="420" y="896" text-anchor="middle" font-size="14">pin 22</text>
  <rect x="480" y="852" width="104" height="56" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="532" y="875" text-anchor="middle" font-weight="bold">GP18 tone</text>
  <text x="532" y="896" text-anchor="middle" font-size="14">pin 24</text>
  <rect x="592" y="852" width="104" height="56" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="644" y="875" text-anchor="middle" font-weight="bold">GP19 line</text>
  <text x="644" y="896" text-anchor="middle" font-size="14">pin 25</text>

  <!-- outside the box -->
  <line x1="96" y1="908" x2="96" y2="968" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="420" y1="908" x2="420" y2="968" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="532" y1="908" x2="532" y2="968" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>
  <line x1="644" y1="968" x2="644" y2="908" stroke="#374151" stroke-width="2" marker-end="url(#k08a-arrow)"/>

  <rect x="16" y="968" width="330" height="88" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="181" y="993" text-anchor="middle" font-weight="bold">Key optocoupler (PC817)</text>
  <text x="181" y="1015" text-anchor="middle" font-size="14">470 Ω; 4.7 kΩ pull-down, required</text>
  <text x="181" y="1035" text-anchor="middle" font-size="14">to the radio's key jack: tip, sleeve</text>

  <rect x="374" y="968" width="330" height="88" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="539" y="993" text-anchor="middle" font-weight="bold">FM handheld (page 10)</text>
  <text x="539" y="1015" text-anchor="middle" font-size="14">PC817 #2 on its PTT, filtered tone</text>
  <text x="539" y="1035" text-anchor="middle" font-size="14">into its mic, PTT sensed back (BAT85)</text>

  <!-- legend -->
  <rect x="16" y="1092" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="40" y="1104" font-size="14">host code</text>
  <rect x="130" y="1092" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
  <text x="154" y="1104" font-size="14">firmware code</text>
  <rect x="270" y="1092" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="294" y="1104" font-size="14">safety part</text>
  <rect x="396" y="1092" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="420" y="1104" font-size="14">hardware</text>
</svg>
