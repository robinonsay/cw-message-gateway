<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1050" width="720" height="1050" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Who passes what to whom: the owner thread pushes a head and sends it to the safety audit, which checks CI's build and posts its verdict and hash to Robin; Robin merges, downloads the artifact, checks the hash and gives the bench thread her go; she runs each stage at the radio, and the bench thread sends the results to the audit, which grades H1</title>
  <defs>
    <marker id="k14r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1050" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Who passes what to whom</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">One change, from a pushed head to bench results; time runs down</text>

  <!-- lifelines -->
  <line x1="76" y1="136" x2="76" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="190" y1="136" x2="190" y2="806" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="190" y1="838" x2="190" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="304" y1="136" x2="304" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="418" y1="136" x2="418" y2="482" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="418" y1="514" x2="418" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="532" y1="136" x2="532" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="646" y1="136" x2="646" y2="860" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- headers -->
  <rect x="24" y="84" width="104" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="76" y="106" font-size="14" font-weight="bold" text-anchor="middle">Owner</text>
  <text x="76" y="126" font-size="14" text-anchor="middle">thread</text>
  <rect x="138" y="84" width="104" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="190" y="106" font-size="14" font-weight="bold" text-anchor="middle">Safety</text>
  <text x="190" y="126" font-size="14" text-anchor="middle">audit</text>
  <rect x="252" y="84" width="104" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="304" y="106" font-size="14" font-weight="bold" text-anchor="middle">CI</text>
  <text x="304" y="126" font-size="14" text-anchor="middle">(GitHub)</text>
  <rect x="366" y="84" width="104" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="418" y="106" font-size="14" font-weight="bold" text-anchor="middle">Robin</text>
  <text x="418" y="126" font-size="14" text-anchor="middle">(owner)</text>
  <rect x="480" y="84" width="104" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="532" y="106" font-size="14" font-weight="bold" text-anchor="middle">Bench</text>
  <text x="532" y="126" font-size="14" text-anchor="middle">thread</text>
  <rect x="594" y="84" width="104" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="646" y="106" font-size="14" font-weight="bold" text-anchor="middle">Radio</text>
  <text x="646" y="126" font-size="14" text-anchor="middle">box or CI-V</text>

  <!-- messages -->
  <line x1="76" y1="176" x2="302" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="86" y="168" font-size="14">push head H</text>

  <line x1="76" y1="222" x2="188" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="86" y="214" font-size="14">PR #, head H</text>

  <line x1="304" y1="268" x2="192" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="296" y="260" font-size="14" text-anchor="end">UF2, log hash</text>

  <line x1="190" y1="322" x2="78" y2="322" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="182" y="298" font-size="14" text-anchor="end" fill="#4b5563">if NO-GO:</text>
  <text x="182" y="314" font-size="14" text-anchor="end" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">req-*.md</text>

  <line x1="190" y1="368" x2="416" y2="368" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="200" y="360" font-size="14">verdict, hash</text>

  <line x1="418" y1="414" x2="306" y2="414" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="410" y="406" font-size="14" text-anchor="end">merge</text>

  <line x1="304" y1="460" x2="416" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="312" y="452" font-size="14">artifact</text>

  <rect x="362" y="482" width="112" height="32" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="418" y="503" font-size="14" text-anchor="middle">hash matches?</text>

  <line x1="418" y1="556" x2="530" y2="556" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="426" y="548" font-size="14" font-weight="bold">go</text>

  <line x1="532" y1="602" x2="420" y2="602" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="524" y="594" font-size="14" text-anchor="end">the steps</text>

  <line x1="418" y1="648" x2="644" y2="648" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="426" y="640" font-size="14">commands</text>

  <line x1="646" y1="694" x2="420" y2="694" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="638" y="686" font-size="14" text-anchor="end">readings</text>

  <line x1="418" y1="740" x2="530" y2="740" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="426" y="732" font-size="14">what she saw</text>

  <line x1="532" y1="786" x2="192" y2="786" stroke="#374151" stroke-width="2" marker-end="url(#k14r-arrow)"/>
  <text x="524" y="778" font-size="14" text-anchor="end">results</text>

  <rect x="138" y="806" width="104" height="32" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="190" y="827" font-size="14" text-anchor="middle">grades H1</text>

  <!-- records -->
  <text x="24" y="892" font-size="14" font-weight="bold">Where it is written</text>
  <rect x="24" y="904" width="206" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="127" y="928" font-size="14" font-weight="bold" text-anchor="middle">On GitHub</text>
  <text x="127" y="948" font-size="14" text-anchor="middle">the PR, CI runs, and</text>
  <text x="127" y="966" font-size="14" text-anchor="middle">the audit's PR comment</text>
  <rect x="257" y="904" width="206" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="360" y="928" font-size="14" font-weight="bold" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">audit/</tspan> (the audit)</text>
  <text x="360" y="948" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">report.md</text>
  <text x="360" y="966" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">final-grades.md</text>
  <rect x="490" y="904" width="206" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="593" y="928" font-size="14" font-weight="bold" text-anchor="middle"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bench/</tspan> (each bench)</text>
  <text x="593" y="948" font-size="14" text-anchor="middle">status table and</text>
  <text x="593" y="966" font-size="14" text-anchor="middle">"Results" section</text>

  <!-- legend -->
  <rect x="24" y="1010" width="18" height="14" fill="#f3f4f6" stroke="#374151"/>
  <text x="50" y="1022" font-size="14">person or service</text>
  <rect x="196" y="1010" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="222" y="1022" font-size="14">gate</text>
  <rect x="280" y="1010" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="306" y="1022" font-size="14">hardware</text>
  <text x="392" y="1022" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">audit/</tspan> and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bench/</tspan>: project files</text>
</svg>
