<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1092" width="720" height="1092" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Sequence of an RX session on the one-Pico keyer box: the host sends 07 RX HELLO; core 0 re-frames it and writes it whole into the ring to core 1, or answers ERR RX BUSY or ERR RX OFF; core 1 replies into the ring back; core 0 forwards the reply as 07 RX OK HELLO only after the keyer's own replies have gone, then forwards the decoder's id-00 lines only while rx_open</title>
  <defs>
    <marker id="k11s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1092" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Keyer protocol 5: an RX session through core 0</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Draft PR #31 at bc5062ae (crates/keyer-core/src/control.rs:494-646): not on main</text>

  <!-- frame: not on main -->
  <rect x="12" y="74" width="696" height="938" rx="10" fill="#ede9fe" fill-opacity="0.35" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- lifeline heads -->
  <rect x="24" y="84" width="96" height="52" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="72" y="106" text-anchor="middle" font-weight="bold">host</text>
  <text x="72" y="126" text-anchor="middle" font-size="14">USB serial</text>
  <rect x="172" y="84" width="156" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="250" y="106" text-anchor="middle" font-weight="bold">core 0</text>
  <text x="250" y="126" text-anchor="middle" font-size="14">keyer_core</text>
  <rect x="358" y="84" width="176" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="446" y="106" text-anchor="middle" font-weight="bold">LINK rings</text>
  <text x="446" y="126" text-anchor="middle" font-size="14">to_core1, from_core1</text>
  <rect x="560" y="84" width="132" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="626" y="106" text-anchor="middle" font-weight="bold">core 1</text>
  <text x="626" y="126" text-anchor="middle" font-size="14">decoder_core</text>

  <!-- lifelines -->
  <line x1="72" y1="136" x2="72" y2="882" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="250" y1="136" x2="250" y2="190" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="250" y1="262" x2="250" y2="346" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="250" y1="376" x2="250" y2="590" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="250" y1="682" x2="250" y2="882" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="446" y1="136" x2="446" y2="882" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="626" y1="136" x2="626" y2="882" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1: RX HELLO in -->
  <text x="82" y="166" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">07 RX HELLO*4F</text>
  <line x1="72" y1="176" x2="248" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- note: rx_command -->
  <rect x="140" y="190" width="290" height="72" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="152" y="210" font-size="14">RX line: never to the keyer</text>
  <text x="152" y="230" font-size="14">core 1 down or CORE1: ERR RX OFF</text>
  <text x="152" y="250" font-size="14">else re-framed, queued whole</text>

  <!-- 2: into to_core1 -->
  <text x="262" y="284" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">07 HELLO*cs LF</text>
  <line x1="250" y1="294" x2="444" y2="294" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- 3: alternative, ring full -->
  <text x="94" y="304" font-size="14">no room:</text>
  <text x="94" y="322" font-size="14">07 ERR RX BUSY</text>
  <line x1="250" y1="334" x2="74" y2="334" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#k11s-arrow)"/>

  <!-- note: rx_open -->
  <rect x="182" y="346" width="136" height="30" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="250" y="366" text-anchor="middle" font-size="14">rx_open = true</text>

  <!-- 4: core 1 reads it -->
  <text x="456" y="400" font-size="14">next pass: usb_read</text>
  <line x1="446" y1="410" x2="624" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- 5: core 1 replies -->
  <text x="468" y="444" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">07 OK HELLO 1 …</text>
  <line x1="626" y1="454" x2="448" y2="454" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- 6: a keyer command meanwhile -->
  <text x="82" y="490" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">08 STATUS*cs</text>
  <line x1="72" y1="500" x2="248" y2="500" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>
  <text x="94" y="528" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">08 OK STATUS …</text>
  <line x1="250" y1="538" x2="74" y2="538" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- 7: core 0 reads from_core1 -->
  <text x="274" y="566" font-size="14">≤ 97 bytes a pass</text>
  <line x1="446" y1="576" x2="252" y2="576" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- note: forwarding gate -->
  <rect x="140" y="590" width="290" height="92" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="152" y="610" font-size="14">re-framed 07 RX OK HELLO …</text>
  <text x="152" y="629" font-size="14">sent only when the keyer's out</text>
  <text x="152" y="648" font-size="14">queue is empty and USB has room</text>
  <text x="152" y="667" font-size="14">for it plus a keyer reply (97 B)</text>

  <!-- 8: reply out -->
  <text x="94" y="704" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">07 RX OK HELLO …</text>
  <line x1="250" y1="714" x2="74" y2="714" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- 9: decoder's own lines -->
  <text x="456" y="746" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00 ST, 00 SL, 00 CH</text>
  <line x1="626" y1="756" x2="448" y2="756" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>
  <text x="274" y="786" font-size="14">one line a pass</text>
  <line x1="446" y1="796" x2="252" y2="796" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>
  <text x="94" y="830" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00 RX ST …</text>
  <text x="94" y="848" font-size="14" fill="#4b5563">only while rx_open</text>
  <line x1="250" y1="860" x2="74" y2="860" stroke="#374151" stroke-width="2" marker-end="url(#k11s-arrow)"/>

  <!-- closing note -->
  <rect x="24" y="900" width="672" height="100" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="36" y="924" font-size="14">rx_open closes on RX TEXT, a USB epoch change, or 2 s with no valid line from the host.</text>
  <text x="36" y="946" font-size="14">While it is closed core 0 drops id-00 lines; a line that does not frame-decode is dropped.</text>
  <text x="36" y="968" font-size="14">Keyer commands (no RX) go to the keyer as on main. The decoder drops to text mode after</text>
  <text x="36" y="990" font-size="14">2 s without an RX line, so a host keeps one (RX STATUS) going while it wants lines.</text>

  <!-- legend -->
  <rect x="24" y="1030" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="48" y="1042" font-size="14">host</text>
  <rect x="102" y="1030" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="126" y="1042" font-size="14">firmware</text>
  <rect x="208" y="1030" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="232" y="1042" font-size="14">gate</text>
  <rect x="292" y="1030" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="316" y="1042" font-size="14">not on main yet</text>
  <line x1="24" y1="1065" x2="56" y2="1065" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/><text x="64" y="1070" font-size="14">only if the line does not fit the ring</text>
</svg>
