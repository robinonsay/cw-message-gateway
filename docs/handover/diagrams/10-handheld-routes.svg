<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" width="720" height="1010" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="1010" fill="#ffffff"/>
  <title>Three ways the project drives a Quansheng UV-K1: A, the parked custom firmware over USB-C; B, the keyer box holding a stock radio's PTT with an MCW tone; C, the keyer box keying a paddle-reworked NR7Y radio as a straight key, each with its audit status</title>
  <defs>
    <marker id="k10r-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="24" y="36" font-size="20" font-weight="bold">Three ways to drive a UV-K1 handheld</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">What connects to what, what keys the radio, and where each route stands.</text>

  <!-- Column headers -->
  <text x="128" y="96" text-anchor="middle" font-weight="bold">A. Custom firmware</text>
  <text x="128" y="116" text-anchor="middle" font-size="14" fill="#4b5563">hfnode image, parked</text>
  <text x="360" y="96" text-anchor="middle" font-weight="bold">B. Box PTT + MCW</text>
  <text x="360" y="116" text-anchor="middle" font-size="14" fill="#4b5563">stock K1, PR #15</text>
  <text x="592" y="96" text-anchor="middle" font-weight="bold">C. NR7Y straight key</text>
  <text x="592" y="116" text-anchor="middle" font-size="14" fill="#4b5563">reworked K1, NR7Y v1.3</text>

  <!-- Row 1: host (station.rig and, for B and C, [keyer] output) -->
  <rect x="24" y="132" width="208" height="100" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="156" font-weight="bold">hfnode</text>
  <text x="36" y="178" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "handheld"</text>
  <text x="36" y="198" font-size="14" fill="#4b5563">the handheld rig</text>

  <rect x="256" y="132" width="208" height="100" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="268" y="156" font-weight="bold">hfnode</text>
  <text x="268" y="178" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "keyer"</text>
  <text x="268" y="198" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">output = "ptt"</text>
  <text x="268" y="218" font-size="14" fill="#4b5563">keyer rig, MCW</text>

  <rect x="488" y="132" width="208" height="100" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="500" y="156" font-weight="bold">hfnode</text>
  <text x="500" y="178" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "keyer"</text>
  <text x="500" y="198" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">output = "key"</text>
  <text x="500" y="218" font-size="14" fill="#4b5563">keyer rig, CW</text>

  <!-- Arrow 1: host to the middle box -->
  <line x1="51" y1="232" x2="51" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="64" y="258" font-size="14">USB-C serial</text>
  <text x="64" y="278" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CW &lt;wpm&gt; &lt;text&gt;</text>

  <line x1="283" y1="232" x2="283" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="296" y="258" font-size="14">USB serial</text>
  <text x="296" y="278" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MCW &lt;wpm&gt; &lt;text&gt;</text>

  <line x1="515" y1="232" x2="515" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="528" y="258" font-size="14">USB serial</text>
  <text x="528" y="278" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CW &lt;wpm&gt; &lt;text&gt;</text>

  <!-- Row 2: the radio's firmware (A) or the keyer box: firmware on top, parts on its board below -->
  <rect x="24" y="292" width="208" height="170" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="316" font-weight="bold">K1 firmware</text>
  <text x="36" y="338" font-size="14">NR7Y CW + hfnode patch</text>
  <text x="36" y="358" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/uv-k1</text>
  <text x="36" y="378" font-size="14">own keyer, own limits</text>

  <path d="M256,392 V300 A8,8 0 0 1 264,292 H456 A8,8 0 0 1 464,300 V392 Z" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="268" y="316" font-weight="bold">Keyer box (Pico 2)</text>
  <text x="268" y="338" font-size="14">GP17: PTT output</text>
  <text x="268" y="358" font-size="14">GP18: 700 Hz tone</text>
  <text x="268" y="378" font-size="14">GP19: PTT sense</text>
  <path d="M256,392 H464 V454 A8,8 0 0 1 456,462 H264 A8,8 0 0 1 256,454 Z" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="268" y="412" font-size="14" fill="#4b5563">on its board:</text>
  <text x="268" y="432" font-size="14">PC817 #2, RC filter,</text>
  <text x="268" y="452" font-size="14">BAT85, 1 nF</text>

  <path d="M488,392 V300 A8,8 0 0 1 496,292 H688 A8,8 0 0 1 696,300 V392 Z" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="500" y="316" font-weight="bold">Keyer box (Pico 2)</text>
  <text x="500" y="338" font-size="14">GP16: key output</text>
  <text x="500" y="358" font-size="14">flashed: build eef8c126</text>
  <path d="M488,392 H696 V454 A8,8 0 0 1 688,462 H496 A8,8 0 0 1 488,454 Z" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="500" y="412" font-size="14" fill="#4b5563">on its board (option C):</text>
  <text x="500" y="432" font-size="14">2N3904, 10 kΩ base,</text>
  <text x="500" y="452" font-size="14">4.7 kΩ pull-down</text>

  <!-- Arrow 2: middle box to the radio -->
  <line x1="51" y1="462" x2="51" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="64" y="488" font-size="14">inside the radio:</text>
  <text x="64" y="506" font-size="14">its own keyer</text>
  <text x="64" y="524" font-size="14">keys the carrier</text>

  <line x1="283" y1="462" x2="283" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="296" y="488" font-size="14">K-plug:</text>
  <text x="296" y="506" font-size="14">PTT held, tone</text>
  <text x="296" y="524" font-size="14">into the mic</text>

  <line x1="515" y1="462" x2="515" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="528" y="488" font-size="14">key: 3.5 mm tip</text>
  <text x="528" y="506" font-size="14">ground:</text>
  <text x="528" y="524" font-size="14">2.5 mm sleeve</text>

  <!-- Row 3: the radio -->
  <rect x="24" y="542" width="208" height="90" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="566" font-weight="bold">UV-K1</text>
  <text x="36" y="588" font-size="14">custom image,</text>
  <text x="36" y="608" font-size="14">CW mode, break-in on</text>

  <rect x="256" y="542" width="208" height="90" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="268" y="566" font-weight="bold">UV-K1, stock</text>
  <text x="268" y="588" font-size="14">stock firmware,</text>
  <text x="268" y="608" font-size="14">no paddle rework</text>

  <rect x="488" y="542" width="208" height="90" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="500" y="566" font-weight="bold">UV-K1, NR7Y v1.3</text>
  <text x="500" y="588" font-size="14">paddle-reworked,</text>
  <text x="500" y="608" font-size="14">CW, CWkin PTT HandKey</text>

  <!-- Arrow 3: the radio's speaker to the listening side -->
  <line x1="51" y1="632" x2="51" y2="680" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="64" y="662" font-size="14" fill="#4b5563">speaker audio</text>
  <line x1="283" y1="632" x2="283" y2="680" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="296" y="662" font-size="14" fill="#4b5563">speaker audio</text>
  <line x1="515" y1="632" x2="515" y2="680" stroke="#374151" stroke-width="2" marker-end="url(#k10r-arrow)"/>
  <text x="528" y="662" font-size="14" fill="#4b5563">speaker, by air</text>

  <!-- Row 4: what hears the radio -->
  <rect x="24" y="682" width="208" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="706" font-size="14">sound card</text>
  <text x="36" y="728" font-size="14">→ hfnode decoder</text>

  <rect x="256" y="682" width="208" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="268" y="706" font-size="14">sound card → hfnode</text>
  <text x="268" y="728" font-size="14">receive-noise check</text>

  <rect x="488" y="682" width="208" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="500" y="706" font-size="14">Mac mic (bench only)</text>
  <text x="500" y="728" font-size="14">→ sidetone monitor</text>

  <!-- Row 5: status -->
  <rect x="24" y="766" width="208" height="180" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="36" y="790" font-weight="bold" fill="#991b1b">PARKED by Robin</text>
  <text x="36" y="812" font-size="14">Audit: flash NO-GO</text>
  <text x="36" y="832" font-size="14">A4 FAIL: calibration</text>
  <text x="36" y="852" font-size="14">C3 FAIL: transmits</text>
  <text x="36" y="872" font-size="14">while charging</text>
  <text x="36" y="892" font-size="14">Q3, Q4 not finished</text>
  <text x="36" y="912" font-size="14">Code on main, tested</text>
  <text x="36" y="932" font-size="14">on simulations only</text>

  <rect x="256" y="766" width="208" height="180" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="268" y="790" font-weight="bold" fill="#991b1b">On main, not in use</text>
  <text x="268" y="812" font-size="14">Audit: GO WITH STEPS</text>
  <text x="268" y="832" font-size="14">(stock K1, attended)</text>
  <text x="268" y="852" font-size="14">Cannot key a reworked</text>
  <text x="268" y="872" font-size="14">K1: the rework cuts</text>
  <text x="268" y="892" font-size="14">its jack's PTT</text>

  <rect x="488" y="766" width="208" height="180" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="500" y="790" font-weight="bold" fill="#991b1b">Robin's route</text>
  <text x="500" y="812" font-size="14">Audit: GO WITH STEPS,</text>
  <text x="500" y="832" font-size="14">own antenna, LOW 1,</text>
  <text x="500" y="852" font-size="14">never coax</text>
  <text x="500" y="872" font-size="14">Bench: stage zero;</text>
  <text x="500" y="892" font-size="14">switch build pending</text>
  <text x="500" y="912" font-size="14">Unattended: not cleared</text>

  <!-- Legend -->
  <rect x="24" y="972" width="18" height="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="50" y="986" font-size="14">host code</text>
  <rect x="144" y="972" width="18" height="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="170" y="986" font-size="14">firmware</text>
  <rect x="258" y="972" width="18" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="284" y="986" font-size="14">radio, hardware</text>
  <rect x="420" y="972" width="18" height="18" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="446" y="986" font-size="14">audit status</text>
</svg>
