<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1176" width="720" height="1176" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>When core 1 faults, panics or hangs: the fault handler opens the key and sets the fault flag, or the heartbeat stops; core 0 sees it on its next pass or after 100 ms, trips CORE1 and stops feeding the watchdog; the watchdog resets the chip and the box comes back tripped CORE1, keying nothing until unplugged</title>
  <defs>
    <marker id="k11f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1176" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">When core 1 fails: fault, panic or hang</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Draft PR #31 at bc5062ae, not on main. Core 0 never waits on core 1.</text>

  <!-- frame: not on main -->
  <rect x="12" y="74" width="696" height="1056" rx="10" fill="#ede9fe" fill-opacity="0.35" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- row 1: causes -->
  <rect x="28" y="92" width="216" height="152" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="116" font-weight="bold">Fault on core 1</text>
  <text x="40" y="140" font-size="14">a store the MPU refuses,</text>
  <text x="40" y="158" font-size="14">or TEST CORE1 FAULT:</text>
  <text x="40" y="176" font-size="14">a store to the SIO</text>

  <rect x="252" y="92" width="216" height="152" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="264" y="116" font-weight="bold">Panic on core 1</text>
  <text x="264" y="140" font-size="14">the panic handler runs</text>
  <text x="264" y="158" font-size="14">safe_state; its first</text>
  <text x="264" y="176" font-size="14">store, to the SIO, is</text>
  <text x="264" y="194" font-size="14">refused by the MPU</text>

  <rect x="476" y="92" width="216" height="152" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="488" y="116" font-weight="bold">Hang on core 1</text>
  <text x="488" y="140" font-size="14">its loop stops passing,</text>
  <text x="488" y="158" font-size="14">or TEST CORE1 HANG</text>
  <text x="488" y="176" font-size="14">spins it forever;</text>
  <text x="488" y="194" font-size="14">a push below MSPLIM</text>
  <text x="488" y="212" font-size="14">may lock it up instead</text>
  <text x="488" y="230" font-size="14" fill="#4b5563">(analysis, untested)</text>

  <!-- arrows row 1 to row 2 -->
  <line x1="136" y1="244" x2="136" y2="284" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>
  <line x1="360" y1="244" x2="360" y2="284" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>
  <text x="372" y="270" font-size="14">a fault</text>
  <line x1="584" y1="244" x2="584" y2="284" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>

  <!-- row 2: handler, heartbeat -->
  <rect x="28" y="288" width="432" height="144" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="312" font-weight="bold">Fault handler on core 1, then safe_state</text>
  <text x="40" y="333" font-size="14" fill="#4b5563">HardFault priority: MPU off in it (HFNMIENA = 0)</text>
  <text x="40" y="356" font-size="14">1. key and PTT open: SIO GPIO_OUT_CLR</text>
  <text x="40" y="376" font-size="14">2. every PWM output silenced</text>
  <text x="40" y="396" font-size="14">3. GP18 tone held low (OUTOVER)</text>
  <text x="40" y="416" font-size="14">4. LINK.fault = true; then it spins</text>

  <rect x="476" y="288" width="216" height="144" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="488" y="312" font-weight="bold">Heartbeat stops</text>
  <text x="488" y="336" font-size="14">LINK.beat stops moving.</text>
  <text x="488" y="356" font-size="14">Core 0 still drives the</text>
  <text x="488" y="376" font-size="14">key as the run says</text>
  <text x="488" y="396" font-size="14">until 100 ms have gone</text>

  <!-- arrows row 2 to row 3 -->
  <line x1="244" y1="432" x2="244" y2="472" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>
  <text x="256" y="458" font-size="14">fault flag</text>
  <line x1="584" y1="432" x2="584" y2="472" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>
  <text x="596" y="458" font-size="14">beat still</text>

  <!-- row 3: core 0 watch -->
  <rect x="28" y="476" width="664" height="104" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="500" font-weight="bold">Core 0, every pass: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">Core1Watch::check(now, beat, fault)</tspan></text>
  <text x="40" y="524" font-size="14">One atomic load each of the beat and the fault flag. Nothing waits.</text>
  <text x="40" y="544" font-size="14">Fault flag set: trips on that pass.</text>
  <text x="40" y="564" font-size="14">Core 1 running and the beat still for 100 ms or more (CORE1_MS, never loosen): trips.</text>

  <line x1="360" y1="580" x2="360" y2="620" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>

  <!-- row 4: trip -->
  <rect x="28" y="624" width="664" height="102" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="648" font-weight="bold">Trip CORE1 (Keyer::trip_now)</text>
  <text x="40" y="672" font-size="14">Key, PTT and tone off, driven open on that same pass</text>
  <text x="40" y="692" font-size="14">starved = true: the watchdog is never fed again</text>
  <text x="40" y="712" font-size="14">The trip is saved in two watchdog scratch registers every pass</text>

  <line x1="360" y1="726" x2="360" y2="766" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>
  <text x="372" y="752" font-size="14">within 500 ms of the last feed</text>

  <!-- row 5: watchdog -->
  <rect x="28" y="770" width="664" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="40" y="794" font-weight="bold">The hardware watchdog (500 ms) resets the chip</text>
  <text x="40" y="818" font-size="14">Both cores restart; the pins reset, so key and PTT stay open (4.7 kΩ pull-downs)</text>

  <line x1="360" y1="834" x2="360" y2="874" stroke="#374151" stroke-width="2" marker-end="url(#k11f-arrow)"/>

  <!-- row 6: boot -->
  <rect x="28" y="878" width="664" height="124" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="902" font-weight="bold">Boot: key and PTT driven low first</text>
  <text x="40" y="926" font-size="14">Saved read back from the scratch registers: trip CORE1 stays (Keyer::restore)</text>
  <text x="40" y="946" font-size="14">HELLO reports boot WATCHDOG; STATUS reports trip CORE1</text>
  <text x="40" y="966" font-size="14">Core 1 is started again, but RX commands get ERR RX OFF</text>
  <text x="40" y="990" font-weight="bold" fill="#991b1b">The box keys nothing more until it is unplugged</text>

  <!-- note -->
  <rect x="28" y="1022" width="664" height="96" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="40" y="1046" font-weight="bold">Core 0 never waits for core 1</text>
  <text x="40" y="1068" font-size="14">Ring reads and writes return at once; at most one line (97 bytes) forwarded a pass.</text>
  <text x="40" y="1088" font-size="14">The launch waits at most 10 ms for core 1's answer, once, at boot.</text>
  <text x="40" y="1108" font-size="14">A fault opens the key at once, but core 0 may drive it again until its pass ends.</text>

  <!-- legend -->
  <rect x="24" y="1146" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="48" y="1158" font-size="14">firmware</text>
  <rect x="130" y="1146" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="154" y="1158" font-size="14">safety</text>
  <rect x="222" y="1146" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="246" y="1158" font-size="14">hardware</text>
  <rect x="332" y="1146" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="356" y="1158" font-size="14">not on main yet</text>
</svg>
