<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1108" width="720" height="1108" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The bench stages for the keyer box with the UV-K1 and for the IC-7300, side by side, with the current stage of each bench marked: stage 3 (contacts and key-line stage zero) on the UV-K1 and stage 2 (radio menus) on the IC-7300</title>
  <rect x="0" y="0" width="720" height="1108" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Where each bench stands</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each stage on Robin's go; UV-K1 stages 1-3 (no RF) overlap; status from the bench files</text>

  <!-- column headings -->
  <text x="24" y="98" font-weight="bold">Keyer box + UV-K1</text>
  <text x="24" y="118" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bench/quansheng.md</tspan>, NR7Y CW route</text>
  <text x="368" y="98" font-weight="bold">IC-7300 by CI-V</text>
  <text x="368" y="118" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bench/ic7300.md</tspan>, test-plan steps</text>

  <!-- UV-K1 column -->
  <rect x="24" y="132" width="328" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="153" font-size="14" font-weight="bold">0, 0b  Code and flash file</text>
  <text x="36" y="173" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main</tspan> = audited; hash confirmed</text>
  <rect x="296" y="147" width="46" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="319" y="163" font-size="14" text-anchor="middle" fill="#4b5563">done</text>

  <rect x="24" y="192" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="213" font-size="14" font-weight="bold">1  Parts, NR7Y CW settings</text>
  <text x="36" y="233" font-size="14" fill="#4b5563">key switch chosen; questions open</text>
  <rect x="300" y="207" width="42" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="321" y="223" font-size="14" text-anchor="middle" fill="#4b5563">part</text>

  <rect x="24" y="252" width="328" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="273" font-size="14" font-weight="bold">H  Host and bench config</text>
  <text x="36" y="293" font-size="14" fill="#4b5563">hfnode built from <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main</tspan></text>
  <rect x="296" y="267" width="46" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="319" y="283" font-size="14" text-anchor="middle" fill="#4b5563">done</text>

  <rect x="24" y="312" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="333" font-size="14" font-weight="bold">2  Flash box, key switch, meter</text>
  <text x="36" y="353" font-size="14" fill="#4b5563">flashed <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">eef8c126</tspan>; wiring next</text>
  <rect x="300" y="327" width="42" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="321" y="343" font-size="14" text-anchor="middle" fill="#4b5563">part</text>

  <rect x="24" y="372" width="328" height="52" rx="8" fill="#fef3c7" stroke="#111827" stroke-width="4"/>
  <text x="36" y="393" font-size="14" font-weight="bold">3  Contacts, stage zero</text>
  <text x="36" y="413" font-size="14" fill="#111827">sleeves apart; tip volts next</text>
  <rect x="292" y="387" width="50" height="22" rx="11" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="317" y="403" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">NOW</text>

  <rect x="24" y="432" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="453" font-size="14" font-weight="bold">4  Touch test through 1 kΩ</text>
  <text x="36" y="473" font-size="14" fill="#4b5563">sidetone, red light off, no RF</text>

  <rect x="24" y="492" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="513" font-size="14" font-weight="bold">5  Cable in, Mac mic, check</text>
  <text x="36" y="533" font-size="14" fill="#4b5563">listen, 30 s idle watch, no RF</text>

  <rect x="24" y="552" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="573" font-size="14" font-weight="bold">5b  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CWbkin</tspan> OFF: key, sidetone</text>
  <text x="36" y="593" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">TEST DE &lt;call&gt;</tspan> heard, no RF</text>

  <rect x="24" y="612" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="633" font-size="14" font-weight="bold">6  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CWbkin</tspan> ON, own antenna</text>
  <text x="36" y="653" font-size="14" fill="#4b5563">LOW 1; key and sidetone on the air</text>
  <rect x="306" y="627" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="324" y="643" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="24" y="672" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="693" font-size="14" font-weight="bold">7  Box limit tests (H1)</text>
  <text x="36" y="713" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hangtest, stucktest, linktest</text>
  <rect x="306" y="687" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="324" y="703" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="24" y="732" width="328" height="52" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="753" font-size="14" font-weight="bold">8  Later: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GP26</tspan> audio</text>
  <text x="36" y="773" font-size="14" fill="#4b5563">redo 5 and 6, after #31 is flashed</text>
  <rect x="306" y="747" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="324" y="763" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <!-- IC-7300 column -->
  <rect x="368" y="132" width="328" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="380" y="153" font-size="14" font-weight="bold">0, 1  Code and questions</text>
  <text x="380" y="173" font-size="14" fill="#4b5563">firmware version: at stage 2</text>
  <rect x="640" y="147" width="46" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="663" y="163" font-size="14" text-anchor="middle" fill="#4b5563">done</text>

  <rect x="368" y="192" width="328" height="52" rx="8" fill="#fef3c7" stroke="#111827" stroke-width="4"/>
  <text x="380" y="213" font-size="14" font-weight="bold">2  Radio menus, USB cable out</text>
  <text x="380" y="233" font-size="14" fill="#111827">a photo of every screen</text>
  <rect x="636" y="207" width="50" height="22" rx="11" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="661" y="223" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">NOW</text>

  <rect x="368" y="252" width="328" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="380" y="273" font-size="14" font-weight="bold">3  Install hfnode, bench config</text>
  <text x="380" y="293" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">selftest</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">testvectors</tspan>, no radio</text>

  <rect x="368" y="312" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="333" font-size="14" font-weight="bold">4  Antenna SWR, tune by hand</text>
  <text x="380" y="353" font-size="14" fill="#4b5563">3:1 or less, tuned 1.5:1 or less</text>
  <rect x="650" y="327" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="343" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="372" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="393" font-size="14" font-weight="bold">5  First connection (step 1)</text>
  <text x="380" y="413" font-size="14" fill="#4b5563">read-only check; sets <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">link</tspan></text>

  <rect x="368" y="432" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="453" font-size="14" font-weight="bold">6  Listen, decode (steps 2, 3)</text>
  <text x="380" y="473" font-size="14" fill="#4b5563">receive only</text>

  <rect x="368" y="492" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="513" font-size="14" font-weight="bold">7  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">radio setup</tspan> (step 4)</text>
  <text x="380" y="533" font-size="14" fill="#4b5563">writes, no transmit; sets <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">setup</tspan></text>

  <rect x="368" y="552" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="573" font-size="14" font-weight="bold">8  <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">radio tune</tspan> (step 5)</text>
  <text x="380" y="593" font-size="14" fill="#4b5563">2-3 s at 5 W; sets <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">tune</tspan></text>
  <rect x="650" y="567" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="583" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="612" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="633" font-size="14" font-weight="bold">9  QRL?, short CW, SWR (step 6)</text>
  <text x="380" y="653" font-size="14" fill="#4b5563">node SWR ≤ 1.5, within 0.3 of radio</text>
  <rect x="650" y="627" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="643" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="672" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="693" font-size="14" font-weight="bold">10  Watchdog, Ctrl-C, link loss</text>
  <text x="380" y="713" font-size="14" fill="#4b5563">step 7, at 6 wpm and 5 W</text>
  <rect x="650" y="687" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="703" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="732" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="753" font-size="14" font-weight="bold">11  Second station (step 12)</text>
  <text x="380" y="773" font-size="14" fill="#4b5563">optional, 5-10 W</text>
  <rect x="650" y="747" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="763" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="792" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="813" font-size="14" font-weight="bold">12  High-SWR lockout (step 8)</text>
  <text x="380" y="833" font-size="14" fill="#4b5563">a 100/150 Ω load; sets <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">keying</tspan></text>
  <rect x="650" y="807" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="668" y="823" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>

  <rect x="368" y="852" width="328" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="380" y="873" font-size="14" font-weight="bold">13  Time-Out Timer by hand</text>
  <text x="380" y="893" font-size="14" fill="#4b5563">step 10, first half, no RF</text>

  <rect x="368" y="912" width="328" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="380" y="933" font-size="14" font-weight="bold">Off this bench</text>
  <text x="380" y="953" font-size="14" fill="#4b5563">steps 9, 10 timer, 11, 13</text>

  <!-- legend -->
  <text x="24" y="996" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1010" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/>
  <text x="50" y="1022" font-size="14">on the computer only</text>
  <rect x="204" y="1010" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="230" y="1022" font-size="14">hardware: box or radio</text>
  <rect x="400" y="1010" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
  <text x="426" y="1022" font-size="14">later (open PR)</text>
  <rect x="556" y="1010" width="18" height="14" fill="#ffffff" stroke="#4b5563" stroke-dasharray="4 3"/>
  <text x="582" y="1022" font-size="14">off this bench</text>
  <rect x="24" y="1036" width="36" height="22" rx="11" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="42" y="1052" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">RF</text>
  <text x="68" y="1052" font-size="14">puts out RF</text>
  <rect x="184" y="1036" width="46" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="207" y="1052" font-size="14" text-anchor="middle" fill="#4b5563">done</text>
  <text x="238" y="1052" font-size="14">done</text>
  <rect x="306" y="1036" width="42" height="22" rx="11" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="327" y="1052" font-size="14" text-anchor="middle" fill="#4b5563">part</text>
  <text x="356" y="1052" font-size="14">partly done</text>
  <rect x="468" y="1036" width="50" height="22" rx="11" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="493" y="1052" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">NOW</text>
  <text x="526" y="1052" font-size="14">the current stage</text>
  <text x="24" y="1088" font-size="14" fill="#4b5563">Robin is the SWR stop on the IC-7300 until stage 12 passes with the load.</text>
</svg>
