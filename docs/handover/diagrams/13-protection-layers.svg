<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" width="720" height="848" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Seven nested layers of protection against a stuck transmitter, from the operator outside to the planned hardware timer inside</title>
  <rect x="0" y="0" width="720" height="848" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Defense in depth against a stuck transmitter</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Outermost first. Each layer, where present, can end a carrier the outer ones missed.</text>

  <!-- 1 operator (person, grey) -->
  <rect x="24" y="84" width="672" height="670" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="38" y="108" font-weight="bold">1. Operator and procedures</text>
  <text x="682" y="108" font-size="14" fill="#4b5563" text-anchor="end">needs a person</text>
  <text x="38" y="128" font-size="14">Robin at the radio for every keyed step, a hand on the stop.</text>
  <text x="38" y="146" font-size="14">Stop: key plug out, then radio off, computer last. Audit gates every flash.</text>

  <!-- 2 host (blue) -->
  <rect x="40" y="164" width="640" height="574" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="54" y="188" font-weight="bold">2. Host software checks (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan>)</text>
  <text x="666" y="188" font-size="14" fill="#4b5563" text-anchor="end">needs <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> running</text>
  <text x="54" y="208" font-size="14">Stages, read-only preflight, 10 W cap, TOT 3 min, SWR and Po per piece</text>
  <text x="54" y="226" font-size="14">Sidetone monitor, keying watchdog 45 s, duty, inhibit latch, storm stand-down</text>

  <!-- 3 box firmware limits (green) -->
  <rect x="56" y="244" width="608" height="478" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="70" y="268" font-weight="bold">3. Box firmware limits</text>
  <text x="650" y="268" font-size="14" fill="#4b5563" text-anchor="end">works with the host dead</text>
  <text x="70" y="288" font-size="14">Key-down 1 s, run 60 s, PTT 60 s, link 2 s, rest 1 s, duty budget 60 s</text>
  <text x="70" y="306" font-size="14">Pin guard, slow pass 10 ms, clock check 50 ms: each trips the box</text>

  <!-- 4 watchdog and fault handlers (green) -->
  <rect x="72" y="324" width="576" height="382" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="86" y="348" font-weight="bold">4. Watchdog and fault handlers</text>
  <text x="634" y="348" font-size="14" fill="#4b5563" text-anchor="end">works with the loop dead</text>
  <text x="86" y="368" font-size="14">Hardware watchdog 0.5 s: a stalled loop resets the chip</text>
  <text x="86" y="386" font-size="14">Panic or fault opens key and PTT first; the box restarts tripped</text>

  <!-- 5 pull-down and switch (hardware, amber) -->
  <rect x="88" y="404" width="544" height="286" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="102" y="428" font-weight="bold">5. Pull-down and switch</text>
  <text x="618" y="428" font-size="14" fill="#4b5563" text-anchor="end">works with no firmware</text>
  <text x="102" y="448" font-size="14">4.7 kΩ from GP16 and GP17 to ground (erratum RP2350-E9)</text>
  <text x="102" y="466" font-size="14">PC817, one transistor or photoMOS: pin low or undriven = line open</text>

  <!-- 6 radio TOT (radio, amber) -->
  <rect x="104" y="484" width="512" height="190" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="118" y="508" font-weight="bold">6. The radio's time-out timer</text>
  <text x="602" y="508" font-size="14" fill="#4b5563" text-anchor="end">works with the box failed</text>
  <text x="118" y="528" font-size="14">IC-7300 TOT 3 min, required by the preflight</text>
  <text x="118" y="546" font-size="14">Covers CW keyed by CI-V 17: unproven (H11). Not the KEY jack</text>
  <text x="118" y="564" font-size="14">UV-K1 in FM: 1 min. NR7Y CW: none. None measured yet</text>

  <!-- 7 hardware timer (planned, purple dashed) -->
  <rect x="120" y="582" width="480" height="76" rx="10" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="134" y="606" font-weight="bold">7. Hardware transmit timer</text>
  <text x="586" y="606" font-size="14" fill="#4b5563" text-anchor="end">works with no software</text>
  <text x="134" y="626" font-size="14">Not built. Cuts the radio's DC after about 60 s</text>
  <text x="134" y="644" font-size="14">Required before unattended use (test plan, step 10)</text>

  <!-- legend -->
  <text x="24" y="782" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="792" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="48" y="804" font-size="14">person</text>
  <rect x="146" y="792" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="170" y="804" font-size="14">host code</text>
  <rect x="270" y="792" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="294" y="804" font-size="14">box firmware</text>
  <rect x="412" y="792" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="436" y="804" font-size="14">hardware, radio</text>
  <rect x="576" y="792" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="600" y="804" font-size="14">not built yet</text>
  <text x="24" y="832" font-size="14" fill="#4b5563">Layers 3-5 exist only with the keyer box; an IC-7300 keyed over CI-V has no box.</text>
</svg>
