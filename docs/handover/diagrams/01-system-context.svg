<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The field operator with a QRP radio and code sheet, the on-air path, the three home radio paths, the host running hfnode, and the outside services</title>
  <defs>
    <marker id="k01ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1180" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">The system in one picture</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">The field side is a person, a radio and paper; everything that decides is at home</text>

  <!-- Field row -->
  <rect x="24" y="88" width="196" height="84" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="122" y="114" text-anchor="middle" font-weight="bold">Code sheet</text>
  <text x="122" y="136" text-anchor="middle" font-size="14">printed one-time codes,</text>
  <text x="122" y="156" text-anchor="middle" font-size="14">one line per use</text>

  <rect x="262" y="88" width="196" height="84" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="360" y="114" text-anchor="middle" font-weight="bold">Field operator</text>
  <text x="360" y="136" text-anchor="middle" font-size="14">sends Morse by hand,</text>
  <text x="360" y="156" text-anchor="middle" font-size="14">copies replies by ear</text>

  <rect x="500" y="88" width="196" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="598" y="114" text-anchor="middle" font-weight="bold">QRP CW radio</text>
  <text x="598" y="136" text-anchor="middle" font-size="14">a few watts, HF,</text>
  <text x="598" y="156" text-anchor="middle" font-size="14">with a key or paddle</text>

  <path d="M220,130 L260,130" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01ctx-arrow)"/>
  <path d="M458,130 L498,130" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M598,174 L598,218" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>

  <!-- On the air -->
  <rect x="24" y="220" width="672" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="360" y="242" text-anchor="middle" font-weight="bold">On the air: Morse (CW) on one agreed frequency</text>
  <text x="360" y="262" text-anchor="middle" font-size="14" fill="#4b5563">HF; the UV-K1 tries the whole system on 2 m first</text>

  <path d="M128,274 L128,318" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M360,274 L360,318" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M592,274 L592,318" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>

  <!-- Home radios -->
  <rect x="24" y="320" width="208" height="104" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="128" y="344" text-anchor="middle" font-weight="bold">ICOM IC-7300</text>
  <text x="128" y="366" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "ic7300"</text>
  <text x="128" y="388" text-anchor="middle" font-size="14">CI-V control and audio</text>
  <text x="128" y="408" text-anchor="middle" font-size="14">on one USB cable</text>

  <rect x="256" y="320" width="208" height="104" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="344" text-anchor="middle" font-weight="bold">Any CW radio</text>
  <text x="360" y="366" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "keyer"</text>
  <text x="360" y="388" text-anchor="middle" font-size="14">set up by hand; key jack</text>
  <text x="360" y="408" text-anchor="middle" font-size="14">and headphone jack used</text>

  <rect x="488" y="320" width="208" height="104" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="592" y="344" text-anchor="middle" font-weight="bold">Quansheng UV-K1</text>
  <text x="592" y="366" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rig = "keyer"</text>
  <text x="592" y="388" text-anchor="middle" font-size="14">K-plug through the box;</text>
  <text x="592" y="408" text-anchor="middle" font-size="14">USB-C ("handheld") parked</text>

  <!-- Keyer box kit -->
  <path d="M360,426 L360,470" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <text x="376" y="453" font-size="14" fill="#4b5563">key and headphone cables</text>
  <path d="M592,426 L592,470" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <text x="608" y="453" font-size="14" fill="#4b5563">K-plug</text>
  <rect x="256" y="472" width="440" height="106" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="272" y="494" font-size="14" fill="#4b5563">keyer box kit (rig = "keyer"): each radio uses both</text>
  <rect x="272" y="506" width="196" height="58" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="370" y="530" text-anchor="middle" font-weight="bold">Keyer box</text>
  <text x="370" y="551" text-anchor="middle" font-size="14">Pico 2 on rustos</text>
  <rect x="484" y="506" width="196" height="58" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="582" y="530" text-anchor="middle" font-weight="bold">USB sound card</text>
  <text x="582" y="551" text-anchor="middle" font-size="14">radio audio in</text>

  <!-- Links to host -->
  <path d="M128,426 L128,624" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <text x="140" y="518" font-size="14" fill="#4b5563">USB cable:</text>
  <text x="140" y="536" font-size="14" fill="#4b5563">CI-V + audio</text>
  <path d="M370,580 L370,624" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <text x="386" y="607" font-size="14" fill="#4b5563">USB serial</text>
  <path d="M582,580 L582,624" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01ctx-arrow)"/>
  <text x="598" y="607" font-size="14" fill="#4b5563">USB audio</text>

  <!-- Host -->
  <rect x="24" y="626" width="672" height="120" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="654" text-anchor="middle" font-weight="bold">Host computer running hfnode</text>
  <text x="360" y="676" text-anchor="middle" font-size="14" fill="#4b5563">Raspberry Pi, Mac or Windows PC</text>
  <text x="360" y="702" text-anchor="middle" font-size="14">decodes the Morse, checks the codes, reads every request back,</text>
  <text x="360" y="722" text-anchor="middle" font-size="14">acts on OK, and keys each reply through the station safety layer</text>

  <!-- Services row A -->
  <path d="M122,748 L122,800" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M598,748 L598,800" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <rect x="24" y="802" width="196" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="122" y="826" text-anchor="middle" font-weight="bold">NWS weather</text>
  <text x="122" y="846" text-anchor="middle" font-size="14">api.weather.gov:</text>
  <text x="122" y="864" text-anchor="middle" font-size="14">forecasts, alerts,</text>
  <text x="122" y="882" text-anchor="middle" font-size="14">storm check</text>
  <rect x="500" y="802" width="196" height="90" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="598" y="826" text-anchor="middle" font-weight="bold">Reply filter</text>
  <text x="598" y="846" text-anchor="middle" font-size="14">Claude API or Ollama;</text>
  <text x="598" y="864" text-anchor="middle" font-size="14">screens every reply</text>
  <text x="598" y="882" text-anchor="middle" font-size="14">(on by default)</text>

  <!-- Trunk and bus to messaging services -->
  <path d="M360,748 L360,942" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <text x="376" y="830" font-size="14" fill="#4b5563">send messages,</text>
  <text x="376" y="848" font-size="14" fill="#4b5563">fetch replies</text>
  <path d="M122,942 L122,918 L598,918 L598,942" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>

  <!-- Services row B -->
  <rect x="24" y="944" width="196" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="122" y="968" text-anchor="middle" font-weight="bold">Email</text>
  <text x="122" y="988" text-anchor="middle" font-size="14">SMTP out, IMAP in,</text>
  <text x="122" y="1006" text-anchor="middle" font-size="14">the node's mailbox</text>
  <rect x="262" y="944" width="196" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="360" y="968" text-anchor="middle" font-weight="bold">Google Voice</text>
  <text x="360" y="988" text-anchor="middle" font-size="14">texts, carried through</text>
  <text x="360" y="1006" text-anchor="middle" font-size="14">the same mailbox</text>
  <rect x="500" y="944" width="196" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="598" y="968" text-anchor="middle" font-weight="bold">iMessage</text>
  <text x="598" y="988" text-anchor="middle" font-size="14">Messages on the Mac</text>
  <text x="598" y="1006" text-anchor="middle" font-size="14">(macOS hosts only)</text>

  <!-- Contacts -->
  <path d="M122,1018 L122,1062" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M360,1018 L360,1062" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <path d="M598,1018 L598,1062" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#k01ctx-arrow)" marker-end="url(#k01ctx-arrow)"/>
  <rect x="24" y="1064" width="672" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="360" y="1087" text-anchor="middle" font-weight="bold">Contacts, by name (MOM, ...)</text>
  <text x="360" y="1108" text-anchor="middle" font-size="14">each reached by the first route that applies: iMessage, Google Voice, email</text>

  <!-- Legend -->
  <rect x="24" y="1144" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="48" y="1157" font-size="14">Host code</text>
  <rect x="172" y="1144" width="16" height="16" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="196" y="1157" font-size="14">Firmware</text>
  <rect x="296" y="1144" width="16" height="16" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="320" y="1157" font-size="14">Hardware</text>
  <rect x="420" y="1144" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="444" y="1157" font-size="14">Outside service or person</text>
</svg>
