<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1642" width="720" height="1642" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <rect x="0" y="0" width="720" height="1642" fill="#ffffff"/>
  <title>Sequence of one route A transmission between the station, the Handheld rig, its keep-alive thread and the UV-K1 firmware: HELLO, STOP and STATUS at open; CW and OK CW at the first key-down; STATUS every 250 ms while keyed; STATUS tx 0 at the end, checked against the 0.8 rule; STOP at the deadline</title>
  <defs>
    <marker id="k10s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="24" y="36" font-size="20" font-weight="bold">Route A: one transmission, from open to the end (parked)</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Time runs down. Every line carries an id and a checksum, left out here.</text>
  <rect x="24" y="80" width="160" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="104" y="104" text-anchor="middle" font-weight="bold">Station</text>
  <text x="104" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">station.rs</text>
  <rect x="195" y="80" width="160" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="275" y="104" text-anchor="middle" font-weight="bold">Handheld rig</text>
  <text x="275" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handheld.rs</text>
  <rect x="365" y="80" width="160" height="56" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="445" y="104" text-anchor="middle" font-weight="bold">UV-K1 firmware</text>
  <text x="445" y="124" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode.c</text>
  <rect x="536" y="80" width="160" height="56" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="616" y="104" text-anchor="middle" font-weight="bold">keep-alive thread</text>
  <text x="616" y="124" text-anchor="middle" font-size="14">&quot;handheld link&quot;</text>
  <line x1="104" y1="136" x2="104" y2="172" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="200" x2="104" y2="460" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="488" x2="104" y2="744" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="772" x2="104" y2="936" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="964" x2="104" y2="1068" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="1096" x2="104" y2="1284" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="104" y1="1312" x2="104" y2="1494" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="136" x2="275" y2="172" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="200" x2="275" y2="460" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="488" x2="275" y2="744" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="772" x2="275" y2="936" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="964" x2="275" y2="1068" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="1096" x2="275" y2="1284" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="275" y1="1312" x2="275" y2="1494" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="136" x2="445" y2="172" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="200" x2="445" y2="460" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="488" x2="445" y2="744" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="772" x2="445" y2="936" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="964" x2="445" y2="1068" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="1096" x2="445" y2="1284" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="445" y1="1312" x2="445" y2="1494" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="136" x2="616" y2="172" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="200" x2="616" y2="460" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="488" x2="616" y2="744" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="772" x2="616" y2="936" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="964" x2="616" y2="1068" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="1096" x2="616" y2="1284" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="616" y1="1312" x2="616" y2="1494" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="24" y="172" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="191" font-size="14" font-weight="bold">1. Open the radio: Handheld::new</text>
  <rect x="24" y="460" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="479" font-size="14" font-weight="bold">2. Before a transmission, and each piece</text>
  <rect x="24" y="744" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="763" font-size="14" font-weight="bold">3. One piece: send_cw</text>
  <rect x="24" y="936" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="955" font-size="14" font-weight="bold">4. While it keys</text>
  <rect x="24" y="1068" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="1087" font-size="14" font-weight="bold">5. The end</text>
  <rect x="24" y="1284" width="672" height="28" rx="4" fill="#f3f4f6"/>
  <text x="34" y="1303" font-size="14" font-weight="bold">Or: still keying at the deadline</text>
  <line x1="277" y1="234" x2="443" y2="234" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="227" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HELLO</text>
  <line x1="443" y1="268" x2="277" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="261" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK HELLO …</text>
  <text x="265" y="288" text-anchor="end" font-size="14" fill="#4b5563">check_hello: version</text>
  <text x="265" y="306" text-anchor="end" font-size="14" fill="#4b5563">and both limits</text>
  <line x1="277" y1="302" x2="443" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="295" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STOP</text>
  <line x1="443" y1="336" x2="277" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="329" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STOP</text>
  <line x1="277" y1="370" x2="443" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="363" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STATUS</text>
  <line x1="443" y1="404" x2="277" y2="404" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="397" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STATUS 0 …</text>
  <text x="265" y="424" text-anchor="end" font-size="14" fill="#4b5563">tx 1 here: refuse</text>
  <text x="265" y="442" text-anchor="end" font-size="14" fill="#4b5563">to open</text>
  <line x1="277" y1="438" x2="614" y2="438" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="431" text-anchor="start" font-size="14">start: every 250 ms</text>
  <line x1="106" y1="522" x2="273" y2="522" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="114" y="515" text-anchor="start" font-size="14">set up, check</text>
  <line x1="277" y1="574" x2="443" y2="574" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="549" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MODE, FREQ,</text>
  <text x="285" y="567" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">POWER, BREAKIN</text>
  <line x1="443" y1="608" x2="277" y2="608" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="601" text-anchor="end" font-size="14">read-backs</text>
  <line x1="106" y1="642" x2="273" y2="642" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="114" y="635" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rest_needed()</text>
  <text x="265" y="662" text-anchor="end" font-size="14" fill="#4b5563">duty cycle first,</text>
  <text x="265" y="680" text-anchor="end" font-size="14" fill="#4b5563">then the busy</text>
  <text x="265" y="698" text-anchor="end" font-size="14" fill="#4b5563">channel</text>
  <line x1="277" y1="676" x2="443" y2="676" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="669" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STATUS</text>
  <line x1="443" y1="710" x2="277" y2="710" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="703" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STATUS 0 …</text>
  <line x1="106" y1="806" x2="273" y2="806" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="114" y="799" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">send_cw(piece)</text>
  <text x="265" y="826" text-anchor="end" font-size="14" fill="#4b5563">records since, end</text>
  <text x="265" y="844" text-anchor="end" font-size="14" fill="#4b5563">and the deadline</text>
  <line x1="277" y1="840" x2="443" y2="840" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="833" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CW &lt;wpm&gt; &lt;text&gt;</text>
  <text x="455" y="860" text-anchor="start" font-size="14" fill="#4b5563">STARTING: key-down</text>
  <text x="455" y="878" text-anchor="start" font-size="14" fill="#4b5563">within 300 ms, else</text>
  <text x="455" y="896" text-anchor="start" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ERR CW REFUSED</text>
  <line x1="443" y1="874" x2="277" y2="874" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="867" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK CW</text>
  <line x1="273" y1="908" x2="106" y2="908" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="265" y="901" text-anchor="end" font-size="14">returns: keying</text>
  <line x1="614" y1="1008" x2="447" y2="1008" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="606" y="1001" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STATUS</text>
  <text x="114" y="983" text-anchor="start" font-size="14" fill="#4b5563">sleeps for the</text>
  <text x="114" y="1001" text-anchor="start" font-size="14" fill="#4b5563">piece's length</text>
  <text x="435" y="983" text-anchor="end" font-size="14" fill="#4b5563">every 250 ms, so</text>
  <text x="435" y="1001" text-anchor="end" font-size="14" fill="#4b5563">the 2 s link timeout</text>
  <text x="435" y="1019" text-anchor="end" font-size="14" fill="#4b5563">never expires</text>
  <line x1="447" y1="1042" x2="614" y2="1042" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="455" y="1035" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STATUS 1 …</text>
  <line x1="106" y1="1130" x2="273" y2="1130" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="114" y="1123" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">is_transmitting()</text>
  <line x1="277" y1="1164" x2="443" y2="1164" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="285" y="1157" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STATUS</text>
  <line x1="443" y1="1198" x2="277" y2="1198" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="435" y="1191" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STATUS 0 …</text>
  <text x="285" y="1218" text-anchor="start" font-size="14" fill="#4b5563">ended before 0.8 of</text>
  <text x="285" y="1236" text-anchor="start" font-size="14" fill="#4b5563">its length: cut short,</text>
  <text x="285" y="1254" text-anchor="start" font-size="14" fill="#4b5563">a fault</text>
  <line x1="273" y1="1232" x2="106" y2="1232" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="265" y="1225" text-anchor="end" font-size="14">false: receive</text>
  <text x="114" y="1252" text-anchor="start" font-size="14" fill="#4b5563">twice in a row:</text>
  <text x="114" y="1270" text-anchor="start" font-size="14" fill="#4b5563">the piece is over</text>
  <line x1="614" y1="1356" x2="447" y2="1356" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="606" y="1349" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STOP</text>
  <text x="435" y="1331" text-anchor="end" font-size="14" fill="#4b5563">stop_overdue, under</text>
  <text x="435" y="1349" text-anchor="end" font-size="14" fill="#4b5563">the state lock</text>
  <line x1="447" y1="1390" x2="614" y2="1390" stroke="#374151" stroke-width="2" marker-end="url(#k10s-arrow)"/>
  <text x="455" y="1383" text-anchor="start" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK STOP</text>
  <text x="455" y="1412" text-anchor="start" font-size="14" fill="#4b5563">fault: sent past the</text>
  <text x="455" y="1430" text-anchor="start" font-size="14" fill="#4b5563">end. If STOP fails,</text>
  <text x="455" y="1448" text-anchor="start" font-size="14" fill="#4b5563">keep-alives stop; the</text>
  <text x="455" y="1466" text-anchor="start" font-size="14" fill="#4b5563">2 s link timeout ends it</text>
  <rect x="24" y="1506" width="672" height="78" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="36" y="1530" font-size="14"><tspan font-weight="bold">The deadline:</tspan> the piece's length, with 50 ms a character for the switch</text>
  <text x="36" y="1550" font-size="14">back to transmit, plus 2 s; or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">max_key_seconds</tspan> plus 5 s, whichever is</text>
  <text x="36" y="1570" font-size="14">sooner. The firmware's own limits (its run states, below) end a run without it.</text>
  <!-- legend -->
  <rect x="24" y="1604" width="18" height="18" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="50" y="1618" font-size="14">host code</text>
  <rect x="146" y="1604" width="18" height="18" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="172" y="1618" font-size="14">radio firmware (parked)</text>
  <rect x="352" y="1604" width="18" height="18" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="378" y="1618" font-size="14">safety limit</text>
</svg>
