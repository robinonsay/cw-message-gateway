<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" width="720" height="1200" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Every condition that opens the keyer box&#x27;s key line and PTT line, with its mechanism and value</title>
  <defs>
    <marker id="k13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1200" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">What opens the keyer box&#x27;s key line</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each condition, the mechanism, and its value. The PTT output (GP17) opens the same way.</text>
  <text x="24" y="80" font-size="14" fill="#4b5563">Main at 44185fa unless marked. Tripped means: stays open until the box is unplugged.</text>
  <rect x="24" y="104" width="496" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="125" font-weight="bold">Power-up, reset, BOOTSEL, unplugged</text>
  <text x="508" y="125" font-weight="bold" text-anchor="end">always</text>
  <text x="36" y="144" font-size="14" fill="#4b5563">Pad reset state and the 4.7 kΩ pull-downs hold GP16, GP17 low</text>
  <line x1="520" y1="130" x2="557" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="164" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="185" font-weight="bold">Firmware starts</text>
  <text x="508" y="185" font-weight="bold" text-anchor="end">first</text>
  <text x="36" y="204" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main()</tspan> drives GP16 and GP17 low before the clocks and USB</text>
  <line x1="520" y1="190" x2="557" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="224" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="245" font-weight="bold">USB enumerates</text>
  <text x="508" y="245" font-weight="bold" text-anchor="end">no run</text>
  <text x="36" y="264" font-size="14" fill="#4b5563">No run exists until a <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CW</tspan> or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MCW</tspan> line is taken</text>
  <line x1="520" y1="250" x2="557" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="284" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="305" font-weight="bold">USB goes away</text>
  <text x="508" y="305" font-weight="bold" text-anchor="end">same pass</text>
  <text x="36" y="324" font-size="14" fill="#4b5563">Bus reset, suspend or deconfigure: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">link_lost()</tspan> ends the run</text>
  <line x1="520" y1="310" x2="557" y2="310" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="344" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="365" font-weight="bold">No valid line from the host</text>
  <text x="508" y="365" font-weight="bold" text-anchor="end">2 s</text>
  <text x="36" y="384" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">LINK_TIMEOUT_MS</tspan>: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> killed or hung, computer crashed</text>
  <line x1="520" y1="370" x2="557" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="404" width="496" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="36" y="425" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> sends <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">STOP</tspan></text>
  <text x="508" y="425" font-weight="bold" text-anchor="end">at once</text>
  <text x="36" y="444" font-size="14" fill="#4b5563">Node stop, rig dropped, or a run past its end (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">RUN_SLACK</tspan>)</text>
  <line x1="520" y1="430" x2="557" y2="430" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="464" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="485" font-weight="bold">The run ends</text>
  <text x="508" y="485" font-weight="bold" text-anchor="end">≤ 60 s</text>
  <text x="36" y="504" font-size="14" fill="#4b5563">Last element sent, or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">RUN_MS</tspan> reached</text>
  <line x1="520" y1="490" x2="557" y2="490" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="524" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="545" font-weight="bold">Key or tone down too long</text>
  <text x="508" y="545" font-weight="bold" text-anchor="end">1 s</text>
  <text x="36" y="564" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">KEY_DOWN_MS</tspan>: key opened, the box trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DOWN</tspan></text>
  <line x1="520" y1="550" x2="557" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="584" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="605" font-weight="bold">PTT down too long</text>
  <text x="508" y="605" font-weight="bold" text-anchor="end">60 s</text>
  <text x="36" y="624" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PTT_MS</tspan>: PTT opened, the box trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PTT</tspan></text>
  <line x1="520" y1="610" x2="557" y2="610" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="644" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="665" font-weight="bold">Pin on, by the loop&#x27;s own clock</text>
  <text x="508" y="665" font-weight="bold" text-anchor="end">1 s / 60 s</text>
  <text x="36" y="684" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinGuard</tspan> at the box&#x27;s own limits: the box trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PIN</tspan></text>
  <line x1="520" y1="670" x2="557" y2="670" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="704" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="725" font-weight="bold">A late pass with the key on</text>
  <text x="508" y="725" font-weight="bold" text-anchor="end">&gt; 10 ms</text>
  <text x="36" y="744" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SLOW_PASS_MS</tspan>: the box trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SLOW</tspan></text>
  <line x1="520" y1="730" x2="557" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="764" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="785" font-weight="bold">Clock stops or slows</text>
  <text x="508" y="785" font-weight="bold" text-anchor="end">50 ms</text>
  <text x="36" y="804" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ClockCheck</tspan> vs SysTick: trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CLOCK</tspan>, watchdog not fed</text>
  <line x1="520" y1="790" x2="557" y2="790" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="824" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="845" font-weight="bold">PTT line disagrees with the PTT</text>
  <text x="508" y="845" font-weight="bold" text-anchor="end">100 ms</text>
  <text x="36" y="864" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mcw::LINE_MS</tspan>: the run stops, or trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">LINE</tspan> if held low</text>
  <line x1="520" y1="850" x2="557" y2="850" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="884" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="905" font-weight="bold">Control loop stalls</text>
  <text x="508" y="905" font-weight="bold" text-anchor="end">0.5 s</text>
  <text x="36" y="924" font-size="14" fill="#4b5563">Hardware watchdog resets the chip; the box restarts tripped</text>
  <line x1="520" y1="910" x2="557" y2="910" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="944" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="965" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">TEST HANG</tspan>, and no reset yet</text>
  <text x="508" y="965" font-weight="bold" text-anchor="end">1 s</text>
  <text x="36" y="984" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HANG_OPEN_MS</tspan>: the hung loop opens every output itself</text>
  <line x1="520" y1="970" x2="557" y2="970" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="1004" width="496" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="36" y="1025" font-weight="bold">Panic, HardFault, any exception</text>
  <text x="508" y="1025" font-weight="bold" text-anchor="end">first store</text>
  <text x="36" y="1044" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">safe_state()</tspan>: one write to SIO <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GPIO_OUT_CLR</tspan></text>
  <line x1="520" y1="1030" x2="557" y2="1030" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="24" y="1064" width="496" height="52" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="1085" font-weight="bold">Core 1 decoder stops or faults (PR #31)</text>
  <text x="508" y="1085" font-weight="bold" text-anchor="end">100 ms</text>
  <text x="36" y="1104" font-size="14" fill="#4b5563">No heartbeat for <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CORE1_MS</tspan>, or fault flag at once: trips <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CORE1</tspan></text>
  <line x1="520" y1="1090" x2="557" y2="1090" stroke="#374151" stroke-width="2" marker-end="url(#k13-arrow)"/>
  <rect x="560" y="104" width="136" height="1012" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="628" y="500" font-size="16" font-weight="bold" text-anchor="middle">Key and PTT</text>
  <text x="628" y="522" font-size="16" font-weight="bold" text-anchor="middle">open</text>
  <text x="628" y="566" font-size="14" text-anchor="middle">GP16, GP17 low,</text>
  <text x="628" y="588" font-size="14" text-anchor="middle">so the switch</text>
  <text x="628" y="610" font-size="14" text-anchor="middle">is off and the</text>
  <text x="628" y="632" font-size="14" text-anchor="middle">radio&#x27;s line</text>
  <text x="628" y="654" font-size="14" text-anchor="middle">is open</text>
  <text x="24" y="1160" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1170" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="48" y="1182" font-size="14">hardware</text>
  <rect x="124" y="1170" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="148" y="1182" font-size="14">box firmware</text>
  <rect x="252" y="1170" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="276" y="1182" font-size="14">host code</text>
  <rect x="362" y="1170" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="386" y="1182" font-size="14">safety outcome</text>
  <rect x="508" y="1170" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="532" y="1182" font-size="14">PR #31, not on main</text>
</svg>
