<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>A sequence diagram of one TX transaction between the field operator, hfnode, the mail or text service and the contact</title>
  <defs>
    <marker id="k01seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1000" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">One TX transaction, open to SENT</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Field call W5XXX, node call N0CALL, codes from the operating guide; time runs downward</text>

  <!-- Participants -->
  <rect x="12" y="84" width="120" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="72" y="106" text-anchor="middle" font-weight="bold">Field</text>
  <text x="72" y="126" text-anchor="middle" font-weight="bold">operator</text>
  <rect x="270" y="84" width="120" height="52" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="330" y="106" text-anchor="middle" font-weight="bold">hfnode</text>
  <text x="330" y="126" text-anchor="middle" font-size="14" fill="#4b5563">at home</text>
  <rect x="456" y="84" width="136" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="524" y="106" text-anchor="middle" font-weight="bold">Mail or text</text>
  <text x="524" y="126" text-anchor="middle" font-weight="bold">service</text>
  <rect x="616" y="84" width="92" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="662" y="106" text-anchor="middle" font-weight="bold">Contact</text>
  <text x="662" y="126" text-anchor="middle" font-size="14" fill="#4b5563">MOM</text>

  <!-- Lifelines (broken where a note sits on them) -->
  <path d="M72,136 L72,400 M72,430 L72,796" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M330,136 L330,232 M330,324 L330,488 M330,538 L330,696 M330,742 L330,796" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M524,136 L524,796" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M662,136 L662,796" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1. Open -->
  <text x="201" y="170" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">W5XXX 42 KRTPQMLD</text>
  <text x="201" y="188" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">TX MOM RUNNING LATE</text>
  <text x="201" y="206" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HOME SUN K</text>
  <path d="M74,218 L328,218" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <rect x="170" y="232" width="320" height="30" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="330" y="252" text-anchor="middle" font-size="14">3 s of quiet ends the message; parse</text>

  <rect x="170" y="274" width="320" height="50" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="330" y="294" text-anchor="middle" font-size="14">42 &gt; last_seq and code(42) matches</text>
  <text x="330" y="314" text-anchor="middle" font-size="14">save last_seq = 42, then key the read-back</text>

  <!-- 2. Read-back -->
  <text x="201" y="356" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">R 42 TX MOM RUNNING LATE</text>
  <text x="201" y="374" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HOME SUN ? DE N0CALL K</text>
  <path d="M328,386 L74,386" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <rect x="12" y="400" width="232" height="30" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="128" y="420" text-anchor="middle" font-size="14">operator checks every word</text>

  <!-- 3. Commit -->
  <text x="201" y="462" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OK 43 WBNFHJGC K</text>
  <path d="M74,474 L328,474" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <rect x="170" y="488" width="320" height="50" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="330" y="508" text-anchor="middle" font-size="14">43 &gt; 42 and code(43) matches</text>
  <text x="330" y="528" text-anchor="middle" font-size="14">save last_seq = 43 before acting</text>

  <!-- 4. Act -->
  <text x="427" y="570" text-anchor="middle" font-size="14">send to MOM</text>
  <text x="427" y="588" text-anchor="middle" font-size="14">by the first route</text>
  <path d="M332,600 L522,600" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <text x="427" y="632" text-anchor="middle" font-size="14">accepted</text>
  <path d="M522,644 L332,644" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#k01seq-arrow)"/>

  <text x="593" y="676" text-anchor="middle" font-size="14">text or email</text>
  <path d="M526,688 L660,688" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <rect x="170" y="696" width="320" height="46" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="330" y="715" text-anchor="middle" font-size="14">station layer: checks, then keys</text>
  <text x="330" y="734" text-anchor="middle" font-size="14">(every reply, the read-back too)</text>

  <!-- 5. Result -->
  <text x="201" y="770" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SENT 43 DE N0CALL K</text>
  <path d="M328,782 L74,782" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k01seq-arrow)"/>

  <!-- Footnote -->
  <rect x="24" y="820" width="672" height="104" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="40" y="844" font-size="14" font-weight="bold">If a transmission is lost</text>
  <text x="40" y="866" font-size="14">Send exactly the same line again; it costs no new code. A repeated open gets</text>
  <text x="40" y="886" font-size="14">the same read-back; a repeated OK gets SENT 43 again without sending twice,</text>
  <text x="40" y="906" font-size="14">at most 3 times in 10 minutes (by default). NO and AGN each use a fresh line.</text>

  <!-- Legend -->
  <rect x="24" y="952" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="48" y="965" font-size="14">Host code</text>
  <rect x="172" y="952" width="16" height="16" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="196" y="965" font-size="14">Safety gate</text>
  <rect x="306" y="952" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="330" y="965" font-size="14">Outside service or person</text>
  <path d="M532,960 L572,960" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#k01seq-arrow)"/>
  <text x="582" y="965" font-size="14">return</text>
</svg>
