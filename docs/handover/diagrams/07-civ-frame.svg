<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1392" width="720" height="1392" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The CI-V frame layout, the OK and NG replies, a frequency read with the echoed copy skipped and its BCD reply decoded, and the transmit-control write with its OK</title>
  <defs>
    <marker id="k07f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1392" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" fill="#111827" font-weight="bold">CI-V frames on the USB serial link</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Bytes in hex. The computer (controller) is E0h, the IC-7300 is 94h.</text>
  <text x="24" y="100" font-size="16" fill="#111827" font-weight="bold">1. Every frame</text>
  <rect x="28" y="116" width="56" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="56.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="84" y="116" width="56" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="112.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="140" y="116" width="84" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="182.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">94</text>
  <rect x="224" y="116" width="84" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="266.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">E0</text>
  <rect x="308" y="116" width="84" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="350.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Cn</text>
  <rect x="392" y="116" width="84" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="434.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Sc</text>
  <rect x="476" y="116" width="160" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="556.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">data</text>
  <rect x="636" y="116" width="56" height="44" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="664.0" y="144.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FD</text>
  <text x="84" y="184" font-size="14" fill="#4b5563" text-anchor="middle">preamble</text>
  <text x="182" y="184" font-size="14" fill="#4b5563" text-anchor="middle">to:</text>
  <text x="182" y="202" font-size="14" fill="#4b5563" text-anchor="middle">radio 94h</text>
  <text x="266" y="184" font-size="14" fill="#4b5563" text-anchor="middle">from:</text>
  <text x="266" y="202" font-size="14" fill="#4b5563" text-anchor="middle">PC E0h</text>
  <text x="350" y="184" font-size="14" fill="#4b5563" text-anchor="middle">command</text>
  <text x="434" y="184" font-size="14" fill="#4b5563" text-anchor="middle">sub-cmd,</text>
  <text x="434" y="202" font-size="14" fill="#4b5563" text-anchor="middle">if any</text>
  <text x="556" y="184" font-size="14" fill="#4b5563" text-anchor="middle">data, if any:</text>
  <text x="556" y="202" font-size="14" fill="#4b5563" text-anchor="middle">BCD or ASCII</text>
  <text x="664" y="184" font-size="14" fill="#4b5563" text-anchor="middle">end</text>
  <text x="24" y="240" font-size="14" fill="#111827" xml:space="preserve"><tspan font-weight="bold">No checksum. </tspan>FE and FD never occur inside a frame: BCD stops at 99 and text is ASCII.</text>
  <text x="24" y="280" font-size="16" fill="#111827" font-weight="bold">2. The radio's answer to a command that sets something</text>
  <rect x="28" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="54.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="80" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="106.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="132" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="158.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">E0</text>
  <rect x="184" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="210.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">94</text>
  <rect x="236" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="262.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FB</text>
  <rect x="288" y="296" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="314.0" y="324.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FD</text>
  <text x="364" y="315" font-size="16" fill="#111827" font-weight="bold">OK: the radio accepted it</text>
  <text x="364" y="334" font-size="14" fill="#4b5563">set() returns Ok; settings are read back later</text>
  <rect x="28" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="54.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="80" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="106.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="132" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="158.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">E0</text>
  <rect x="184" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="210.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">94</text>
  <rect x="236" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="262.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FA</text>
  <rect x="288" y="356" width="52" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="314.0" y="384.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FD</text>
  <text x="364" y="375" font-size="16" fill="#111827" font-weight="bold">NG: refused</text>
  <text x="364" y="394" font-size="14" fill="#4b5563">the driver returns RigError::Rejected</text>
  <text x="24" y="440" font-size="16" fill="#111827" font-weight="bold">3. A read, then a write, with USB Echo Back ON</text>
  <rect x="24" y="456" width="180" height="44" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="114" y="484" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">hfnode (E0h)</text>
  <rect x="516" y="456" width="180" height="44" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="606" y="484" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">IC-7300 (94h)</text>
  <line x1="114" y1="500" x2="114" y2="916" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="606" y1="500" x2="606" y2="916" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="114" y1="552" x2="604" y2="552" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="543" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE 94 E0 03 FD</text>
  <text x="360.0" y="573" font-size="14" fill="#4b5563" text-anchor="middle">read the frequency: command 03, no data</text>
  <line x1="606" y1="618" x2="116" y2="618" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="609" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE 94 E0 03 FD</text>
  <text x="360.0" y="639" font-size="14" fill="#4b5563" text-anchor="middle">the echo: addressed to 94h, so skipped</text>
  <line x1="606" y1="684" x2="116" y2="684" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="675" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE E0 94 03 00 00 20 14 00 FD</text>
  <text x="360.0" y="705" font-size="14" fill="#4b5563" text-anchor="middle">the reply: 94h to E0h, starts with 03: accepted</text>
  <line x1="114" y1="750" x2="604" y2="750" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="741" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE 94 E0 1C 00 00 FD</text>
  <text x="360.0" y="771" font-size="14" fill="#4b5563" text-anchor="middle">set receive: 1C 00 00 (1C 00 01 is never sent)</text>
  <line x1="606" y1="816" x2="116" y2="816" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="807" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE 94 E0 1C 00 00 FD</text>
  <text x="360.0" y="837" font-size="14" fill="#4b5563" text-anchor="middle">the echo, skipped</text>
  <line x1="606" y1="882" x2="116" y2="882" stroke="#374151" stroke-width="2" marker-end="url(#k07f-arrow)"/>
  <text x="360.0" y="873" font-size="14" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE FE E0 94 FB FD</text>
  <text x="360.0" y="903" font-size="14" fill="#4b5563" text-anchor="middle">OK</text>
  <text x="24" y="972" font-size="16" fill="#111827" font-weight="bold">4. The frequency in the reply, BCD, lowest digits first</text>
  <rect x="40" y="988" width="128" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="104.0" y="1016" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <rect x="168" y="988" width="128" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="232.0" y="1016" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <rect x="296" y="988" width="128" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360.0" y="1016" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">20</text>
  <rect x="424" y="988" width="128" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="488.0" y="1016" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">14</text>
  <rect x="552" y="988" width="128" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="616.0" y="1016" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <text x="104.0" y="1054" font-size="14" fill="#4b5563" text-anchor="middle">10 Hz</text>
  <text x="104.0" y="1072" font-size="14" fill="#4b5563" text-anchor="middle">1 Hz</text>
  <text x="232.0" y="1054" font-size="14" fill="#4b5563" text-anchor="middle">1 kHz</text>
  <text x="232.0" y="1072" font-size="14" fill="#4b5563" text-anchor="middle">100 Hz</text>
  <text x="360.0" y="1054" font-size="14" fill="#4b5563" text-anchor="middle">100 kHz</text>
  <text x="360.0" y="1072" font-size="14" fill="#4b5563" text-anchor="middle">10 kHz</text>
  <text x="488.0" y="1054" font-size="14" fill="#4b5563" text-anchor="middle">10 MHz</text>
  <text x="488.0" y="1072" font-size="14" fill="#4b5563" text-anchor="middle">1 MHz</text>
  <text x="616.0" y="1054" font-size="14" fill="#4b5563" text-anchor="middle">1000 MHz</text>
  <text x="616.0" y="1072" font-size="14" fill="#4b5563" text-anchor="middle">100 MHz</text>
  <text x="616.0" y="1090" font-size="14" fill="#4b5563" text-anchor="middle">(fixed 0)</text>
  <text x="24" y="1122" font-size="16" fill="#111827" xml:space="preserve">Last byte first: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00 14 20 00 00</tspan> = 14 200 000 Hz = 14.200000 MHz</text>
  <text x="24" y="1148" font-size="16" fill="#111827" xml:space="preserve">A level is two bytes, highest first: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00 26</tspan> = 26 (10 W on the RF power scale)</text>
  <text x="24" y="1168" font-size="14" fill="#4b5563">power_level(): linear watts-to-level mapping is assumed, not yet checked on a radio</text>
  <text x="24" y="1198" font-size="16" fill="#111827" font-weight="bold">5. A frame that lost its end</text>
  <rect x="28" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="51.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="74" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="97.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="120" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="143.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">E0</text>
  <rect x="166" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="189.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">94</text>
  <rect x="212" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="235.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1C</text>
  <rect x="258" y="1214" width="46" height="44" rx="0" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="281.0" y="1242.0" font-size="16" fill="#4b5563" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <rect x="304" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="327.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="350" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="373.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FE</text>
  <rect x="396" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="419.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">E0</text>
  <rect x="442" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="465.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">94</text>
  <rect x="488" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="511.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1C</text>
  <rect x="534" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="557.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <rect x="580" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="603.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">00</text>
  <rect x="626" y="1214" width="46" height="44" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="649.0" y="1242.0" font-size="16" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">FD</text>
  <text x="166" y="1282" font-size="14" fill="#4b5563" text-anchor="middle">no FD before the next FE:</text>
  <text x="166" y="1300" font-size="14" fill="#4b5563" text-anchor="middle">discarded</text>
  <text x="488" y="1282" font-size="14" fill="#4b5563" text-anchor="middle">parsed whole: 1C 00 00,</text>
  <text x="488" y="1300" font-size="14" fill="#4b5563" text-anchor="middle">the radio is on receive</text>
  <text x="24" y="1346" font-size="14" fill="#111827" font-weight="bold">Legend</text>
  <rect x="84" y="1333" width="18" height="14" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="110" y="1346" font-size="14" fill="#111827">sent by the computer</text>
  <rect x="300.0" y="1333" width="18" height="14" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="326.0" y="1346" font-size="14" fill="#111827">sent by the radio</text>
  <rect x="490.79999999999995" y="1333" width="18" height="14" rx="0" fill="#ffffff" stroke="#374151" stroke-width="1"/>
  <text x="516.8" y="1346" font-size="14" fill="#111827">discarded by the parser</text>
</svg>
