<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The word OK keyed on a time axis in units: O is three dahs and K is dah dit dah. Elements are 1 unit apart, the letters 3 units, and the next word starts after 7 units. Below: one unit is 1200 divided by the words per minute, with values at 5, 15, 20 and 35 WPM, and the thresholds the decoder uses</title>
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Morse timing: the word OK, then a word gap</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">1 unit = 1 dit. Amber: key down (tone heard). Blank: key up (silence).</text>
  <text x="150.0" y="102" text-anchor="middle" font-size="20" font-weight="bold">O</text>
  <text x="410.0" y="102" text-anchor="middle" font-size="20" font-weight="bold">K</text>
  <text x="150.0" y="124" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">"---"</text>
  <text x="410.0" y="124" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">"-.-"</text>
  <text x="640" y="124" text-anchor="middle" font-size="14" fill="#4b5563">next word</text>
