  <text x="350.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">3</text>
  <path d="M383,212 V218 H397 V212" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="390.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">1</text>
  <path d="M403,212 V218 H417 V212" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="410.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">1</text>
  <path d="M423,212 V218 H437 V212" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="430.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">1</text>
  <path d="M443,212 V218 H497 V212" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="470.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">3</text>
  <path d="M503,212 V218 H637 V212" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="570.0" y="236" text-anchor="middle" font-size="14" font-weight="bold">7</text>
  <text x="70.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dah</text>
  <text x="150.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dah</text>
  <text x="230.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dah</text>
  <text x="350.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dah</text>
  <text x="410.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dit</text>
  <text x="470.0" y="256" text-anchor="middle" font-size="13" fill="#4b5563">dah</text>
  <line x1="110.0" y1="242" x2="110.0" y2="276" stroke="#374151" stroke-width="1.5"/>
  <text x="24" y="294" text-anchor="start" font-size="14">1 unit inside a letter</text>
  <line x1="290.0" y1="242" x2="290.0" y2="276" stroke="#374151" stroke-width="1.5"/>
  <text x="290.0" y="294" text-anchor="middle" font-size="14">3 units between letters</text>
  <line x1="570.0" y1="242" x2="570.0" y2="276" stroke="#374151" stroke-width="1.5"/>
  <text x="570.0" y="294" text-anchor="middle" font-size="14">7 units between words</text>
  <line x1="24" y1="318" x2="696" y2="318" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="350" font-weight="bold">From words per minute (WPM) to the unit</text>
  <text x="24" y="378">PARIS, the standard word, is 50 units long with its word gap.</text>
  <text x="24" y="402">At W WPM that is 50 x W units a minute (60 000 ms), so:</text>
  <rect x="24" y="418" width="672" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="360" y="447" text-anchor="middle" font-size="18" font-weight="bold">1 unit = 1200 / W milliseconds</text>
  <text x="24" y="496" font-weight="bold">WPM</text>
  <text x="280" y="496" text-anchor="middle" font-weight="bold">5</text>
  <text x="400" y="496" text-anchor="middle" font-weight="bold">15</text>
  <text x="520" y="496" text-anchor="middle" font-weight="bold">20</text>
  <text x="640" y="496" text-anchor="middle" font-weight="bold">35</text>
  <text x="24" y="524" font-weight="normal">1 unit</text>
  <text x="280" y="524" text-anchor="middle" font-weight="normal">240 ms</text>
  <text x="400" y="524" text-anchor="middle" font-weight="normal">80 ms</text>
  <text x="520" y="524" text-anchor="middle" font-weight="normal">60 ms</text>
  <text x="640" y="524" text-anchor="middle" font-weight="normal">34.3 ms</text>
  <line x1="24" y1="505" x2="696" y2="505" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="556" font-size="14" fill="#4b5563">The decoder works between 5 and 35 WPM and starts out assuming 15.</text>
  <line x1="24" y1="576" x2="696" y2="576" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="606" font-weight="bold">How the decoder splits what it hears (decoder.rs)</text>
  <text x="24" y="632">Key down under 2 units is a dit; 2 units or more is a dah.</text>
  <text x="24" y="656">Key up for 2 units or more ends the letter.</text>
  <text x="24" y="680">Key up for 5 units ends the word (up to 6.5 if the sender stretches letter gaps).</text>
</svg>
