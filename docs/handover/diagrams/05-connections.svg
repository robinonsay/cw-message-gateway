<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Block diagram of what the node loop and the station connect to: the audio capture, the CW decoder, the session and the gateways above; the storm thread, the alert thread, the radio drivers and the state directory below; the NWS, the SMTP server and the radios beyond them; each arrow labelled with its interface</title>
  <defs>
    <marker id="k05conn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="900" fill="#ffffff"/>
  <text x="24" y="36" text-anchor="start" font-size="20" fill="#111827" font-weight="bold">How the node loop and the station connect</text>
  <text x="24" y="60" text-anchor="start" font-size="14" fill="#4b5563">Arrows show which way calls and data go; two heads mean both ways</text>
  <rect x="24" y="90" width="156" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="102" y="117.7" text-anchor="middle" font-size="16" fill="#111827">Audio capture</text>
  <text x="102" y="135.9" text-anchor="middle" font-size="14" fill="#111827">audio.rs (page 04)</text>
  <rect x="196" y="90" width="156" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="274" y="117.7" text-anchor="middle" font-size="16" fill="#111827">CW decoder</text>
  <text x="274" y="135.9" text-anchor="middle" font-size="14" fill="#111827">cw crate (page 04)</text>
  <rect x="368" y="90" width="156" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="446" y="117.7" text-anchor="middle" font-size="16" fill="#111827">Session</text>
  <text x="446" y="135.9" text-anchor="middle" font-size="14" fill="#111827">session.rs (page 03)</text>
  <rect x="540" y="90" width="156" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="618" y="117.7" text-anchor="middle" font-size="16" fill="#111827">Gateways</text>
  <text x="618" y="135.9" text-anchor="middle" font-size="14" fill="#111827">mail, texts (page 06)</text>
  <rect x="24" y="232" width="672" height="62" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="259.7" text-anchor="middle" font-size="16" fill="#111827">Node loop: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">node::run</tspan> (node.rs, the main thread)</text>
  <text x="360" y="277.9" text-anchor="middle" font-size="14" fill="#111827">windows, end of message, when to tune, late replies, marking read</text>
  <path d="M48,152 L48,230" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="58" y="187.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Block</tspan> from</text>
  <text x="58" y="206.1" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">recv_timeout</tspan></text>
  <path d="M220,154 L220,230" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="230" y="187.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">push</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">flush</tspan>;</text>
  <text x="230" y="206.1" text-anchor="start" font-size="14" fill="#4b5563">text out</text>
  <path d="M392,154 L392,230" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="402" y="187.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handle(text)</tspan></text>
  <text x="402" y="206.1" text-anchor="start" font-size="14" fill="#4b5563">-&gt; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Outcome</tspan></text>
  <path d="M564,232 L564,154" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="574" y="187.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mark_read</tspan></text>
  <text x="574" y="206.1" text-anchor="start" font-size="14" fill="#4b5563">if it went out</text>
  <rect x="24" y="360" width="672" height="84" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="360" y="389.6" text-anchor="middle" font-size="16" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Station&lt;R: Rig&gt;</tspan> (station.rs): the only path <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">run</tspan> keys through</text>
  <text x="360" y="407.8" text-anchor="middle" font-size="14" fill="#111827">set-up and read-back, tune, pieces, SWR and Po watch, duty budget, IDs;</text>
  <text x="360" y="426" text-anchor="middle" font-size="14" fill="#111827">the watchdog thread (every 250 ms) and the inhibit latch</text>
  <path d="M48,294 L48,358" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="58" y="332" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">open_window</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start_window</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">transmit</tspan> -&gt; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Result&lt;(), TxError&gt;</tspan></text>
  <rect x="24" y="524" width="156" height="116" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="102" y="560.5" text-anchor="middle" font-size="16" fill="#111827">Storm thread</text>
  <text x="102" y="578.7" text-anchor="middle" font-size="14" fill="#111827">storm.rs</text>
  <text x="102" y="596.9" text-anchor="middle" font-size="14" fill="#111827">a check every</text>
  <text x="102" y="615.1" text-anchor="middle" font-size="14" fill="#111827">5 min (default)</text>
  <rect x="196" y="524" width="156" height="116" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="274" y="560.5" text-anchor="middle" font-size="16" fill="#111827">Alert thread</text>
  <text x="274" y="578.7" text-anchor="middle" font-size="14" fill="#111827">alert.rs</text>
  <text x="274" y="596.9" text-anchor="middle" font-size="14" fill="#111827">tries again after</text>
  <text x="274" y="615.1" text-anchor="middle" font-size="14" fill="#111827">1, 5 and 15 min</text>
  <rect x="368" y="524" width="156" height="116" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="446" y="560.5" text-anchor="middle" font-size="16" fill="#111827">Radio drivers</text>
  <text x="446" y="578.7" text-anchor="middle" font-size="14" fill="#111827">the <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">civ::Rig</tspan> trait</text>
  <text x="446" y="596.9" text-anchor="middle" font-size="14" fill="#111827">IC-7300: page 07</text>
  <text x="446" y="615.1" text-anchor="middle" font-size="14" fill="#111827">others: 09, 10</text>
  <rect x="540" y="524" width="156" height="116" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="618" y="551.4" text-anchor="middle" font-size="16" fill="#111827">State directory</text>
  <text x="618" y="569.6" text-anchor="middle" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">tx-inhibited</tspan>,</text>
  <text x="618" y="587.8" text-anchor="middle" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">key-down</tspan>,</text>
  <text x="618" y="606" text-anchor="middle" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">health.csv</tspan>,</text>
  <text x="618" y="624.2" text-anchor="middle" font-size="14" fill="#111827">the loop's <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rx.log</tspan></text>
  <path d="M48,524 L48,446" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="58" y="479.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">StormHold</tspan></text>
  <text x="58" y="498.1" text-anchor="start" font-size="14" fill="#4b5563">on or clear</text>
  <path d="M220,444 L220,522" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="230" y="479.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">InhibitNotice</tspan></text>
  <text x="230" y="498.1" text-anchor="start" font-size="14" fill="#4b5563">on a channel</text>
  <path d="M392,446 L392,522" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="402" y="479.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rig</tspan> method</text>
  <text x="402" y="498.1" text-anchor="start" font-size="14" fill="#4b5563">calls</text>
  <path d="M564,446 L564,522" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="574" y="479.9" text-anchor="start" font-size="14" fill="#4b5563">written; the first</text>
  <text x="574" y="498.1" text-anchor="start" font-size="14" fill="#4b5563">two read at start</text>
  <rect x="24" y="720" width="156" height="98" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="102" y="765.7" text-anchor="middle" font-size="16" fill="#111827">NWS</text>
  <text x="102" y="783.9" text-anchor="middle" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api.weather.gov</tspan></text>
  <rect x="196" y="720" width="156" height="98" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="274" y="765.7" text-anchor="middle" font-size="16" fill="#111827">SMTP server</text>
  <text x="274" y="783.9" text-anchor="middle" font-size="14" fill="#111827">to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">alert_to</tspan></text>
  <rect x="368" y="720" width="156" height="98" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="446" y="747.5" text-anchor="middle" font-size="16" fill="#111827">The radio</text>
  <text x="446" y="765.7" text-anchor="middle" font-size="14" fill="#111827">IC-7300 (CI-V, USB)</text>
  <text x="446" y="783.9" text-anchor="middle" font-size="14" fill="#111827">keyer box (page 09)</text>
  <text x="446" y="802.1" text-anchor="middle" font-size="14" fill="#111827">handheld (page 10)</text>
  <path d="M48,642 L48,718" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="58" y="675.9" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GET /points</tspan>,</text>
  <text x="58" y="694.1" text-anchor="start" font-size="14" fill="#4b5563">forecast, alerts</text>
  <path d="M220,640 L220,718" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)"/>
  <text x="230" y="675.9" text-anchor="start" font-size="14" fill="#4b5563">one email</text>
  <text x="230" y="694.1" text-anchor="start" font-size="14" fill="#4b5563">per notice</text>
  <path d="M392,642 L392,718" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#k05conn-arrow)" marker-start="url(#k05conn-arrow)"/>
  <text x="402" y="675.9" text-anchor="start" font-size="14" fill="#4b5563">serial port</text>
  <text x="402" y="694.1" text-anchor="start" font-size="14" fill="#4b5563"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">station.serial_port</tspan></text>
  <rect x="540" y="720" width="156" height="98" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="552" y="746.7" text-anchor="start" font-size="14" fill="#111827">Settings for every</text>
  <text x="552" y="764.9" text-anchor="start" font-size="14" fill="#111827">box come from</text>
  <text x="552" y="783.1" text-anchor="start" font-size="14" fill="#111827"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode.toml</tspan></text>
  <text x="552" y="801.3" text-anchor="start" font-size="14" fill="#111827">(page 15)</text>
  <text x="24" y="854" text-anchor="start" font-size="14" fill="#111827" font-weight="bold">Legend</text>
  <rect x="24" y="866" width="18" height="14" rx="0" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="50" y="878" text-anchor="start" font-size="14" fill="#111827">host code, files</text>
  <rect x="190" y="866" width="18" height="14" rx="0" fill="#fee2e2" stroke="#991b1b" stroke-width="1"/>
  <text x="216" y="878" text-anchor="start" font-size="14" fill="#111827">safety layer</text>
  <rect x="340" y="866" width="18" height="14" rx="0" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="366" y="878" text-anchor="start" font-size="14" fill="#111827">radio</text>
  <rect x="460" y="866" width="18" height="14" rx="0" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
  <text x="486" y="878" text-anchor="start" font-size="14" fill="#111827">external service</text>
</svg>
