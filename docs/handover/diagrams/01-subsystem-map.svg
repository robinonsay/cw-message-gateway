<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1236" width="720" height="1236" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Every subsystem as a box, grouped by host code, firmware, hardware and process, each labelled with the handover page that documents it</title>
  <rect x="0" y="0" width="720" height="1236" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Subsystem map: where to read next</text>
