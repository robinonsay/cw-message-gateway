# Example configuration for hfnode. Copy to /etc/hfnode/hfnode.toml on a Pi or Linux
# machine (docs/raspberry-pi-setup.md), to ~/Library/Application Support/hfnode/ on a
# Mac (docs/macos-setup.md) or to %LOCALAPPDATA%\hfnode\ on Windows
# (docs/windows-setup.md), and edit.
# Secrets (email password, API key) come from environment variables, never this file.
#
# Paths may start with ~ (your home folder). On Windows write paths in single quotes,
# which TOML takes literally: '~\AppData\Local\hfnode\state'. In double quotes a
# backslash starts an escape.

state_dir = "/var/lib/hfnode"     # Mac: "~/Library/Application Support/hfnode/state"
pending_timeout_secs = 600

[station]
# rig = "handheld"               # a Quansheng running the CW firmware instead of the
#                                  # IC-7300: see [handheld] at the end, docs/handheld.md
node_call = "N0CALL"              # your callsign; sent as DE N0CALL on every transmission
field_calls = ["N0CALL/P"]        # callsigns allowed to open transactions
frequency_hz = 7_030_000          # the agreed listening frequency
serial_port = "/dev/ttyUSB0"      # the IC-7300's USB (CP210x) serial port; `hfnode devices`
                                  # lists them. Mac: "/dev/cu.usbserial-..." (cu, not tty).
                                  # Windows: "COM3" (the number Device Manager shows).
baud = 115200                     # must match the radio's CI-V USB baud rate setting
civ_address = 0x94                # IC-7300 default CI-V address
# Last bring-up stage passed on this radio (docs/hardware-test-plan.md, "Bring-up
# stages"): none, link, setup, tune, keying or done. Commands that need a later stage are refused, and power stays
# at 10 W or less until "keying". `hfnode run` needs "done".
commissioned = "none"
power_watts = 40                  # 30-50 W per the design
key_speed_wpm = 18
max_key_seconds = 45              # software watchdog; keep below the hardware PTT timer
swr_limit = 2.0
chunk_chars = 60
chunk_pause_ms = 2000

[audio]
# The IC-7300's USB audio codec; `hfnode devices` lists the inputs. Left out, it is
# "plughw:CARD=CODEC,DEV=0" on Linux and "USB Audio CODEC" (part of the input's name)
# on Mac and Windows, which find the radio's codec on each. Set it only if yours is
# named differently or there are two.
# device = "plughw:CARD=CODEC,DEV=0"
sample_rate = 8000
pitch_hz = 600                    # the radio's CW pitch setting
end_of_message_ms = 3000
bandwidth_hz = 150

[auth]
key_file = "/etc/hfnode/node.key" # create with: hfnode keygen --out /etc/hfnode/node.key
                                  # Mac: "~/Library/Application Support/hfnode/node.key"
# The letters codes are made of, in this order: at least 16 different uppercase
# letters, all 26 when left out. Changing it, even only the order, changes every
# code: print a new table and destroy the old one.
# alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"

[schedule]
# While it runs the node owns the radio: stop it before using the radio yourself.
always = true                     # listen all the time
check_minutes = 10                # while idle, set the radio up again this often (no transmit)
retune_minutes = 60               # tune before a reply if the last tune is older than this
# To listen only in windows instead, set always = false; then, for example, the
# first ten minutes of every hour (UTC):
every_minutes = 60
offset_minutes = 0
window_minutes = 10
# Past a window's end the node listens on while a transaction begun in it is
# pending, and for up to 10 minutes after its result (for a repeated OK or AGN).
# Meanwhile it answers anything it would in a window, a new open included, which
# keeps it listening (and keying) longer.

[email]
smtp_host = "smtp.example.com"
smtp_port = 465                   # implicit TLS
imap_host = "imap.example.com"
imap_port = 993
username = "hfnode@example.com"
password_env = "HFNODE_EMAIL_PASSWORD"
from_address = "hfnode@example.com"
poll_secs = 300
# Replies from email contacts must pass DKIM or SPF for the From domain, as reported
# in your mail server's Authentication-Results header. Name that server here (the
# first word of its header) if it does not add the topmost one.
# authserv_id = "mx.example.com"
# Emailed once if the node stops transmitting after a radio fault (it writes
# state_dir/tx-inhibited), and again at each start while that file is there. Use
# an address you read often, not the node's own mailbox; a phone's email-to-SMS
# address gets only the start of it. Leave it out to only log it.
alert_to = "you@example.com"

# Contacts the field operator can name in TX. For SMS use the carrier's
# email-to-SMS address; replies from the phone come back by email.
[[contacts]]
name = "MOM"
address = "5551234567@vtext.com"

[[contacts]]
name = "BOB"
address = "bob@example.com"

[weather]
# WX with no place gives the last place the field callsign confirmed (kept in
# state_dir/wx_last.json; delete it with the node stopped to forget), and this
# grid square until there is one.
default_grid = "DL89"             # e.g. Big Bend
user_agent = "hfnode (you@example.com)"
periods = 2

# Usual spots, asked for as WX 1, WX 2 and so on (1-99), and printed under the
# code table by `hfnode codes`. Use 6-character grids: a 4-character square is
# about 110 by 190 km. The name is for the printout only and is never sent.
[[weather.presets]]
number = 1
grid = "DL89IG"
name = "Chisos Basin"

[[weather.presets]]
number = 2
grid = "DL89ME"
name = "Rio Grande Village"

# Storm stand-down. While the NWS hourly forecast for the station mentions thunder
# in the next lookahead_hours, or an alert there mentions thunder, lightning or a
# tornado, the node neither tunes nor transmits, and stops any transmission under
# way. Transmitting resumes after clear_minutes without thunder. It fails closed: no
# answer from api.weather.gov means no transmitting. It only listens on, and does not
# disconnect anything. `hfnode storm` runs one check. `run` refuses to start without
# this section; enabled = false runs without the stand-down. US only (the NWS).
[storm]
latitude = 30.2672                # the station's antenna, decimal degrees (not the field spot)
longitude = -97.7431
lookahead_hours = 2
check_minutes = 5
clear_minutes = 30
# user_agent = "hfnode (you@example.com)"   # defaults to weather.user_agent

# Screens replies before they are keyed on air. See docs/reply-filter.md.
[filter]
enabled = true
provider = "claude"               # "claude" (Anthropic API, paid) or "ollama" (local model, free)
api_key_env = "ANTHROPIC_API_KEY" # Claude only
# model = "claude-opus-5-5"       # the Claude default; for Ollama required: a model you have pulled, as `ollama list` shows it
# base_url = "http://localhost:11434"  # Ollama on another machine: http://<its address>:11434
# threads = 2                     # Ollama only: CPU threads; on a Pi leave cores for the decoder
# think = false                   # Ollama only: skip the model's reasoning (faster; some models ignore it); recheck with `hfnode filter test`
# timeout_secs = 600              # default 120 for Claude, 600 for Ollama
extra_policy = ""

# A Quansheng UV-K1 or UV-K5 v3 running the CW firmware in firmware/uv-k1
# (docs/handheld.md), for testing locally on 2 m, with station.rig = "handheld". The
# [station] settings still apply: frequency_hz (simplex, e.g. 144_060_000),
# serial_port (the handheld's USB-C port), key_speed_wpm and max_key_seconds; the
# CI-V ones (baud, civ_address, commissioned, power_watts) do not. The node sets
# nothing on the handheld: set the frequency, CW, the power and break-in at the
# radio, and `hfnode handheld check` compares them with this file. [audio] is the
# cable's sound input from the handheld, and pitch_hz the firmware's CW pitch.
# [handheld]
# power = "low"                   # low (any of LOW1-LOW5), mid or high: as set at the radio
# max_duty_percent = 50           # at most this share of any duty_window_secs on the air
# duty_window_secs = 300
# busy_quiet_ms = 1000            # key only after the squelch has been closed this long
# busy_max_wait_secs = 30         # then give up on the transmission
# commissioned = "none"           # none, listen, keying or done (docs/handheld.md, "Bring-up")
