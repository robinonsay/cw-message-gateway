name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # The mock IC-7300 tests at 20x real time, as on the other systems below.
    env:
      HFNODE_E2E_SCALE: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

  # The node also runs on macOS (Core Audio) and Windows (WASAPI); see
  # docs/macos-setup.md and docs/windows-setup.md. No radio or sound card here: the
  # tests and the self-test drive the mock IC-7300, and `hfnode devices` checks the
  # binary starts and can ask the system for serial ports and audio inputs.
  test-other-os:
    name: clippy, test, selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's runners can hold a test's threads up for a few hundred ms.
          # At 100x real time that is more than the station's keying watchdog
          # (45 s, 0.45 s of real time) or its stuck margin (3 s, 30 ms) allows,
          # and the station forces receive with nothing wrong; run the mock radio
          # 20x real time on CI, as on any slow or busy machine.
          - os: macos-latest
            scale: 20
          - os: windows-latest
            scale: 20
    runs-on: ${{ matrix.os }}
    env:
      HFNODE_E2E_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: build hfnode (release)
        run: cargo build --release -p hfnode

      - name: hfnode selftest
        run: cargo run --release -p hfnode -- selftest --scale ${{ matrix.scale }}

      - name: hfnode devices
        run: cargo run --release -p hfnode -- devices

      - name: Windows start-up script
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/windows/test-supervise.ps1 -Hfnode "$PWD\target\release\hfnode.exe"

      - name: cargo check (x86_64-apple-darwin, Intel Macs)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin --all-targets

  check-pi:
    name: check aarch64 (Raspberry Pi)
    runs-on: ubuntu-latest
    env:
      # ring (pulled in by rustls via lettre, ureq and imap) compiles C/asm in
      # its build script even under `cargo check`, so a cross C compiler is
      # required for the aarch64 target.
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: rustup target add
        run: rustup target add aarch64-unknown-linux-gnu

      - name: cargo check (aarch64-unknown-linux-gnu)
        run: cargo check --target aarch64-unknown-linux-gnu --all-targets

  # The keyer box's firmware (docs/keyer.md): built for the Pico 2's RP2350 and
  # turned into the UF2 file people copy onto it, kept as the run's
  # `pico2-keyer-firmware` artifact with its SHA-256. The compiler is pinned in
  # firmware/pico2-keyer/rust-toolchain.toml and the commit goes into the firmware's
  # `HELLO` as its build, so that what is flashed can be checked against what was
  # audited (the audit's KB-13).
  pico2-keyer:
    name: keyer box firmware (Pico 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/pico2-keyer
    steps:
      - uses: actions/checkout@v4

      # The version firmware/pico2-keyer/rust-toolchain.toml pins, which is what
      # cargo uses there: keep the two the same.
      # llvm-tools: llvm-objdump, for check_faults.py below.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: thumbv8m.main-none-eabihf
          components: rustfmt, clippy, llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/pico2-keyer

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release --locked -- -D warnings

      # build.sh builds the commit at one fixed path, so that anyone's build of it
      # is this same file (README.md, "Building it yourself"), and prints the
      # build id and the UF2's SHA-256 into the log. The box reports the build id
      # in `HELLO`, and `[keyer] firmware_build` is checked against it: eight
      # characters of the commit, which is all `HELLO` carries.
      - name: UF2 and its SHA-256
        run: |
          echo "KEYER_BUILD_ID=$(git rev-parse --short=8 HEAD)" >>"$GITHUB_ENV"
          sh build.sh

      # The fault and panic handlers open the key before anything else (the
      # audit's KB-9), read from the machine code: nothing on a computer can run
      # them. This is the ELF the UF2 was made from.
      - name: fault handlers open the key first
        run: python3 check_faults.py pico2-keyer.elf

      # The same commit from a checkout somewhere else must give the same file.
      # Built in place, a checkout at this second path gives another UF2 than
      # one at the first; build.sh is what makes the two the same.
      - name: the UF2 does not depend on where the checkout is
        run: |
          other="$RUNNER_TEMP/copy/ic-7300-hf-server"
          git worktree add --detach "$other" HEAD
          sh "$other/firmware/pico2-keyer/build.sh"
          cmp pico2-keyer.uf2 "$other/firmware/pico2-keyer/pico2-keyer.uf2"

      - name: summary
        run: |
          {
            echo "### Keyer box firmware"
            echo
            echo "- build id in \`HELLO\`, for \`[keyer] firmware_build\`: \`$KEYER_BUILD_ID\`"
            echo "- UF2 size: $(wc -c <pico2-keyer.uf2) bytes"
            echo "- UF2 SHA-256: \`$(cut -d ' ' -f 1 pico2-keyer.uf2.sha256)\`"
            echo
            echo "Check the file you copy onto the box against that checksum"
            echo "(\`sha256sum\` on Linux, \`shasum -a 256\` on a Mac)."
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pico2-keyer-firmware
          path: |
            firmware/pico2-keyer/pico2-keyer.uf2
            firmware/pico2-keyer/pico2-keyer.uf2.sha256
          if-no-files-found: error

  # hfnode's part of the handheld firmware (firmware/uv-k1/app), compiled for the
  # computer against stand-ins for the radio, with its commands and limits tested.
  # The firmware itself is built by firmware-build below.
  firmware-host-test:
    name: handheld firmware host test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/uv-k1
    steps:
      - uses: actions/checkout@v4

      - name: build and run the host test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
             -I test/stubs -I . test/test_hfnode.c app/hfnode_line.c -o test_hfnode
          ./test_hfnode

  # The handheld firmware itself (firmware/uv-k1/build.sh): the NR7Y CW firmware
  # fetched at the upstream commit the patch was made for, the patch applied and
  # hfnode's files added, built with Ubuntu 24.04's Arm toolchain (GCC 13.2). The
  # .bin to flash with UVTools2 and its SHA-256 are kept as this run's
  # "uv-k1-firmware" download. Building is all this job does: nothing is flashed.
  firmware-build:
    name: handheld firmware build
    runs-on: ubuntu-24.04
    # It runs the upstream firmware's own build (CMake files, a Python script):
    # give it no more than read access to this repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
          arm-none-eabi-gcc --version
          cmake --version

      - name: build
        run: firmware/uv-k1/build.sh "$RUNNER_TEMP/uv-k1"

      - uses: actions/upload-artifact@v4
        with:
          name: uv-k1-firmware
          path: |
            ${{ runner.temp }}/uv-k1/nr7y.cw.hfnode.bin
            ${{ runner.temp }}/uv-k1/nr7y.cw.hfnode.bin.sha256
          if-no-files-found: error
