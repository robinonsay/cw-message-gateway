name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

  # The node also runs on macOS (Core Audio) and Windows (WASAPI); see
  # docs/macos-setup.md and docs/windows-setup.md. No radio or sound card here: the
  # tests and the self-test drive the mock IC-7300, and `hfnode devices` checks the
  # binary starts and can ask the system for serial ports and audio inputs.
  test-other-os:
    name: clippy, test, selftest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's macOS runners wake sleeping threads late by a few ms, which at
          # 100x real time is a few hundred ms of radio time; run the mock radio
          # 20x real time there, as on any slow or busy machine.
          - os: macos-latest
            scale: 20
          - os: windows-latest
            scale: 100
    runs-on: ${{ matrix.os }}
    env:
      HFNODE_E2E_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: build hfnode (release)
        run: cargo build --release -p hfnode

      - name: hfnode selftest
        run: cargo run --release -p hfnode -- selftest --scale ${{ matrix.scale }}

      - name: hfnode devices
        run: cargo run --release -p hfnode -- devices

      - name: Windows start-up script
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deploy/windows/test-supervise.ps1 -Hfnode "$PWD\target\release\hfnode.exe"

      - name: cargo check (x86_64-apple-darwin, Intel Macs)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin --all-targets

  check-pi:
    name: check aarch64 (Raspberry Pi)
    runs-on: ubuntu-latest
    env:
      # ring (pulled in by rustls via lettre, ureq and imap) compiles C/asm in
      # its build script even under `cargo check`, so a cross C compiler is
      # required for the aarch64 target.
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: rustup target add
        run: rustup target add aarch64-unknown-linux-gnu

      - name: cargo check (aarch64-unknown-linux-gnu)
        run: cargo check --target aarch64-unknown-linux-gnu --all-targets

  # hfnode's part of the handheld firmware (firmware/uv-k1/app), compiled for the
  # computer against stand-ins for the radio, with its commands and limits tested.
  # The firmware itself is built by firmware-build below.
  firmware-host-test:
    name: handheld firmware host test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/uv-k1
    steps:
      - uses: actions/checkout@v4

      - name: build and run the host test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
             -I test/stubs -I . test/test_hfnode.c app/hfnode_line.c -o test_hfnode
          ./test_hfnode

  # The handheld firmware itself (firmware/uv-k1/build.sh): the NR7Y CW firmware
  # fetched at the upstream commit the patch was made for, the patch applied and
  # hfnode's files added, built with Ubuntu 24.04's Arm toolchain (GCC 13.2). The
  # .bin to flash with UVTools2 and its SHA-256 are kept as this run's
  # "uv-k1-firmware" download. Building is all this job does: nothing is flashed.
  firmware-build:
    name: handheld firmware build
    runs-on: ubuntu-24.04
    # It runs the upstream firmware's own build (CMake files, a Python script):
    # give it no more than read access to this repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
          arm-none-eabi-gcc --version
          cmake --version

      - name: build
        run: firmware/uv-k1/build.sh "$RUNNER_TEMP/uv-k1"

      - uses: actions/upload-artifact@v4
        with:
          name: uv-k1-firmware
          path: |
            ${{ runner.temp }}/uv-k1/nr7y.cw.hfnode.bin
            ${{ runner.temp }}/uv-k1/nr7y.cw.hfnode.bin.sha256
          if-no-files-found: error
