[package]
name = "auth"
version = "0.1.0"
description = "Precomputed HOTP letter codes for authenticating the field operator"
edition.workspace = true
license.workspace = true

[dependencies]
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# A rename that reaches the disk before it returns (MoveFileExW with
# MOVEFILE_WRITE_THROUGH); see store.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
