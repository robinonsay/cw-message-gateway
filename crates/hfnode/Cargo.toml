[package]
name = "hfnode"
version = "0.1.0"
description = "HF CW message gateway node for the IC-7300"
edition.workspace = true
license.workspace = true

[dependencies]
auth = { path = "../auth" }
civ = { path = "../civ" }
cw = { path = "../cw" }
protocol = { path = "../protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
getrandom = "0.2"
hound = "3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mail-parser = "0.11"

[dev-dependencies]
tempfile = "3"
